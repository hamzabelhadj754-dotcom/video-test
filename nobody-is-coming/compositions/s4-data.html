  <script>
    (function () {
      const START = 21.0, T = (g) => g - START, DUR = 16.5;
      function rng(s) { return function () { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const W = innerWidth, H = innerHeight, LAND = W > H;
      const tl = gsap.timeline({ paused: true });

      // ---------- the maths (exact) ----------
      const N = 365, X0 = 80, X1 = 920, BASE = 760, TOP = 80, BOT = 1120;
      const UPMAX = Math.pow(1.01, N) - 1, DNMAX = 1 - Math.pow(0.99, N);
      const xU = (n) => X0 + (n / N) * (X1 - X0);
      const yU = (n) => BASE - (Math.pow(1.01, n) - 1) / UPMAX * (BASE - TOP);
      const yD = (n) => BASE + (1 - Math.pow(0.99, n)) / DNMAX * (BOT - BASE);
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const sIn = (x) => 1 - Math.cos(x * Math.PI / 2), sIO = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
      // VO: "But get 1% better every day," 21.91–23.90 · "and in a year, you're 37 times better." 24.64–27.41
      function nU(g) { if (g < 21.95) return 0; if (g < 24.1) return 180 * sIO((g - 21.95) / 2.15); if (g < 24.55) return 180; return 180 + 185 * sIn(clamp((g - 24.55) / 1.45, 0, 1)); }
      // VO: "1% worse…" 29.72–31.06 · "and you're almost zero." 31.94–33.13
      function nD(g) { if (g < 29.75) return 0; return 365 * clamp((g - 29.75) / 3.1, 0, 1); }

      // axis ticks
      let ax = ""; [0, 73, 146, 219, 292, 365].forEach((d) => { const x = xU(d); ax += `<line x1="${x}" y1="1150" x2="${x}" y2="1162" stroke="rgba(255,255,255,.2)" stroke-width="2"/><text x="${x}" y="1196" fill="#5f5f67" font-family="JetBrains Mono" font-size="22" text-anchor="middle">D${d}</text>`; });
      document.getElementById("s4-axis").innerHTML = ax;

      // gold motes shed by the rising line (seeded), each fires when the head passes it
      const rm = rng(365), motes = document.getElementById("s4-motes"); let mh = "";
      const moteN = []; for (let i = 0; i < 30; i++) { const n = 120 + rm() * 245; moteN.push(n); mh += `<circle id="s4-m${i}" cx="${xU(n).toFixed(1)}" cy="${yU(n).toFixed(1)}" r="${(2 + rm() * 3).toFixed(1)}" fill="#E8C47A"/>`; }
      motes.innerHTML = mh;
      const tOfU = (n) => { let lo = 21.9, hi = 26.1; for (let k = 0; k < 40; k++) { const m = (lo + hi) / 2; if (nU(m) < n) lo = m; else hi = m; } return lo; };
      moteN.forEach((n, i) => { const t = T(tOfU(n)); tl.fromTo("#s4-m" + i, { opacity: 0, x: 0, y: 0 }, { opacity: 0.9, duration: 0.08, ease: "none" }, t)
        .to("#s4-m" + i, { opacity: 0, x: (rm() - 0.5) * 50, y: -50 - rm() * 120, duration: 1.4 + rm(), ease: "power2.out" }, t + 0.08); });

      const $ = (id) => document.getElementById(id);
      const lu = $("s4-lu"), gu = $("s4-gu"), fu = $("s4-fu"), ld = $("s4-ld"), fd = $("s4-fd"), hu = $("s4-hu"), hu2 = $("s4-hu2"), hd = $("s4-hd"), scan = $("s4-scan");
      const tagU = $("s4-tagU"), tagD = $("s4-tagD"), dayn = $("s4-dayn");
      function path(fx, fy, n) { let d = ""; const step = 1.5; for (let k = 0; k <= n; k += step) d += (k ? "L" : "M") + fx(k).toFixed(1) + " " + fy(k).toFixed(1); d += "L" + fx(n).toFixed(1) + " " + fy(n).toFixed(1); return d; }
      function render(g) {
        const u = nU(g), dn = nD(g);
        if (u > 0.2) { const d = path(xU, yU, u); lu.setAttribute("d", d); gu.setAttribute("d", d); fu.setAttribute("d", d + `L${xU(u).toFixed(1)} ${BASE}L${X0} ${BASE}Z`); }
        else { lu.setAttribute("d", ""); gu.setAttribute("d", ""); fu.setAttribute("d", ""); }
        if (dn > 0.2) { const d = path(xU, yD, dn); ld.setAttribute("d", d); fd.setAttribute("d", d + `L${xU(dn).toFixed(1)} ${BASE}L${X0} ${BASE}Z`); }
        else { ld.setAttribute("d", ""); fd.setAttribute("d", ""); }
        hu.setAttribute("cx", xU(u)); hu.setAttribute("cy", yU(u)); hu2.setAttribute("cx", xU(u)); hu2.setAttribute("cy", yU(u));
        hd.setAttribute("cx", xU(dn)); hd.setAttribute("cy", yD(dn));
        const drawingD = g > 29.6; const sx = drawingD ? xU(dn) : xU(u);

        tagU.textContent = "×" + Math.pow(1.01, u).toFixed(2); gsap.set(tagU, { x: xU(u) - 150, y: yU(u) - 70 });

        dayn.textContent = String(Math.round(drawingD ? dn : u)).padStart(3, "0");
      }
      const drv = { g: START };
      tl.fromTo(drv, { g: START }, { g: START + DUR, duration: DUR, ease: "none", onUpdate: () => render(drv.g) }, 0);

      // ---------- one camera, no cuts ----------
      // aim(p, s, q): put wall point p (wall px) on screen point q (fractions of the frame) at scale s
      const C0 = [500, 600];
      function aim(p, s, q) { return { x: q[0] * W - W / 2 - s * (p[0] - C0[0]), y: q[1] * H - H / 2 - s * (p[1] - C0[1]), scale: s }; }
      const P = LAND
        ? { k: 0.62, O: [634 / 1920, 560 / 1080], fol: [0.5, 0.58], hi: [0.72, 0.3], mid: [0.5, 0.5], low: [0.5, 0.6], end: [0.56, 0.62], fin: [0.5, 0.52] }
        : { k: 1.0, O: [0.5, 760 / 1920], fol: [0.52, 0.52], hi: [0.74, 0.25], mid: [0.5, 0.42], low: [0.5, 0.5], end: [0.52, 0.5], fin: [0.5, 0.44] };
      const k = P.k, cam = "#s4-world";
      const O = [80, 760];
      tl.fromTo(cam, { ...aim(O, 2.4 * k, P.O), rotationX: 0, rotationY: 0, opacity: 1 }, { ...aim(O, 2.15 * k, [P.O[0] - 0.04, P.O[1] + 0.06]), rotationY: -4, duration: 0.95, ease: "sine.inOut" }, 0);
      // follow the head as the line starts to climb (anticipate: the camera leads toward where it goes)
      tl.to(cam, { ...aim([xU(190), yU(190)], 1.65 * k, P.fol), rotationY: -9, rotationX: 4, duration: 2.3, ease: "sine.inOut" }, T(21.95));
      // the rocket: tilt up with it
      tl.to(cam, { ...aim([xU(365), yU(365)], 1.1 * k, P.hi), rotationY: -12, rotationX: -6, duration: 1.95, ease: "power2.inOut" }, T(24.25));
      // breathe out to reveal the whole climb (rest)
      tl.to(cam, { ...aim([520, 420], 0.86 * k, P.mid), rotationY: -5, rotationX: 0, duration: 2.6, ease: "power2.inOut" }, T(26.3));
      // follow the sinking line down

      tl.to(cam, { ...aim([xU(330), yD(330) - 120], 1.15 * k, P.end), rotationY: 9, rotationX: 4, duration: 1.9, ease: "sine.inOut" }, T(31.4));
      // orbit back and settle on the gap between the lines (rest)
      tl.to(cam, { ...aim([520, 600], 0.76 * k, P.fin), rotationY: -6, rotationX: 2, duration: 2.4, ease: "power2.inOut" }, T(33.3));
      tl.to(cam, { rotationY: -3, duration: 1.2, ease: "sine.inOut" }, T(35.7));
      // push through the gap into darkness (hidden seam into scene 5)
      tl.to(cam, { ...aim([780, 600], 5.0 * k, [0.5, 0.5]), rotationY: 0, rotationX: 0, duration: 1.15, ease: "power3.in" }, T(36.3));
      tl.to(["#s4-world", "#s4-spot"], { opacity: 0, duration: 0.6, ease: "power2.in" }, T(36.85));
      tl.to("#s4-hud", { opacity: 0, duration: 0.4, ease: "power2.in" }, T(36.5));

      tl.fromTo("#s4-floor", { opacity: 0 }, { opacity: 1, duration: 1.6, ease: "power2.out" }, 0.1);
      tl.fromTo("#s4-grid", { opacity: 0 }, { opacity: 1, duration: 1.6, ease: "power2.out" }, 0.3);
      tl.fromTo("#s4-olab", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 0.25);
      tl.fromTo("#s4-hud", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0.6);
      tl.fromTo("#s4-fn2", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.to("#s4-fn2", { opacity: 1, duration: 0.5, ease: "power2.out" }, T(29.6));
      tl.to("#s4-fn1", { opacity: 0.45, duration: 0.5, ease: "power2.out" }, T(29.6));
      tl.to("#s4-fn1", { opacity: 1, duration: 0.5, ease: "power2.out" }, T(33.4));
      tl.fromTo("#s4-tagU", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, T(22.0));
      tl.to("#s4-tagU", { opacity: 0, duration: 0.25, ease: "power2.in" }, T(25.85));
      tl.fromTo("#s4-tagD", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, T(29.8));
      tl.to("#s4-tagD", { opacity: 0, duration: 0.25, ease: "power2.in" }, T(32.75));
      tl.fromTo(["#s4-hd"], { opacity: 0 }, { opacity: 1, duration: 0.2 }, T(29.75));
      tl.fromTo("#s4-scan", { opacity: 0 }, { opacity: 1, duration: 0.4 }, T(21.95));
      tl.to("#s4-scan", { opacity: 0, duration: 0.4 }, T(26.1));
      tl.to("#s4-scan", { opacity: 0.8, duration: 0.3 }, T(29.75));
      tl.to("#s4-scan", { opacity: 0, duration: 0.4 }, T(32.9));

      const HIT = T(26.0);
      tl.fromTo("#s4-bigU", { opacity: 0, scale: 1.25, filter: "blur(14px)", transformOrigin: "100% 50%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, HIT);
      tl.fromTo("#s4-pulse", { attr: { r: 14 }, opacity: 0 }, { attr: { r: 14 }, opacity: 0, duration: 0.01 }, 0);

      tl.fromTo("#s4-flash", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

      tl.fromTo("#s4-hu2", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.01 }, 0);

      // 0.03 lands on "zero" (32.81)
      tl.fromTo("#s4-bigD", { opacity: 0, y: -30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, T(32.85));

      tl.fromTo("#s4-gapline", { scaleY: 0, transformOrigin: "50% 50%" }, { scaleY: 1, duration: 0.9, ease: "expo.out" }, T(33.7));
