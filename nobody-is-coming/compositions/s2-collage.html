        <g fill="#d88a78" opacity=".55">
          <rect x="520" y="64" width="320" height="14"/><rect x="520" y="98" width="320" height="14"/><rect x="520" y="132" width="320" height="14"/><rect x="520" y="166" width="320" height="14"/><rect x="520" y="200" width="320" height="14"/><rect x="520" y="234" width="320" height="14"/><rect x="520" y="268" width="320" height="14"/><rect x="520" y="302" width="320" height="14"/>

          <clipPath id="s2cC"><rect x="56" y="48" width="768" height="392"/></clipPath>

  <script>
    (function () {
      const START = 4.6, T = (g) => g - START;
      function rng(s) { return function () { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const LAND = innerWidth > innerHeight;
      const PW = 880, PH = 600;

      // ---- build torn halves: same art, two complementary jagged clip paths ----
      function jag(r, x0, x1, yBase, amp, steps, slope) {
        const pts = [];
        for (let i = 0; i <= steps; i++) { const x = x0 + (x1 - x0) * i / steps; pts.push([x, yBase + slope * (x - x0) + (r() - 0.5) * amp]); }
        return pts;
      }
      const seeds = { A: 11, B: 23, C: 37 };
      ["A", "B", "C"].forEach((k) => {
        const r = rng(seeds[k]);
        const top = jag(r, 0, PW, 6, 10, 40, 0);
        const bot = jag(r, 0, PW, PH - 8, 14, 40, 0);
        const tear = jag(r, -4, PW + 4, PH * 0.42, 34, 26, (k === "B" ? -0.09 : 0.08));
        const fmt = (a) => a.map((p) => p[0].toFixed(1) + "px " + p[1].toFixed(1) + "px").join(",");
        const tPoly = "polygon(" + fmt(top) + "," + fmt(tear.slice().reverse()) + ")";
        const bPoly = "polygon(" + fmt(tear) + "," + fmt(bot.slice().reverse()) + ")";
        const src = document.querySelector('#s2-art-src svg[data-src="' + k + '"]');
        [["t", tPoly], ["b", bPoly]].forEach(([h, poly]) => {
          const half = document.getElementById("s2-p" + k + "-" + h);
          const art = document.createElement("div"); art.className = "s2-art";
          art.appendChild(src.cloneNode(true));
          ["s2-ht", "s2-fib", "s2-edge", "s2-dim"].forEach((c) => { const d = document.createElement("div"); d.className = c + (c === "s2-dim" ? " s2-dim-" + k : ""); art.appendChild(d); });
          art.style.clipPath = poly;
          half.appendChild(art);
        });
      });

      const tl = gsap.timeline({ paused: true });
      const shake = (t, amt, seed) => {
        const r = rng(seed); let tt = t;
        for (let i = 0; i < 6; i++) { tl.to("#s2-cam", { x: (r() - 0.5) * amt * (1 - i / 6), y: (r() - 0.5) * amt * (1 - i / 6), duration: 0.04, ease: "none" }, tt); tt += 0.04; }
        tl.to("#s2-cam", { x: 0, y: 0, duration: 0.08, ease: "power2.out" }, tt);
      };
      tl.fromTo("#s2-cam", { x: 0, y: 0 }, { x: 0, y: 0, duration: 0.01 }, 0);
      tl.fromTo("#s2-dolly", { y: 0, scale: 1, rotation: 0 }, { y: 0, scale: 1, rotation: 0, duration: 0.01 }, 0);
      tl.fromTo("#s2-amb", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);

      function slam(k, t, rot, seed) {
        const P = "#s2-p" + k;
        tl.fromTo(P, { opacity: 0, scale: 1.32, rotation: rot * 2.4, y: -30, filter: "blur(10px)" },
          { opacity: 1, scale: 1, rotation: rot, y: 0, filter: "blur(0px)", duration: 0.42, ease: "expo.out" }, T(t));
        tl.fromTo(P + "-fig", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, T(t) + 0.18);
        // slow handheld drift while it is held
        tl.fromTo(P + "-in", { x: 0, y: 0, rotation: 0 }, { x: (seed % 2 ? 10 : -12), y: -8, rotation: (seed % 2 ? 0.8 : -0.8), duration: 2.4, ease: "sine.inOut" }, T(t) + 0.2);
        shake(T(t) + 0.12, 14, seed);
        // whip back up from the fall into the new slam (fast, motion-blurred)
        if (t > 5) tl.to("#s2-dolly", { y: 0, scale: 1, rotation: 0, duration: 0.32, ease: "power3.out" }, T(t) - 0.04);
      }
      function strike(k, t, dur) {
        tl.fromTo("#s2-p" + k + "-st", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: dur, ease: "power4.out" }, T(t));
      }
      function tear(k, t) {
        const P = "#s2-p" + k;
        tl.to(".s2-dim-" + k, { opacity: 0.45, duration: 0.3, ease: "power2.out" }, T(t) - 0.5)
          .to(".s2-dim-" + k, { opacity: 0.85, duration: 0.7, ease: "power2.in" }, T(t) + 0.12);
        // rip: halves pull apart, then fall into the dark
        tl.to(P + "-t", { y: -16, x: -8, rotation: -2.5, duration: 0.12, ease: "power3.out" }, T(t))
          .to(P + "-t", { y: 360, x: -90, rotation: -16, opacity: 0, duration: 0.7, ease: "power3.in" }, T(t) + 0.12);
        tl.to(P + "-b", { y: 18, x: 10, rotation: 2.5, duration: 0.12, ease: "power3.out" }, T(t))
          .to(P + "-b", { y: 560, x: 90, rotation: 12, opacity: 0, duration: 0.78, ease: "power3.in" }, T(t) + 0.12);
        tl.to([P + "-sh", P + "-fig", P + "-st", P + " .s2-tape"], { opacity: 0, duration: 0.3, ease: "power3.in" }, T(t));
        // the camera tilts down after the pieces as they drop
        tl.to("#s2-dolly", { y: -150, scale: 1.05, rotation: k === "A" ? 1.2 : -1.2, duration: 0.42, ease: "power2.in" }, T(t) + 0.12);
      }

      // VO: "Not your boss." 4.87–5.94 · "Not your family." 7.08–8.16 · "Not motivation." 9.50–10.58
      slam("A", 4.62, -2.2, 3);  strike("A", 5.40, 0.24); tear("A", 6.40);
      slam("B", 6.92, 1.8, 6);   strike("B", 7.70, 0.24); tear("B", 8.70);
      slam("C", 9.30, -1.2, 9);  strike("C", 9.80, 0.6);

      // the poster burns down: sky darkens, the sun sets, one ember survives
      tl.to("#s2-dolly", { scale: 1.12, y: LAND ? 30 : 40, duration: 1.2, ease: "power2.inOut" }, T(9.75));
      tl.to("#s2-dolly", { scale: 1, y: 0, duration: 0.9, ease: "power2.inOut" }, T(10.95));
      tl.to(".s2-dim-C", { opacity: 0.82, duration: 1.0, ease: "power2.inOut" }, T(10.6));
      tl.to(".s2-sun", { y: 70, duration: 1.2, ease: "power2.in" }, T(10.5));
      tl.to("#s2-amb", { opacity: 0, duration: 1.0, ease: "power2.in" }, T(10.8));
      tl.to("#s2-pC", { scale: 0.86, opacity: 0, filter: "blur(6px)", duration: 0.7, ease: "power3.in" }, T(11.35));

      // ember: from the sun's position to the centre of the next scene's gauge
      const sunX = innerWidth / 2, sunY = (LAND ? 190 : 470) + 400;
      const tgtX = LAND ? innerWidth * 0.33 : innerWidth / 2, tgtY = LAND ? 560 : 760;
      tl.set("#s2-ember", { x: sunX, y: sunY + 40, opacity: 0, scale: 0.4 }, 0);
      tl.to("#s2-ember", { opacity: 1, scale: 1, y: sunY + 20, duration: 0.5, ease: "power2.out" }, T(11.05));
      tl.to("#s2-ember", { x: tgtX, y: tgtY, duration: 0.6, ease: "power2.inOut" }, T(11.55));

      window.__timelines["s2"] = tl;
    })();
  </script>
