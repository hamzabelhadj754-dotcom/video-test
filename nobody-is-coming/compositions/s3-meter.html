  <script>
    (function () {
      const START = 12.2, T = (g) => g - START, DUR = 8.8;
      function rng(s) { return function () { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const LAND = innerWidth > innerHeight;
      const tl = gsap.timeline({ paused: true });
      const C = 2 * Math.PI * 206;

      // ring ticks
      const tk = document.getElementById("s3-ticks"); let ts = "";
      for (let i = 0; i < 60; i++) { const a = i / 60 * Math.PI * 2, r1 = 230, r2 = i % 5 ? 236 : 244;
        ts += `<line x1="${240 + Math.sin(a) * r1}" y1="${240 - Math.cos(a) * r1}" x2="${240 + Math.sin(a) * r2}" y2="${240 - Math.cos(a) * r2}" stroke="rgba(255,255,255,${i % 5 ? .1 : .22})" stroke-width="2"/>`; }
      tk.innerHTML = ts;

      // ---------- the meter as a pure function of time (seek-safe) ----------
      const r = rng(77), jit = []; for (let i = 0; i < 80; i++) jit.push(r() - 0.5);
      const ease2 = (x) => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
      function V(g) {
        if (g < 12.9) return 0;
        if (g < 14.3) return 100 * ease2((g - 12.9) / 1.4);
        if (g < 16.0) return 100;
        const k = Math.log(100 / 8) / 3.6;
        if (g < 19.6) {
          const s = (g - 16.0) / 0.12, i = Math.floor(s), f = s - i;
          const j = jit[i % 80] * (1 - f) + jit[(i + 1) % 80] * f;
          const bump = (g > 17.6 && g < 18.0) ? 9 * Math.sin((g - 17.6) / 0.4 * Math.PI) : 0; // a false surge of hope
          return Math.max(3, 100 * Math.exp(-k * (g - 16.0)) * (1 + 0.16 * j) + bump);
        }
        const s = (g - 19.6) / 0.2, i = Math.floor(s); return 8 + jit[(i + 7) % 80] * 2.4;
      }
      // x-position on the week sparkline: Monday fills, the decay runs Tue→Sun
      function D(g) { if (g < 12.9) return 0; if (g < 16.0) return Math.min(1, (g - 12.9) / 1.4) * 0.35; return 0.35 + Math.min(1, (g - 16.0) / 3.6) * 5.4; }
      const num = document.getElementById("s3-num"), arc = document.getElementById("s3-arc"), glow = document.getElementById("s3-arc-glow"),
        hd = document.getElementById("s3-head-dot"), sl = document.getElementById("s3-sline"), sf = document.getElementById("s3-sfill");
      arc.setAttribute("stroke-dasharray", C); glow.setAttribute("stroke-dasharray", C);
      const gold = [212, 166, 74], grey = [92, 92, 100];
      function render(g) {
        const v = V(g), p = v / 100;
        num.textContent = Math.round(v);
        const off = C * (1 - p); arc.setAttribute("stroke-dashoffset", off); glow.setAttribute("stroke-dashoffset", off);
        const m = Math.min(1, Math.max(0, (70 - v) / 55)), col = gold.map((c, i) => Math.round(c + (grey[i] - c) * m));
        const cs = `rgb(${col.join(",")})`; arc.setAttribute("stroke", cs); glow.setAttribute("stroke", cs);
        glow.setAttribute("opacity", (0.15 + 0.6 * p * (1 - m)).toFixed(3));
        const a = p * Math.PI * 2; hd.setAttribute("cx", 240 + Math.sin(a) * 206); hd.setAttribute("cy", 240 - Math.cos(a) * 206);
        hd.setAttribute("opacity", v > 0.5 ? 1 : 0);
        // sparkline = the recorded history of the meter
        const W = 808, H = 96, n = 90, g0 = 12.9; let d = "", last = [0, H];
        if (g > g0) {
          for (let i = 0; i <= n; i++) { const gg = g0 + (g - g0) * i / n; const x = D(gg) / 6 * W, y = H - 6 - V(gg) / 100 * (H - 14); d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1); last = [x, y]; }
          sl.setAttribute("d", d); sf.setAttribute("d", d + `L${last[0].toFixed(1)} ${H}L0 ${H}Z`);
        } else { sl.setAttribute("d", ""); sf.setAttribute("d", ""); }
      }
      const drv = { g: START };
      tl.fromTo(drv, { g: START }, { g: START + DUR, duration: DUR, ease: "none", onUpdate: () => render(drv.g) }, 0);

      // ---------- entrance: the ember becomes the gauge ----------
      tl.fromTo("#s3-burst", { scale: 0.05, opacity: 1 }, { scale: 1.15, opacity: 0, duration: 0.7, ease: "expo.out" }, 0);
      tl.fromTo("#s3-dot", { scale: 1, opacity: 1 }, { scale: 0, opacity: 0, duration: 0.35, ease: "power3.in" }, 0.05);
      tl.fromTo("#s3-card", { opacity: 0, scale: 0.9, z: -120, filter: "blur(8px)" }, { opacity: 1, scale: 1, z: 0, filter: "blur(0px)", duration: 0.9, ease: "expo.out" }, 0.1);
      tl.fromTo("#s3-week", { opacity: 0, y: 70, rotationX: 24 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.9, ease: "expo.out" }, 0.3);
      tl.fromTo("#s3-amb", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0.1);
      [["#s3-card-sh", 0.35], ["#s3-week-sh", 0.55]].forEach(([s, t]) => tl.fromTo(s, { xPercent: -120 }, { xPercent: 320, duration: 1.1, ease: "power2.inOut" }, t));
      // the camera drifts: a slow 3D parallax across the whole scene
      tl.fromTo("#s3-cam", { rotationX: 9, rotationY: -7, y: 20 }, { rotationX: 2, rotationY: 6, y: -10, duration: T(20.35), ease: "sine.inOut" }, 0);
      tl.set("#s3-t1", { z: 60 }, 0); tl.set(["#s3-t2", "#s3-t3"], { z: 60 }, 0); tl.set("#s3-week", { z: -40 }, 0);

      // ---------- toasts (each one is the cause of what the meter does next) ----------
      const tin = (id, t) => tl.fromTo(id, { opacity: 0, y: -60, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, T(t));
      const tout = (id, t) => tl.to(id, { opacity: 0, y: -30, scale: 0.94, filter: "blur(4px)", duration: 0.35, ease: "power3.in" }, T(t));
      tin("#s3-t1", 12.72); tl.fromTo("#s3-t1-sh", { xPercent: -120 }, { xPercent: 320, duration: 0.9, ease: "power2.inOut" }, T(12.9));
      tout("#s3-t1", 15.55); tin("#s3-t2", 15.8); tout("#s3-t2", 18.05); tin("#s3-t3", 18.3);

      // ---------- status chips ----------
      tl.set(["#s3-chipA", "#s3-chipB", "#s3-chipC"], { opacity: 0, xPercent: -50 }, 0);
      tl.fromTo("#s3-chipA", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, T(14.3));
      tl.fromTo("#s3-livedot", { scale: 1 }, { scale: 1.8, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, T(14.3));
      tl.to("#s3-chipA", { opacity: 0, duration: 0.2, ease: "power2.in" }, T(16.7));
      tl.fromTo("#s3-chipB", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, T(16.8));
      tl.to("#s3-chipB", { opacity: 0, duration: 0.2, ease: "power2.in" }, T(18.6));
      tl.fromTo("#s3-chipC", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, T(18.7));
      tl.to("#s3-livedot", { backgroundColor: "#6B6B73", boxShadow: "0 0 0px #6B6B73", duration: 1.2, ease: "power2.inOut" }, T(17.0));
      tl.to("#s3-amb", { opacity: 0.2, duration: 3.0, ease: "power2.inOut" }, T(16.2));

      // ---------- calendar flip MON → TUE on "Tuesday" ----------
      tl.set("#s3-tue", { rotationX: -90, transformOrigin: "50% 50%" }, 0);
      tl.fromTo("#s3-mon", { rotationX: 0 }, { rotationX: 90, duration: 0.16, ease: "power2.in" }, T(17.0));
      tl.to("#s3-tue", { rotationX: 0, duration: 0.3, ease: "back.out(1.6)" }, T(17.16));
      const dayEls = document.querySelectorAll("#s3-days span");
      tl.set(dayEls[0], { color: "#D4A64A" }, T(12.9)); tl.set(dayEls[0], { color: "#6B6B73" }, T(17.04)); tl.set(dayEls[1], { color: "#EDEDED" }, T(17.04));

      // ---------- exit: everything falls back; the last spark of the ring collapses to a dot ----------
      tl.to(["#s3-t3", "#s3-week"], { opacity: 0, y: 40, filter: "blur(6px)", duration: 0.45, ease: "power3.in", stagger: 0.06 }, T(20.2));
      tl.to(["#s3-head", ".s3-chips", "#s3-val", "#s3-sub"], { opacity: 0, duration: 0.35, ease: "power3.in" }, T(20.3));
      tl.to("#s3-card", { opacity: 0, scale: 0.97, duration: 0.45, ease: "power3.in" }, T(20.35));
      tl.to("#s3-ring", { scale: 0.05, opacity: 0, duration: 0.5, ease: "power3.in" }, T(20.4));
      tl.to("#s3-cam", { rotationX: 0, rotationY: 0, y: 0, duration: 0.5, ease: "power2.inOut" }, T(20.35));
      tl.fromTo("#s3-dot", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, T(20.72));

      window.__timelines["s3"] = tl;
    })();
  </script>
