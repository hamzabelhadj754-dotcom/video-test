<template>
  <style>
    @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2"); font-style: normal; }
    @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); font-style: italic; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #07070A; }
    #s1-cam, #s1-punch { position: absolute; inset: 0; }
    #s1-glow { position: absolute; left: 50%; top: 50%; width: 1500px; height: 900px; margin: -450px 0 0 -750px;
      background: radial-gradient(ellipse at center, rgba(237,232,220,.11) 0%, rgba(237,232,220,.035) 38%, transparent 68%); }
    #s1-streak { position: absolute; left: 50%; top: 50%; width: 1100px; height: 2px; margin: 132px 0 0 -550px;
      background: linear-gradient(90deg, transparent, rgba(237,237,237,.55) 30%, rgba(255,250,240,.95) 50%, rgba(237,237,237,.55) 70%, transparent); }
    #s1-streak-soft { position: absolute; left: 50%; top: 50%; width: 1300px; height: 90px; margin: 88px 0 0 -650px;
      background: radial-gradient(ellipse at center, rgba(237,232,220,.16), transparent 70%); }
    .s1-lines { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-58%); text-align: center; font-family: "Instrument Serif", serif; color: #EDEDED; }
    .s1-l1 { font-size: 150px; line-height: 1; letter-spacing: -0.02em; }
    .s1-l2 { font-size: 200px; line-height: 1.04; letter-spacing: -0.025em; margin-top: 18px; }
    .s1-w { display: inline-block; will-change: transform, filter, opacity; }
    .s1-it { font-style: italic; padding-right: .04em; }
    #s1-dust { position: absolute; inset: 0; }
    .s1-mote { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: rgba(237,230,214,.7); }
    @media (orientation: landscape) {
      .s1-l1 { font-size: 128px; }
      .s1-l2 { font-size: 172px; margin-top: 8px; }
      #s1-streak { margin-top: 112px; }
      #s1-streak-soft { margin-top: 70px; }
    }
  </style>
  <div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
    <div id="s1-cam">
      <div id="s1-punch">
        <div id="s1-glow"></div>
        <div id="s1-streak-soft"></div>
        <div id="s1-streak"></div>
        <div id="s1-dust"></div>
        <div class="s1-lines" data-layout-allow-overlap>
          <div class="s1-l1" id="s1-line1"><span class="s1-w" id="s1-w1">Nobody</span> <span class="s1-w" id="s1-w2">is</span> <span class="s1-w" id="s1-w3">coming</span></div>
          <div class="s1-l2" id="s1-line2"><span class="s1-w" id="s1-w4">to</span> <span class="s1-w s1-it" id="s1-w5">save</span> <span class="s1-w" id="s1-w6">you.</span></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const START = 0, T = (g) => g - START;
      function rng(s) { return function () { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const W = innerWidth, H = innerHeight;
      const tl = gsap.timeline({ paused: true });

      // dust motes drifting through the light (seeded)
      const r = rng(101), dust = document.getElementById("s1-dust");
      for (let i = 0; i < 34; i++) {
        const m = document.createElement("div"); m.className = "s1-mote"; m.id = "s1-m" + i;
        const sz = 2 + r() * 4; m.style.width = m.style.height = sz + "px";
        m.style.left = (W * 0.15 + r() * W * 0.7) + "px"; m.style.top = (H * 0.25 + r() * H * 0.5) + "px";
        dust.appendChild(m);
        tl.fromTo(m, { opacity: 0, x: 0, y: 0 }, { opacity: 0.15 + r() * 0.5, x: (r() - 0.5) * 60, y: -40 - r() * 90, duration: 4.6, ease: "sine.inOut" }, 0);
      }

      // slow camera push for the whole hook
      tl.fromTo("#s1-cam", { scale: 1.0 }, { scale: 1.07, duration: 4.6, ease: "sine.inOut" }, 0);
      tl.fromTo("#s1-glow", { opacity: 0.35, scale: 0.9 }, { opacity: 0.6, scale: 1, duration: 1.7, ease: "sine.inOut" }, 0);

      // word-by-word blur-to-sharp reveal, keyed to the VO words
      const words = [["#s1-w2", 0.84], ["#s1-w3", 1.0], ["#s1-w4", 1.5], ["#s1-w5", 1.66], ["#s1-w6", 2.02]];
      words.forEach(([id, t]) => {
        tl.fromTo(id, { opacity: 0, filter: "blur(16px)", y: 46, scale: 0.97 },
          { opacity: 1, filter: "blur(0px)", y: 0, scale: 1, duration: 0.95, ease: "expo.out", immediateRender: true }, Math.max(0, T(t)));
      });
      // first word is already half-formed on frame 0, so frame 0 is never black
      tl.set("#s1-w1", { opacity: 0.35, filter: "blur(9px)", y: 22 }, 0);
      tl.fromTo("#s1-w1", { opacity: 0.35, filter: "blur(9px)", y: 22 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.9, ease: "expo.out" }, 0);

      // the hit on "save": punch-in, light streak, glow bloom, line 1 recedes
      const HIT = T(1.72);
      tl.fromTo("#s1-punch", { scale: 1 }, { scale: 1.045, duration: 0.07, ease: "power2.out" }, HIT)
        .to("#s1-punch", { scale: 1, duration: 0.9, ease: "expo.out" }, HIT + 0.07);
      tl.fromTo("#s1-streak", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, HIT)
        .to("#s1-streak", { opacity: 0.18, duration: 1.6, ease: "power2.out" }, HIT + 0.5);
      tl.fromTo("#s1-streak-soft", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: "expo.out" }, HIT)
        .to("#s1-streak-soft", { opacity: 0.25, duration: 1.8, ease: "power2.out" }, HIT + 0.45);
      tl.to("#s1-glow", { opacity: 1, scale: 1.12, duration: 0.12, ease: "power2.out" }, HIT)
        .to("#s1-glow", { opacity: 0.55, scale: 1.04, duration: 1.4, ease: "power2.out" }, HIT + 0.12);
      tl.to("#s1-line1", { opacity: 0.26, duration: 0.9, ease: "power2.out" }, HIT + 0.1);

      // rest, then dissolve upward into the dark (exit is faster than entrance)
      tl.to(".s1-w", { opacity: 0, filter: "blur(14px)", y: -36, duration: 0.45, ease: "power3.in", stagger: 0.04 }, T(3.95));
      tl.to(["#s1-streak", "#s1-streak-soft", "#s1-glow"], { opacity: 0, duration: 0.5, ease: "power3.in" }, T(4.0));
      tl.to("#s1-dust", { opacity: 0, duration: 0.4, ease: "power2.in" }, T(4.1));

      window.__timelines["s1"] = tl;
    })();
  </script>
</template>
