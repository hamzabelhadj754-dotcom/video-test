<!doctype html>
<html lang="en" data-composition-variables='[{"id":"handle","type":"string","label":"End-card handle","default":"@yourhandle"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- Three.js r147 (MIT) + the film's 3D heroes, loaded once for every scene -->
    <script src="assets/vendor/three/three.min.js"></script>
    <script src="assets/vendor/three/RoomEnvironment.js"></script>
    <script src="assets/vendor/three/RGBELoader.js"></script>
    <script src="assets/3d/common.js"></script>

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #08090B; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #bg { position: absolute; inset: 0; background: #08090B; }
    </style>
  </head>
  <body>
    <!-- 62 s · 124 BPM (beat = 0.48387 s); every scene boundary is a downbeat -->

      <div id="bg"></div>
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1-hook.html"     data-start="0"      data-duration="3.871"  data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>

      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4-system.html"   data-start="24.194" data-duration="11.612" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>

      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6-kinetic.html"  data-start="45.968" data-duration="9.193"  data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="s7" data-composition-id="s7" data-composition-src="compositions/s7-end.html"      data-start="55.161" data-duration="6.839"  data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="62" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:5"></div>

    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
