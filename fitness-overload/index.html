<!doctype html>
<html lang="en" data-composition-variables='[{"id":"handle","type":"string","label":"Handle","default":"@YOURHANDLE"}]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  @font-face { font-family: "Bebas"; src: url("assets/fonts/BebasNeue-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Script"; src: url("assets/fonts/MrsSaintDelafield-Regular.woff2") format("woff2"); }
  :root { --red:#E3243B; --cream:#F3EFE7; --ink:#111113; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050506; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #050506; font-family: "Inter", sans-serif; }
  .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .sc { visibility: hidden; overflow: hidden; }
  .dark { background: linear-gradient(180deg, #050506 0%, #0B0708 38%, #3A0D16 78%, #5E1622 100%); color: #fff; }
  .light { background: var(--cream); color: var(--ink); }
  .grid { position: absolute; left: -120px; top: -120px; width: 1320px; height: 2160px; background-image: linear-gradient(rgba(255,255,255,.08) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,.08) 1.5px, transparent 1.5px); background-size: 120px 120px; background-position: 60px 0; }
  .fadeTop { -webkit-mask: linear-gradient(180deg, transparent 0%, #000 30%); mask: linear-gradient(180deg, transparent 0%, #000 30%); }
  .abs { position: absolute; }
  .center { position: absolute; left: 120px; right: 120px; text-align: center; }
  .bebas { font-family: "Bebas"; text-transform: uppercase; letter-spacing: .01em; }
  .script { font-family: "Script"; color: var(--red); }
  .glowR { text-shadow: 0 0 24px rgba(227,36,59,.55), 0 0 60px rgba(227,36,59,.3); }
  .chip { position: absolute; right: 120px; top: 250px; padding: 8px 14px; background: #fff; color: #111; font: 800 18px/1 Inter; letter-spacing: .06em; }
  .light .chip { background: #111; color: #fff; }
  .w { display: inline-block; will-change: transform, opacity, filter; }
  .vig { background: radial-gradient(ellipse 90% 75% at 50% 50%, transparent 55%, rgba(0,0,0,.5) 100%); pointer-events: none; }
  .light .vigL { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 75% at 50% 50%, transparent 60%, rgba(120,110,95,.18) 100%); }
  #grain { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2040px; opacity: .07; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='9' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .row { display: flex; align-items: center; gap: 18px; }
  .row svg { width: 38px; height: 38px; stroke: #fff; flex: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-fps="30">

<!-- ===== 1 · HOOK (dark) ===== -->
<section class="sc full dark" id="s1"><div class="cam full">
  <div class="grid fadeTop" id="s1-grid"></div>
  <div class="abs" id="s1-circle" style="left:110px; top:930px; width:860px; height:860px; border-radius:50%; background: radial-gradient(circle at 50% 45%, #F23A50 0%, #E3243B 55%, #B8162B 100%); box-shadow: 0 0 120px rgba(227,36,59,.55), 0 0 260px rgba(227,36,59,.3)"></div>
  <img class="abs" id="s1-hero" src="assets/photos/flex_bw.png" alt="" style="left:-20px; top:1000px; width:1120px; filter: drop-shadow(0 -10px 40px rgba(0,0,0,.6)) contrast(1.05)" />
  <div class="abs" style="left:0; right:0; bottom:0; height:380px; background: linear-gradient(180deg, transparent, rgba(40,8,14,.95))"></div>
  <div id="s1-text" class="full">
    <div class="center script" id="s1-script" style="top:300px; font-size:120px; line-height:1.15; transform: rotate(-6deg)">same weight…</div>
    <div class="center bebas" style="top:420px; font-size:205px; line-height:.9; color:#fff; white-space:nowrap"><span class="w" id="w-same">Same</span> <span class="w" id="w-body">body.</span></div>
    <div class="center bebas glowR" id="s1-sub" style="top:620px; font-size:58px; letter-spacing:.12em; color:var(--red)">No new muscle</div>
  </div>
  <div class="chip handle" id="s1-chip">@YOURHANDLE</div>
</div><div class="full vig"></div></section>

<!-- ===== 2 · PROBLEM (cream) ===== -->
<section class="sc full light" id="s2"><div class="cam full">
  <svg class="abs" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0; top:0; overflow:visible"><path id="s2-swoosh" d="M-120 380 C 420 520, 620 980, 300 1500 S 260 2100, 700 2300" stroke="#CFCBC3" stroke-width="170" fill="none" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1.2" stroke-dashoffset="1.1"/></svg>
  <div class="center" style="top:430px"><span style="font:600 62px/1 Inter; letter-spacing:-.02em"><span class="w" id="w-your">Your</span> <span class="w" id="w-muscles">muscles</span></span><br><span style="font:900 150px/1 Inter; letter-spacing:-.045em; color:var(--red)"><span class="w" id="w-stop">stop</span> <span class="w" id="w-growing">growing</span></span></div>
  <div class="abs" id="card" style="left:300px; top:880px; width:480px; transform-origin: 50% 0%; background: linear-gradient(180deg,#8F8F94,#76767B); box-shadow: 0 40px 70px rgba(60,50,40,.35), 0 8px 18px rgba(60,50,40,.25); padding: 44px 40px 46px; color:#fff">
    <div style="font:700 64px/1 Inter; letter-spacing:-.02em; padding-bottom:18px; border-bottom:3px solid rgba(255,255,255,.75)">Your log</div>
    <div id="logrows" style="margin-top:26px; display:flex; flex-direction:column; gap:22px; font:600 34px/1 Inter"></div>
  </div>
  <div class="chip handle">@YOURHANDLE</div>
</div><div class="vigL"></div></section>

<!-- transition layers -->
<div class="abs" id="disc" style="left:518px; top:836px; width:44px; height:44px; border-radius:50%; background:#E3243B">
  <div class="abs" id="pinhl" style="inset:0; border-radius:50%; background: radial-gradient(circle at 35% 30%, #FF6B78, #D01C2F 60%, #8E0F1E); box-shadow: 0 8px 14px rgba(0,0,0,.35)"></div>
</div>
<div class="abs" id="bdisc" style="left:518px; top:836px; width:44px; height:44px; border-radius:50%; background:#050506"></div>
<div class="full vig" id="vigAll" style="opacity:.0"></div>
<div id="grain"></div>
</div>

<script>
const IC = {};
Promise.all(["calendar-days", "circle-x"].map((n) => fetch(`assets/icons/${n}.svg`).then((r) => r.text()).then((t) => { IC[n] = t.replace(new RegExp("<" + "!--[\\s\\S]*?--" + ">"), ""); })))
  .then(() => document.fonts.ready).then(() => {
  const $ = (s) => document.querySelector(s), $$ = (s) => Array.from(document.querySelectorAll(s)), FR = 1 / 30;
  let seed = 5; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  try { const v = window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables(); if (v && v.handle) $$(".handle").forEach((e) => (e.textContent = v.handle)); } catch (e) {}
  $("#logrows").innerHTML = [["W1", "20 kg"], ["W6", "20 kg"], ["W12", "20 kg"]].map(([w, v]) => `<div class="row lr">${IC["calendar-days"]}<span style="opacity:.8; width:90px">${w}</span><span>${v}</span></div>`).join("")
    + `<div class="row lr" id="nochange" style="color:#FFD3D8">${IC["circle-x"].replace("<svg", '<svg style="stroke:#FF8C99"')}No change</div>`;

  const tl = gsap.timeline({ paused: true });
  // ---------- initial states ----------
  gsap.set(".sc", { autoAlpha: 0 }); gsap.set("#s1", { autoAlpha: 1 });
  gsap.set(".w", { autoAlpha: 0 }); gsap.set(["#s1-sub", "#s1-chip", ".lr"], { autoAlpha: 0 });
  gsap.set("#s1-script", { clipPath: "inset(0% 100% 0% 0%)" });
  gsap.set(["#disc", "#bdisc"], { autoAlpha: 0 }); gsap.set("#pinhl", { opacity: 0 });
  gsap.set("#card", { autoAlpha: 0, rotation: -28, y: -40 });

  // grain re-seeded every 2 frames
  tl.fromTo("#grain", { x: 0, y: 0 }, { keyframes: Array.from({ length: 300 }, () => ({ x: -Math.round(rnd() * 60), y: -Math.round(rnd() * 60), duration: 2 * FR, ease: "steps(1)" })) }, 0);

  // ===== 1 · HOOK 0 – 3.0 =====
  // camera: constant slow push with parallax (grid slowest, hero fastest)
  tl.fromTo("#s1 .cam", { scale: 1.0 }, { scale: 1.05, duration: 2.75, ease: "sine.inOut" }, 0);
  tl.fromTo("#s1-grid", { scale: 1.08, y: 0 }, { scale: 1.0, y: -30, duration: 3, ease: "sine.out" }, 0);
  tl.fromTo("#s1-circle", { scale: 0 }, { scale: 1, duration: 0.7, ease: "expo.out" }, 0.05);
  tl.fromTo("#s1-hero", { y: 180, scale: 1.08, filter: "blur(12px) contrast(1.05)", autoAlpha: 0 }, { y: 0, scale: 1, filter: "blur(0px) contrast(1.05)", autoAlpha: 1, duration: 0.9, ease: "expo.out" }, 0.15);
  tl.to("#s1-hero", { y: -24, scale: 1.03, duration: 1.45, ease: "sine.inOut" }, 1.05);
  tl.fromTo("#s1-script", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.inOut" }, 0.5);
  // words snap in: 2-frame anticipation (slightly small), then land with overshoot
  [["#w-same", 1.05], ["#w-body", 1.35]].forEach(([id, t]) => tl.fromTo(id, { autoAlpha: 0, scale: 1.6, filter: "blur(14px)", y: -10 }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", y: 0, duration: 0.32, ease: "back.out(2.2)" }, t));
  tl.fromTo("#s1-text", { scale: 1 }, { keyframes: [{ scale: 1.035, duration: 0.08, ease: "power2.out" }, { scale: 1, duration: 0.35, ease: "power3.out" }] }, 1.4);
  tl.fromTo("#s1-sub", { autoAlpha: 0, clipPath: "inset(0% 50% 0% 50%)", filter: "blur(6px)" }, { autoAlpha: 1, clipPath: "inset(0% 0% 0% 0%)", filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 1.85);
  tl.fromTo("#s1-chip", { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.4);
  // OUT: the red circle swallows the frame, then shrinks into the pushpin of scene 2
  const sr = 430 / 22;
  tl.set("#s1-circle", { autoAlpha: 0 }, 2.72); tl.set("#disc", { autoAlpha: 1, x: 0, y: 1380 - 858, scale: sr * 1.05 }, 2.72);
  tl.to("#s1-text", { scale: 1.06, autoAlpha: 0, filter: "blur(10px)", duration: 0.22, ease: "power3.in" }, 2.66);
  tl.to("#s1-hero", { y: 340, autoAlpha: 0, duration: 0.22, ease: "power3.in" }, 2.52);
  tl.to("#disc", { scale: 115, duration: 0.28, ease: "power3.in" }, 2.72);
  tl.set("#s1", { autoAlpha: 0 }, 3.0); tl.set("#s2", { autoAlpha: 1 }, 3.0);

  // ===== 2 · PROBLEM 3.0 – 6.0 =====
  tl.to("#disc", { scale: 1, y: 0, duration: 0.5, ease: "expo.inOut" }, 3.0);
  tl.fromTo("#pinhl", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 3.38);
  tl.fromTo("#s2 .cam", { scale: 1.08 }, { scale: 1.0, duration: 0.7, ease: "expo.out" }, 3.0);
  tl.to("#s2 .cam", { scale: 1.04, duration: 2.3, ease: "sine.inOut" }, 3.7);
  tl.fromTo("#s2-swoosh", { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.9, ease: "power3.out" }, 3.05);
  // card swings down from the pin and settles at -4°
  tl.fromTo("#card", { autoAlpha: 0, rotation: -28, y: -40 }, { autoAlpha: 1, y: 0, duration: 0.25, ease: "power2.out" }, 3.42);
  tl.fromTo("#card", { rotation: -28 }, { rotation: -4, duration: 1.1, ease: "elastic.out(1, 0.45)", immediateRender: false }, 3.42);
  // words build: small plain words, then the big red ones land
  [["#w-your", 3.45], ["#w-muscles", 3.62]].forEach(([id, t]) => tl.fromTo(id, { autoAlpha: 0, y: 16, filter: "blur(6px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, t));
  [["#w-stop", 3.95], ["#w-growing", 4.2]].forEach(([id, t]) => tl.fromTo(id, { autoAlpha: 0, scale: 1.5, filter: "blur(10px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "back.out(2.2)" }, t));
  $$(".lr").forEach((r, i) => tl.fromTo(r, { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "expo.out" }, 4.4 + i * 0.16));
  tl.fromTo("#nochange", { x: 0 }, { keyframes: [-8, 8, -5, 5, 0].map((x) => ({ x, duration: 0.04 })), ease: "none", immediateRender: false }, 4.95);
  tl.fromTo("#s2 .cam", { x: 0 }, { keyframes: [{ x: 6, duration: FR }, { x: -5, duration: FR }, { x: 0, duration: FR }], immediateRender: false }, 4.95);
  // OUT: a black circle grows from the pin into the dark world of scene 3
  tl.to("#card", { rotation: 6, duration: 0.25, ease: "power2.in" }, 5.5);
  tl.set("#bdisc", { autoAlpha: 1, scale: 0 }, 5.6);
  tl.to("#bdisc", { scale: 120, duration: 0.4, ease: "power3.in" }, 5.6);

  tl.set({}, {}, 6);
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
});
</script>
</body>
</html>
