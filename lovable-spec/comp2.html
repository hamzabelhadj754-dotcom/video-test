<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Words become the app</title>
<style>
@font-face{font-family:"Hanken";src:url(assets/fonts/hanken.woff2) format("woff2");font-weight:300 700;font-display:block}
@font-face{font-family:"Fraunces";src:url(assets/fonts/fraunces.woff2) format("woff2");font-weight:300 800;font-display:block}
@font-face{font-family:"Caveat";src:url(assets/fonts/caveat.woff2) format("woff2");font-weight:400 700;font-display:block}
@font-face{font-family:"Anybody";src:url(assets/fonts/anybody.woff2) format("woff2");font-weight:100 900;font-stretch:50% 150%;font-display:block}
@font-face{font-family:"JetBrains Mono";src:url(assets/fonts/jbmono.woff2) format("woff2");font-weight:100 800;font-display:block}
:root{--ink:#1B1B1B;--terra:#C65D3B;--brown:#3B2A20;--muted:#8A7765;--line:#EADFCF;--page:#FBF6EE}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#F7F4ED}
#gl{position:absolute;left:0;top:0;width:1080px;height:1350px}
.abs{position:absolute}
#type{position:absolute;left:78px;top:390px;font-family:Hanken;font-weight:600;font-size:136px;letter-spacing:-0.045em;line-height:.98;color:var(--ink);white-space:nowrap}
#type .c{visibility:hidden}
#caret{position:absolute;width:8px;height:112px;background:var(--ink);border-radius:2px}
#card{position:absolute;left:36px;top:36px;width:1008px;height:1278px;border-radius:44px;background:var(--page);box-shadow:0 50px 120px -40px rgba(60,20,40,.45),0 0 0 1px rgba(27,27,27,.05);opacity:0}
#page{position:absolute;inset:0;clip-path:inset(0px round 0px)}
#scroller{position:absolute;inset:0}
.fly{position:absolute;font-family:Hanken;font-weight:600;font-size:136px;letter-spacing:-0.045em;line-height:1;color:var(--ink);display:grid;place-items:center;visibility:hidden}
.chip{position:absolute;top:955px;width:124px;height:130px;border-radius:28px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;align-content:center;gap:2px;transform:scale(0)}
.chip .d{font-family:Hanken;font-weight:600;font-size:24px;color:var(--muted)}
.chip .n{font-family:Hanken;font-weight:700;font-size:44px;color:var(--brown);letter-spacing:-0.02em}
.chip.sel{background:var(--terra);box-shadow:none}.chip.sel .d,.chip.sel .n{color:#fff}
#rosa{position:absolute;font-family:Caveat;font-weight:700;color:var(--terra);font-size:180px;line-height:1;transform-origin:0 0;clip-path:inset(0 100% 0 0)}
#bakeFill{position:absolute;font-family:Hanken;font-weight:600;font-size:136px;letter-spacing:-0.045em;line-height:.98;color:transparent;-webkit-background-clip:text;background-clip:text;background-size:900px auto;background-position:50% 22%;opacity:0}
#hero{position:absolute;overflow:hidden;opacity:0}
#hero img{width:100%;height:100%;object-fit:cover;display:block}
#btn{position:absolute;display:grid;place-items:center;overflow:hidden}
#btn span{grid-area:1/1;font-family:Hanken;font-weight:600;white-space:nowrap}
.pg{position:absolute;opacity:0}
.nav{font-family:Hanken;font-weight:600;font-size:28px;color:var(--brown)}
/* below the fold */
.bake{position:absolute;top:1430px;width:296px;height:380px;border-radius:32px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.bake canvas{display:block}
.bake .t{position:absolute;left:24px;bottom:56px;font-family:Fraunces;font-weight:600;font-size:34px;color:var(--brown)}
.bake .p{position:absolute;left:24px;bottom:20px;font-family:Hanken;font-weight:700;font-size:26px;color:var(--terra)}
/* montage */
.panel{position:absolute;left:36px;top:178px;width:1008px;height:1136px;border-radius:44px;overflow:hidden;box-shadow:0 50px 120px -40px rgba(60,10,40,.5)}
.panel img{width:1008px;position:absolute;left:0;top:-150px}
#mp{position:absolute;left:50%;top:80px;transform:translateX(-50%);white-space:nowrap;padding:22px 26px 22px 34px;border-radius:999px;background:#FCFBF8;display:flex;align-items:center;gap:22px;
  font-family:Hanken;font-weight:500;font-size:34px;letter-spacing:-0.01em;color:var(--ink);box-shadow:0 30px 70px -26px rgba(60,10,40,.45);visibility:hidden}
#mp i,.send{border-radius:50%;background:var(--ink);display:grid;place-items:center;flex:none}
#mp i{width:52px;height:52px}
.mcar{display:inline-block;width:3px;height:36px;background:var(--ink);vertical-align:-6px;margin-left:2px}
/* final prompt */
#prompt{position:absolute;left:100px;top:520px;width:880px;padding:36px 36px 28px;border-radius:42px;background:#FCFBF8;box-shadow:0 50px 110px -34px rgba(90,10,50,.55),0 0 0 1px rgba(27,27,27,.05);visibility:hidden}
.ptxt{font-family:Hanken;font-weight:500;font-size:42px;letter-spacing:-0.015em;line-height:1.25;color:#9A968E;min-height:104px}
.ptxt .pw{display:inline-block;opacity:0}
#pcar{display:inline-block;width:3px;height:46px;background:var(--ink);vertical-align:-8px;margin-right:6px}
.prow{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.pl,.pr{display:flex;align-items:center;gap:14px}
.ib{width:62px;height:62px;border-radius:50%;border:2px solid #E6E2D8;display:grid;place-items:center}
.pchip{height:62px;padding:0 22px;border-radius:31px;border:2px solid #E6E2D8;display:flex;align-items:center;gap:10px;font-family:Hanken;font-weight:600;font-size:26px;color:var(--ink)}
.send{width:70px;height:70px}
#logo{position:absolute;left:50%;top:880px;width:270px;transform:translateX(-50%);visibility:hidden}
#spec{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-family:Hanken;font-weight:500;font-size:17px;color:rgba(27,27,27,.45);visibility:hidden}
</style>
</head>
<body>
<canvas id="gl" width="1080" height="1350"></canvas>

<div id="card"></div>
<div id="page"><div id="scroller">
  <div class="pg nav" id="navlinks" style="left:690px;top:96px;display:flex;gap:44px"><span>Menu</span><span>Hours</span><span style="color:var(--terra)">Book</span></div>
  <div id="hero"><img id="heroImg"></div>
  <div class="pg" id="title" style="left:80px;top:722px;font-family:Fraunces;font-weight:600;font-size:92px;letter-spacing:-0.02em;color:var(--brown);white-space:nowrap">Rosa’s Bakery</div>
  <div class="pg" id="sub" style="left:82px;top:832px;font-family:Hanken;font-weight:500;font-size:30px;color:var(--muted)">Fresh bread &amp; cakes since 1974 · Via Roma 12</div>
  <div class="pg" id="pick" style="left:80px;top:902px;font-family:Hanken;font-weight:700;font-size:28px;color:var(--brown)">Pick a day</div>
  <div id="chips"></div>
  <div id="btn" style="visibility:hidden"><span id="btnA" style="font-size:136px;letter-spacing:-0.045em;color:var(--ink)">app</span><span id="btnB" style="font-size:44px;color:#fff;opacity:0">Book a table&nbsp;&nbsp;→</span></div>
  <div class="pg" style="left:80px;top:1340px;font-family:Fraunces;font-weight:600;font-size:60px;color:var(--brown);opacity:1">Today’s bakes</div>
  <div id="bakes"></div>
  <div style="position:absolute;left:76px;top:1850px;width:928px;height:130px;border-radius:32px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px;font-family:Hanken;font-weight:600;font-size:32px;color:var(--brown)"><span>Open today</span><span style="color:var(--terra)">7:00 – 19:00</span></div>
  <div id="rosa">Rosa</div>
  <div id="bakeFill">bakery</div>
</div></div>

<div id="type"><span id="caret"></span></div>
<div id="flies"></div>

<div id="panels"></div>
<div id="mp"><span><span id="mpt"></span><span class="mcar" id="mpc"></span></span><i><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></i></div>

<div id="prompt">
  <div class="ptxt"><span id="pcar"></span><span class="pw">Let’s</span> <span class="pw">build</span> <span class="pw">something</span> <span class="pw" style="color:#6F6A61">Lovable</span></div>
  <div class="prow">
    <div class="pl">
      <div class="ib"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#1B1B1B" stroke-width="2.2" stroke-linecap="round"/></svg></div>
      <div class="pchip"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B1B1B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.7 8.6a1.7 1.7 0 0 1-2.4-2.4l8-7.9"/></svg>Attach</div>
      <div class="pchip"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B1B1B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Themes</div>
    </div>
    <div class="pr">
      <svg width="34" height="34" viewBox="0 0 24 24" stroke="#1B1B1B" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 10v4"/></svg>
      <div class="send"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></div>
    </div>
  </div>
</div>
<img id="logo" src="assets/logos/full-black.png">
<div id="spec">Spec ad · not affiliated with Lovable · apps shown are fictional examples</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import { initGrad, renderGrad } from './grad.js';
import { drawCake, leagueScreen, plantsScreen, merchScreen } from './ui.js';
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),prog=(t,a,b)=>clamp((t-a)/(b-a));
const $=s=>document.querySelector(s);
const IDEA='a booking app for my grandma’s bakery';
const WORDS=[['a'],['booking'],['app'],['for'],['my'],['grandma’s'],['bakery']];
const LINES=[[0,1,2],[3,4,5],[6]];
// hero rects (stage coords)
const HERO={x:76,y:170,w:928,h:520}, BTN={x:76,y:1125,w:928,h:130}, CH0=76, CHW=124, CHG=(928-7*124)/6;

await document.fonts.ready;
await Promise.all(['600 112px Hanken','500 40px Hanken','700 40px Hanken','600 92px Fraunces','700 150px Caveat','900 100px Anybody','500 22px "JetBrains Mono"'].map(f=>document.fonts.load(f)));

// ---------- build the typed sentence (one span per character) ----------
const type=$('#type'); let ci=0; const wordEl={};
LINES.forEach((ln,li)=>{const L=document.createElement('div');ln.forEach((wi,k)=>{const w=WORDS[wi][0];const ws=document.createElement('span');ws.className='word';ws.dataset.w=w;
  for(const ch of w){const c=document.createElement('span');c.className='c';c.textContent=ch;c.dataset.i=ci++;ws.appendChild(c)}
  L.appendChild(ws);wordEl[w]=ws;if(k<ln.length-1){const sp=document.createElement('span');sp.className='c';sp.textContent=' ';sp.dataset.i=ci++;L.appendChild(sp)}});
  if(li<LINES.length-1)ci++; type.appendChild(L);});
const chars=[...type.querySelectorAll('.c')];
const rectOf=el=>{const r=el.getBoundingClientRect();return{x:r.left,y:r.top,w:r.width,h:r.height}};
chars.forEach(c=>c.style.visibility='visible');const R={};for(const w in wordEl)R[w]=rectOf(wordEl[w]);
const bookingRects=[...wordEl['booking'].children].map(rectOf);chars.forEach(c=>c.style.visibility='');

// ---------- cake art, bakes, chips, flying letters ----------
const cake=document.createElement('canvas');cake.width=1856;cake.height=1040;drawCake(cake.getContext('2d'),0,0,1856,1040);
const cakeURL=cake.toDataURL('image/jpeg',.92);$('#heroImg').src=cakeURL;
const bf=$('#bakeFill');bf.style.backgroundImage=`url(${cakeURL})`;Object.assign(bf.style,{left:R['bakery'].x+'px',top:(R['bakery'].y-4)+'px'});
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
DAYS.forEach((d,i)=>{const c=document.createElement('div');c.className='chip'+(i===3?' sel':'');c.style.left=(CH0+i*(CHW+CHG))+'px';c.innerHTML=`<span class="d">${d}</span><span class="n">${12+i}</span>`;$('#chips').appendChild(c)});
[...'booking'].forEach((ch,i)=>{const f=document.createElement('div');f.className='fly';f.textContent=ch;const r=bookingRects[i];Object.assign(f.style,{left:r.x+'px',top:r.y+'px',width:r.w+'px',height:r.h+'px'});$('#flies').appendChild(f)});
const bakeArt=[(x)=>{x.fillStyle='#F1D9A8';x.fillRect(0,0,296,240);x.fillStyle='#D9A55B';x.beginPath();x.roundRect(40,70,216,120,16);x.fill();x.fillStyle='#B9803B';for(let i=0;i<12;i++){x.beginPath();x.arc(66+(i%6)*34,100+Math.floor(i/6)*50,7,0,7);x.fill()}x.fillStyle='#5E8A3E';x.beginPath();x.ellipse(120,90,10,5,.5,0,7);x.fill();x.beginPath();x.ellipse(200,150,10,5,-.4,0,7);x.fill()},
 (x)=>{x.fillStyle='#F6E2C4';x.fillRect(0,0,296,240);x.fillStyle='#D99A4E';x.beginPath();x.moveTo(60,170);x.quadraticCurveTo(148,40,236,170);x.quadraticCurveTo(148,120,60,170);x.fill();x.strokeStyle='#B87633';x.lineWidth=5;for(let i=0;i<4;i++){x.beginPath();x.moveTo(100+i*30,92+Math.abs(i-1.5)*14);x.lineTo(108+i*28,150);x.stroke()}},
 (x)=>{x.fillStyle='#F3E6D6';x.fillRect(0,0,296,240);x.fillStyle='#E0B26E';x.beginPath();x.moveTo(60,170);x.lineTo(236,170);x.lineTo(180,70);x.closePath();x.fill();x.fillStyle='#FFF4E2';x.beginPath();x.moveTo(78,150);x.lineTo(218,150);x.lineTo(180,84);x.closePath();x.fill();x.fillStyle='#D9304A';[[150,120],[175,135],[190,110]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,10,0,7);x.fill()})}];
[['Focaccia','€4.00'],['Cornetti','€1.80'],['Torta della nonna','€3.50']].forEach(([n,p],i)=>{const d=document.createElement('div');d.className='bake';d.style.left=(76+i*316)+'px';const c=document.createElement('canvas');c.width=296;c.height=240;bakeArt[i](c.getContext('2d'));d.appendChild(c);d.insertAdjacentHTML('beforeend',`<div class="t" style="font-size:${i===2?27:34}px">${n}</div><div class="p">${p}</div>`);$('#bakes').appendChild(d)});
// montage panels
[leagueScreen(),plantsScreen(),merchScreen()].forEach((cv,i)=>{const d=document.createElement('div');d.className='panel';const im=new Image();im.src=cv.toDataURL('image/jpeg',.92);d.appendChild(im);$('#panels').appendChild(d)});
// initial positions
Object.assign($('#rosa').style,{left:R['grandma’s'].x+'px',top:(R['grandma’s'].y-14)+'px'});
const h=$('#hero');Object.assign(h.style,{left:R['bakery'].x+'px',top:R['bakery'].y+'px',width:R['bakery'].w+'px',height:R['bakery'].h+'px',borderRadius:'14px'});
const b=$('#btn');Object.assign(b.style,{left:R['app'].x+'px',top:R['app'].y+'px',width:R['app'].w+'px',height:R['app'].h+'px',borderRadius:'18px',background:'rgba(198,93,59,0)'});

// ---------- timeline ----------
const tl=gsap.timeline({paused:true}), E='expo.out', IO='expo.inOut';
// filler words leave
['a','for','my'].forEach((w,i)=>tl.to(wordEl[w],{opacity:0,y:-18,filter:'blur(6px)',duration:.45,ease:'power2.in'},2.95+i*.05));
// grandma's -> Rosa (handwriting) -> app logo
tl.to(wordEl['grandma’s'],{opacity:0,y:-12,duration:.35,ease:'power2.in'},3.15);
tl.to('#rosa',{clipPath:'inset(0 0% 0 0)',duration:.6,ease:'power2.out'},3.2);
tl.to('#rosa',{left:76,top:60,scale:.4,duration:.75,ease:IO},3.85);
// bakery -> filled with cake -> grows into the hero image
tl.to('#bakeFill',{opacity:1,duration:.4},4.6);tl.to(wordEl['bakery'],{opacity:0,duration:.4},4.6);
tl.to('#hero',{opacity:1,duration:.2},5.05);
tl.to('#hero',{left:HERO.x,top:HERO.y,width:HERO.w,height:HERO.h,borderRadius:36,duration:.9,ease:IO},5.05);
tl.to('#bakeFill',{opacity:0,duration:.25},5.1);
tl.fromTo('#title',{opacity:0,y:30},{opacity:1,y:0,duration:.7,ease:E},5.7);
tl.fromTo('#sub',{opacity:0,y:20},{opacity:1,y:0,duration:.7,ease:E},5.85);
tl.fromTo('#navlinks',{opacity:0,y:-10},{opacity:1,y:0,duration:.6,ease:E},6.0);
tl.fromTo('#pick',{opacity:0},{opacity:1,duration:.5},4.5);
// booking -> 7 letters -> 7 days
tl.set(wordEl['booking'],{opacity:0},3.55);tl.set('.fly',{visibility:'visible'},3.55);
document.querySelectorAll('.fly').forEach((f,i)=>{const r=bookingRects[i],cx=CH0+i*(CHW+CHG)+CHW/2-r.w/2,cy=955+65-r.h/2,t0=3.55+i*.07;
  tl.to(f,{left:cx,top:cy,duration:.7,ease:IO},t0);
  tl.to(f,{scale:.3,opacity:0,duration:.22,ease:'power2.in'},t0+.5);
  tl.to(document.querySelectorAll('.chip')[i],{scale:1,duration:.5,ease:'back.out(1.8)'},t0+.62);});
// app -> button
tl.to('#btn',{left:BTN.x,top:BTN.y,width:BTN.w,height:BTN.h,borderRadius:65,background:'rgba(198,93,59,1)',duration:.8,ease:IO},4.15);
tl.to(wordEl['app'],{opacity:0,duration:.1},4.15);tl.set('#btn',{visibility:'visible'},4.15);
tl.to('#btnA',{opacity:0,scale:.5,duration:.3,ease:'power2.in'},4.35);tl.fromTo('#btnB',{opacity:0,y:16},{opacity:1,y:0,duration:.45,ease:E},4.65);
// the canvas becomes a page
tl.to('#card',{opacity:1,duration:.7,ease:'power2.out'},6.55);
tl.fromTo('#page',{clipPath:'inset(0px round 0px)'},{clipPath:'inset(36px round 44px)',duration:.7,ease:IO},6.55);
tl.fromTo(['#page','#card'],{scale:1},{scale:1.015,duration:2.2,ease:'sine.inOut'},7.2);
// scroll down the page
tl.to('#scroller',{y:-640,duration:1.2,ease:IO},8.75);
// camera continues: page leaves, panels arrive
tl.to(['#page','#card'],{x:-1180,filter:'blur(30px)',duration:.5,ease:'power2.in'},10.15);
document.querySelectorAll('.panel').forEach((p,i,all)=>{const t0=10.6+i*1.2;tl.fromTo(p,{x:1180,rotation:3},{x:0,rotation:0,duration:.72,ease:'power3.out'},t0);tl.fromTo(p,{filter:'blur(30px)'},{filter:'blur(0px)',duration:.42,ease:'power2.out'},t0);if(i<all.length-1){tl.to(p,{x:-1180,rotation:-3,duration:.5,ease:'power2.in'},t0+1.1);tl.to(p,{filter:'blur(30px)',duration:.5,ease:'power2.in'},t0+1.1);}});
tl.set('#mp',{visibility:'visible'},10.6);
// everything folds back into one empty prompt
tl.to('.panel',{scale:.62,opacity:0,y:-60,duration:.55,ease:'power3.in'},14.2);
tl.to('#mp',{autoAlpha:0,y:-20,duration:.3},14.25);
tl.fromTo('#prompt',{autoAlpha:0,scale:.9,y:40},{autoAlpha:1,scale:1,y:0,duration:.9,ease:'back.out(1.4)'},14.6);
tl.to('.pw',{opacity:1,duration:.5,stagger:.32,ease:'power2.out'},15.6);
tl.fromTo('#logo',{autoAlpha:0,y:16},{autoAlpha:1,y:0,duration:.8,ease:E},17.2);
tl.fromTo('#spec',{autoAlpha:0},{autoAlpha:1,duration:.6},17.6);
tl.set({},{},20);

// ---------- typing (pure function of t) ----------
const MPS=[['A league table for our Sunday football',10.6],['Remind me to water my plants',11.8],['A merch store for my band',13.0]];
const caret=$('#caret');
function typing(t){
  const n=Math.floor(prog(t,.45,2.75)*IDEA.length+.0001);
  chars.forEach(c=>c.style.visibility=(+c.dataset.i<n||t>=2.75)?'visible':'hidden');
  let last=null;chars.forEach(c=>{if(+c.dataset.i<n)last=c});
  const on=t<2.95&&(t<.45||(t>.45&&t<2.75)||(t*2.2)%1<.55);
  caret.style.opacity=on?1:0;
  const tr=type.getBoundingClientRect();
  if(last){const r=last.getBoundingClientRect();caret.style.left=(r.right-tr.left+4)+'px';caret.style.top=(r.top-tr.top+16)+'px'}else{caret.style.left='0px';caret.style.top='8px'}
  let k=0;MPS.forEach(([,t0],i)=>{if(t>=t0)k=i});const [s,t0]=MPS[k];
  $('#mpt').textContent=s.slice(0,Math.floor(prog(t,t0+.05,t0+.65)*s.length+.0001));$('#mpc').style.opacity=(t<t0+.65||(t*2.2)%1<.55)?1:0;
  $('#pcar').style.opacity=((t*1.8)%1<.55)?1:0;
}
initGrad($('#gl'));
window.seek=t=>{tl.seek(t,false);typing(t);renderGrad(t)};
seek(0);document.body.dataset.ready=1;window.DUR=20;
</script>
