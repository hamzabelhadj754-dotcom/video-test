<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  @font-face { font-family: "Inter"; src: url("assets/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Anton"; src: url("assets/Anton-Regular.woff2") format("woff2"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: Inter, sans-serif; color: #fff; }
  .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  video.full { object-fit: cover; }
  .main { position: absolute; left: 0; right: 0; top: 520px; text-align: center; white-space: nowrap; font: 400 300px/.86 Anton; text-transform: uppercase; letter-spacing: .005em; color: #F4F1EC; }
  .main.acc { color: #7FE3D3; }
  .lw { display: inline-block; }
  .lead { position: absolute; left: 0; right: 0; top: 455px; text-align: center; white-space: nowrap; font: 800 58px/1 Inter; letter-spacing: -.02em; text-transform: lowercase; text-shadow: 0 4px 18px rgba(0,0,0,.7); }
  #grain { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2040px; opacity: .12; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' seed='8' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="21.6" data-width="1080" data-height="1920" data-fps="30">
  <!-- one camera holds: footage → big word → the athlete cut out on top, so the word sits behind him -->
  <div class="full" id="shot">
    <video id="film" class="clip full" src="assets/broll_edit.mp4" data-start="0" data-duration="21.6" data-track-index="0" muted playsinline></video>
    <div class="full" style="background: radial-gradient(ellipse 85% 70% at 50% 48%, transparent 45%, rgba(0,0,0,.7) 100%)"></div>
    <div id="back" class="full"></div>
    <video id="subj" class="clip full" src="assets/subject.webm" data-start="0" data-duration="21.6" data-track-index="2" muted playsinline></video>
  </div>
  <div id="front" class="full"></div>
  <div id="grain"></div>
  <audio id="vo" class="clip" src="assets/speech.wav" data-start="0" data-duration="21.6" data-track-index="1" data-volume="1"></audio>
</div>
<script>
fetch("assets/caps.json").then((r) => r.json()).then((caps) => document.fonts.ready.then(() => {
  const FR = 1 / 30; let seed = 3; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const tl = gsap.timeline({ paused: true }), back = document.getElementById("back"), front = document.getElementById("front");
  const CUTS = [0, 1.3, 2.6, 4.0, 5.2, 6.5, 7.75, 9.9, 10.8, 12.2, 14.0, 15.9, 17.25, 19.35];
  caps.forEach((c, i) => {
    const a = c.at - FR;
    const mn = document.createElement("div"); mn.className = "main" + (c.acc ? " acc" : ""); mn.textContent = c.main;
    mn.style.fontSize = c.size + "px"; mn.style.top = c.top + "px"; (c.layer === "front" ? front : back).appendChild(mn);
    if (c.layer === "front") mn.style.textShadow = "0 10px 40px rgba(0,0,0,.6)";
    gsap.set(mn, { autoAlpha: 0 }); tl.set(mn, { autoAlpha: 1 }, a); tl.set(mn, { autoAlpha: 0 }, c.end);
    // three entrances, rotated so it never feels repetitive: rise from behind the shoulders, punch, or a quick squash-stretch
    const v = c.acc ? 1 : i % 3;
    if (v === 0) tl.fromTo(mn, { yPercent: 40, scaleY: 1.25, transformOrigin: "50% 100%" }, { yPercent: 0, scaleY: 1, duration: 0.2, ease: "expo.out", immediateRender: false }, a);
    else if (v === 1) tl.fromTo(mn, { scale: 1.3, filter: "blur(8px)" }, { scale: 1, filter: "blur(0px)", duration: 0.2, ease: "expo.out", immediateRender: false }, a);
    else tl.fromTo(mn, { scaleX: 1.35, scaleY: 0.75 }, { scaleX: 1, scaleY: 1, duration: 0.22, ease: "back.out(2.5)", immediateRender: false }, a);
    if (c.acc) tl.fromTo("#shot", { x: 0, y: 0 }, { keyframes: [{ x: 10, y: -6, duration: FR }, { x: -8, y: 5, duration: FR }, { x: 3, y: -2, duration: FR }, { x: 0, y: 0, duration: FR }], ease: "none", immediateRender: false }, a);
    if (c.lead) { const ld = document.createElement("div"); ld.className = "lead"; ld.style.top = (c.top - 102) + "px"; front.appendChild(ld);
      // each small word appears exactly when it is spoken; the line keeps its final centred layout so nothing shifts
      ld.innerHTML = c.leadWords.map(([w]) => `<span class="lw">${w}</span>`).join(" ");
      const spans = Array.from(ld.querySelectorAll(".lw"));
      gsap.set(spans, { autoAlpha: 0 }); tl.set(ld, { autoAlpha: 1 }, c.leadAt - FR); tl.set(ld, { autoAlpha: 0 }, c.end);
      spans.forEach((sp, k) => { const t = c.leadWords[k][1] - FR; tl.fromTo(sp, { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.12, ease: "power3.out", immediateRender: false }, t); }); }
  });
  // camera: every shot lands slightly pushed in and drifts out; footage, word and cut-out move as one
  CUTS.forEach((t, i) => { const b = CUTS[i + 1] || 21.6, s = 1.07 + (i % 3) * 0.02;
    tl.fromTo("#shot", { scale: s, xPercent: (i % 2 ? -1 : 1) * 1.0 }, { scale: 1.0, xPercent: 0, duration: b - t, ease: "power2.out", immediateRender: i === 0 }, t); });
  tl.fromTo("#grain", { x: 0, y: 0 }, { keyframes: Array.from({ length: 324 }, () => ({ x: -Math.round(rnd() * 60), y: -Math.round(rnd() * 60), duration: 2 * FR, ease: "steps(1)" })) }, 0);
  tl.set({}, {}, 21.6);
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
}));
</script>
</body>
</html>
