<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s02-problem-template">
      <style>
        @font-face { font-family: "Hidra Display"; src: url(../assets/fonts/ArchivoBlack.woff2) format("woff2"); font-weight: 400; }
        @font-face { font-family: "Hidra Serif"; src: url(../assets/fonts/InstrumentSerif-Italic.woff2) format("woff2"); font-style: italic; }
        @font-face { font-family: "Hidra Sans"; src: url(../assets/fonts/Montserrat-Var.woff2) format("woff2"); font-weight: 100 900; }

        #s02 { position: absolute; inset: 0; overflow: hidden; background: #07090f; color: #f2f4f8; }
        #s02 .fill { position: absolute; inset: 0; }
        #s02-glow {
          position: absolute; left: 50%; top: 50%; width: 1700px; height: 1000px; margin: -500px 0 0 -850px;
          background: radial-gradient(closest-side, rgba(255, 138, 31, 0.16), rgba(36, 71, 230, 0.1) 60%, transparent);
        }
        #s02-vignette { background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.75) 100%); }
        .s02-pet { position: absolute; left: 0; top: 0; }
        #s02-back, #s02-front { position: absolute; inset: 0; }

        #s02-count, #s02-forget { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #s02-label { display: flex; align-items: center; gap: 22px; font: 800 34px/1 "Hidra Sans", sans-serif; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(242, 244, 248, 0.75); }
        #s02-clock { width: 58px; height: 58px; }
        #s02-num {
          font: 400 250px/1 "Hidra Display", sans-serif; letter-spacing: -0.04em; color: #ff8a1f; margin: 26px 0 6px;
          text-shadow: 0 0 60px rgba(255, 138, 31, 0.45); font-variant-numeric: tabular-nums;
        }
        #s02-unit { font: italic 400 96px/1 "Hidra Serif", serif; color: rgba(242, 244, 248, 0.92); }

        #s02-f1 { font: 700 34px/1 "Hidra Sans", sans-serif; letter-spacing: 0.32em; text-transform: uppercase; color: rgba(242, 244, 248, 0.66); margin-bottom: 30px; }
        #s02-f2 { position: relative; font: 400 200px/1 "Hidra Display", sans-serif; letter-spacing: -0.04em; padding: 10px 34px 30px; }
        #s02-bar { position: absolute; inset: 0; background: #e5322d; transform-origin: left center; box-shadow: 0 0 60px rgba(229, 50, 45, 0.55); }
        #s02-f2t { position: relative; display: block; }
        #s02-f3 { font: italic 400 124px/1 "Hidra Serif", serif; margin-top: 18px; }
        #s02-day { position: relative; width: 760px; height: 60px; margin-top: 54px; }
        #s02-day-line { position: absolute; left: 0; right: 0; top: 14px; height: 3px; background: rgba(242, 244, 248, 0.25); border-radius: 2px; }
        #s02-day-fill { position: absolute; left: 0; width: 100%; top: 14px; height: 3px; background: #f2f4f8; transform-origin: left center; border-radius: 2px; }
        #s02-day-dot { position: absolute; left: -9px; top: 6px; width: 18px; height: 18px; border-radius: 50%; background: #f2f4f8; box-shadow: 0 0 18px rgba(255, 255, 255, 0.8); }
        .s02-time { position: absolute; top: 36px; font: 700 24px/1 "Hidra Sans", sans-serif; color: rgba(242, 244, 248, 0.6); letter-spacing: 0.1em; }
        #s02-drop { position: absolute; right: 250px; top: 300px; width: 270px; height: 270px; }
        #s02-drop img { width: 100%; height: 100%; display: block; }
      </style>

      <div id="s02" data-composition-id="s02-problem" data-width="1920" data-height="1080" data-duration="9.2">
        <div id="s02-glow"></div>
        <div id="s02-back"></div>

        <div id="s02-count">
          <div id="s02-label">
            <svg id="s02-clock" viewBox="0 0 60 60">
              <circle cx="30" cy="30" r="26" fill="none" stroke="rgba(242,244,248,0.35)" stroke-width="4" />
              <circle id="s02-clock-ring" cx="30" cy="30" r="26" fill="none" stroke="#ff8a1f" stroke-width="4" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 30 30)" />
              <line id="s02-hand" x1="30" y1="30" x2="30" y2="13" stroke="#f2f4f8" stroke-width="4" stroke-linecap="round" />
            </svg>
            <span>Cada minuto</span>
          </div>
          <div id="s02-numwrap"><div id="s02-num">0</div></div>
          <div id="s02-unit">botellas de plástico</div>
        </div>

        <div id="s02-forget">
          <div id="s02-f1">La mayoría de nosotros</div>
          <div id="s02-f2"><div id="s02-bar"></div><span id="s02-f2t">se olvida</span></div>
          <div id="s02-f3">de beber agua</div>
          <div id="s02-day">
            <div id="s02-day-line"></div>
            <div id="s02-day-fill"></div>
            <div id="s02-day-dot"></div>
            <div class="s02-time" style="left: -10px">8:00</div>
            <div class="s02-time" style="right: -10px">22:00</div>
          </div>
        </div>
        <div id="s02-drop"><img src="../assets/img/drop.png" alt="" /></div>

        <div id="s02-front"></div>
        <div id="s02-vignette" class="fill"></div>
      </div>

      <script>
        (function () {
          function rng(seed) {
            return function () {
              seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
              let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }
          const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");

          // Plastic bottles rain through the frame: small + soft behind the number, big + blurred in front.
          const r = rng(23);
          const pets = [];
          for (let i = 0; i < 24; i++) {
            const front = i % 4 === 0;
            const img = document.createElement("img");
            img.className = "s02-pet";
            img.src = `../assets/img/pet-${1 + (i % 3)}.png`;
            const size = front ? 300 + r() * 160 : 120 + r() * 140;
            img.style.width = img.style.height = size + "px";
            img.style.filter = front ? "blur(7px)" : `blur(${(r() * 1.6).toFixed(2)}px)`;
            img.style.opacity = front ? 0.75 : 0.55 + r() * 0.35;
            (front ? document.getElementById("s02-front") : document.getElementById("s02-back")).appendChild(img);
            pets.push({ el: img, x: r() * 1920 - size / 2, start: 0.3 + r() * 3.6, dur: front ? 1.8 + r() * 0.8 : 2.6 + r() * 1.8, spin: (r() - 0.5) * 540, size });
          }

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s02-glow", { scale: 0.9, opacity: 0 }, { scale: 1.1, opacity: 1, duration: 4.4, ease: "sine.out" }, 0);
          pets.forEach((p) => {
            tl.fromTo(p.el, { x: p.x, y: -p.size - 40, rotation: 0 }, { x: p.x + (p.spin > 0 ? 60 : -60), y: 1180, rotation: p.spin, duration: p.dur, ease: "power1.in" }, p.start);
          });

          // Beat A — "Cada minuto ... un millón de botellas de plástico" (VO 0.4 s).
          tl.fromTo("#s02-label", { opacity: 0, y: 20, scale: 1.15 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 0.35);
          tl.fromTo("#s02-clock-ring", { strokeDashoffset: 163.4 }, { strokeDashoffset: 0, duration: 4.0, ease: "none" }, 0.5);
          tl.fromTo("#s02-hand", { rotation: 0, svgOrigin: "30 30" }, { rotation: 720, svgOrigin: "30 30", duration: 4.0, ease: "none" }, 0.5);
          tl.fromTo("#s02-num", { opacity: 0, scale: 0.85, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.55);
          const counter = { v: 0 };
          const numEl = document.getElementById("s02-num");
          tl.to(counter, { v: 1000000, duration: 2.15, ease: "power2.out", onUpdate: () => { numEl.textContent = fmt(counter.v); } }, 0.6);
          tl.fromTo("#s02-numwrap", { scale: 1 }, { scale: 1.07, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, 2.75);
          tl.fromTo("#s02-unit", { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 2.85);
          tl.to("#s02-count", { y: -90, opacity: 0, filter: "blur(18px)", duration: 0.4, ease: "power2.in" }, 4.4);
          tl.to(["#s02-back", "#s02-front"], { opacity: 0, duration: 0.5, ease: "power1.in" }, 4.3);

          // Beat B — "Y la mayoría de nosotros se olvida de beber agua durante el día" (VO 4.8 s).
          tl.fromTo("#s02-f1", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.85);
          tl.fromTo("#s02-f2t", { opacity: 0, y: 60, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 5.7);
          tl.fromTo("#s02-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power4.inOut" }, 6.2);
          tl.fromTo("#s02-f2", { rotation: 0 }, { rotation: -2.5, duration: 0.45, ease: "back.out(3)" }, 6.25);
          tl.fromTo("#s02-f3", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 6.7);
          tl.fromTo("#s02-drop", { y: -700, rotation: -25, opacity: 0 }, { y: 0, rotation: 8, opacity: 1, duration: 0.8, ease: "bounce.out" }, 6.8);
          tl.fromTo("#s02-drop", { scale: 1 }, { scale: 1.06, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 7.6);
          tl.fromTo("#s02-day", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 7.2);
          tl.fromTo("#s02-day-fill", { scaleX: 0 }, { scaleX: 1, duration: 1.5, ease: "power1.inOut" }, 7.45);
          tl.fromTo("#s02-day-dot", { x: 0 }, { x: 760, duration: 1.5, ease: "power1.inOut" }, 7.45);
          tl.fromTo("#s02-forget", { scale: 1 }, { scale: 1.06, duration: 2.6, ease: "none" }, 6.6);

          window.__timelines["s02-problem"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
