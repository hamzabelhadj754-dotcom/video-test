<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s08-promotion-template">
      <style>
        @font-face { font-family: "Hidra Display"; src: url(../assets/fonts/ArchivoBlack.woff2) format("woff2"); font-weight: 400; }
        @font-face { font-family: "Hidra Serif"; src: url(../assets/fonts/InstrumentSerif-Italic.woff2) format("woff2"); font-style: italic; }
        @font-face { font-family: "Hidra Sans"; src: url(../assets/fonts/Montserrat-Var.woff2) format("woff2"); font-weight: 100 900; }

        #s08 { position: absolute; inset: 0; overflow: hidden; color: #15161c; }

        /* Phase A — megaphone + "Redes sociales" */
        #s08-a { position: absolute; inset: 0; }
        #s08-mega { position: absolute; left: 150px; top: 250px; width: 600px; height: 600px; }
        #s08-mega img { width: 100%; height: 100%; display: block; }
        .s08-wave { position: absolute; left: 600px; top: 410px; width: 260px; height: 260px; border-radius: 50%; border: 6px solid #2447e6; border-left-color: transparent; border-bottom-color: transparent; transform: rotate(45deg); }
        #s08-a1 { position: absolute; left: 850px; top: 270px; font: italic 400 96px/1 "Hidra Serif", serif; }
        #s08-a2 { position: absolute; left: 840px; top: 390px; font: 400 152px/0.95 "Hidra Display", sans-serif; letter-spacing: -0.05em; }
        #s08-a2 span { display: block; }
        #s08-a2 .c { color: #2447e6; }

        /* Phone with a generic social post */
        #s08-phonewrap { position: absolute; inset: 0; }
        #s08-phone { position: absolute; left: 220px; top: 130px; width: 410px; height: 830px; border-radius: 60px; background: #101218; padding: 15px; box-shadow: 0 50px 100px rgba(21, 22, 40, 0.3), inset 0 0 0 2px #2a2d38; }
        #s08-screen { position: relative; width: 100%; height: 100%; border-radius: 46px; overflow: hidden; background: #ffffff; }
        #s08-notch { position: absolute; left: 50%; top: 12px; width: 116px; height: 32px; margin-left: -58px; border-radius: 16px; background: #101218; z-index: 3; }
        #s08-head { position: absolute; left: 22px; right: 22px; top: 64px; display: flex; align-items: center; gap: 12px; }
        #s08-av { width: 46px; height: 46px; border-radius: 50%; background: #2447e6; color: #fff; font: 400 22px/46px "Hidra Display", sans-serif; text-align: center; }
        #s08-handle { font: 800 19px/1.2 "Hidra Sans", sans-serif; }
        #s08-handle span { display: block; font-weight: 500; font-size: 15px; color: rgba(21, 22, 28, 0.5); }
        #s08-post { position: absolute; left: 0; right: 0; top: 130px; height: 380px; background: radial-gradient(circle at 50% 40%, #4a6bff, #2447e6 60%, #1b27a8); overflow: hidden; }
        #s08-post img { position: absolute; left: 50%; top: 20px; width: 200px; height: 356px; margin-left: -100px; }
        #s08-post b { position: absolute; left: 22px; bottom: 18px; font: 400 34px/1 "Hidra Display", sans-serif; color: #fff; letter-spacing: -0.02em; }
        #s08-actions { position: absolute; left: 22px; right: 22px; top: 528px; display: flex; align-items: center; gap: 18px; }
        #s08-heart { width: 40px; height: 40px; }
        #s08-likes { font: 800 24px/1 "Hidra Sans", sans-serif; }
        #s08-cap { position: absolute; left: 22px; right: 22px; top: 584px; font: 500 18px/1.4 "Hidra Sans", sans-serif; color: rgba(21, 22, 28, 0.75); }
        #s08-cap b { color: #2447e6; font-weight: 800; }
        #s08-notif { position: absolute; left: 12px; right: 12px; top: 56px; height: 84px; border-radius: 22px; background: rgba(255, 255, 255, 0.97); box-shadow: 0 14px 30px rgba(21, 22, 40, 0.2); display: flex; align-items: center; gap: 12px; padding: 0 16px; z-index: 2; }
        #s08-notif .ico { width: 44px; height: 44px; border-radius: 12px; background: #ff8a1f; color: #fff; font: 400 20px/44px "Hidra Display", sans-serif; text-align: center; }
        #s08-notif b { display: block; font: 800 17px/1.25 "Hidra Sans", sans-serif; }
        #s08-notif span { display: block; font: 500 15px/1.25 "Hidra Sans", sans-serif; color: rgba(21, 22, 28, 0.6); }
        .s08-fly { position: absolute; width: 90px; height: 90px; left: 0; top: 0; }

        /* Right panels */
        .s08-panel { position: absolute; left: 790px; top: 0; right: 80px; bottom: 0; }
        .s08-h { position: absolute; left: 0; font: 400 160px/1 "Hidra Display", sans-serif; letter-spacing: -0.045em; }
        .s08-s { position: absolute; left: 0; font: italic 400 120px/1 "Hidra Serif", serif; }
        .s08-net { position: absolute; height: 76px; padding: 0 34px; border-radius: 38px; font: 800 34px/76px "Hidra Sans", sans-serif; }
        #s08-tt { left: 0; top: 650px; background: #15161c; color: #f2f4f8; }
        #s08-ig { left: 250px; top: 650px; background: #ffffff; color: #15161c; border: 3px solid #15161c; line-height: 70px; }
        #s08-hash { position: absolute; left: 0; top: 320px; height: 150px; padding: 0 46px; border-radius: 34px; background: #2447e6; color: #f2f4f8; font: 400 104px/150px "Hidra Display", sans-serif; letter-spacing: -0.04em; box-shadow: 0 26px 60px rgba(36, 71, 230, 0.35); white-space: nowrap; }
        #s08-cal { position: absolute; left: 6px; top: 540px; display: grid; grid-template-columns: repeat(10, 70px); gap: 14px; }
        .s08-day { width: 70px; height: 70px; border-radius: 16px; background: rgba(21, 22, 28, 0.07); position: relative; overflow: hidden; }
        .s08-day i { position: absolute; inset: 0; background: #2447e6; border-radius: 16px; display: block; transform-origin: center; }
        .s08-day i::after { content: ""; position: absolute; left: 25px; top: 18px; width: 14px; height: 26px; border: solid #fff; border-width: 0 6px 6px 0; transform: rotate(45deg); }
        #s08-pct { position: absolute; left: -10px; top: 250px; font: 400 340px/1 "Hidra Display", sans-serif; letter-spacing: -0.06em; color: #ff8a1f; filter: drop-shadow(0 0 40px rgba(255, 138, 31, 0.4)); }
        #s08-cap2 { position: absolute; left: 0; top: 640px; font: italic 400 120px/1 "Hidra Serif", serif; }
        #s08-grad { position: absolute; left: 840px; top: 560px; width: 260px; height: 260px; }
        #s08-grad img { width: 100%; height: 100%; display: block; }
      </style>

      <div id="s08" data-composition-id="s08-promotion" data-width="1920" data-height="1080" data-duration="12.6">
        <div id="s08-a">
          <div class="s08-wave" id="s08-w1"></div>
          <div class="s08-wave" id="s08-w2"></div>
          <div id="s08-mega"><img src="../assets/img/megaphone.png" alt="" /></div>
          <div id="s08-a1">Para venderla:</div>
          <div id="s08-a2"><span>REDES</span><span class="c">SOCIALES</span></div>
        </div>

        <div id="s08-phonewrap"><div id="s08-phone">
          <div id="s08-screen">
            <div id="s08-notch"></div>
            <div id="s08-head"><div id="s08-av">H</div><div id="s08-handle" data-layout-allow-overlap>hidra.bottle<span data-layout-allow-overlap>Colaboración · fitness</span></div></div>
            <div id="s08-post"><img src="../assets/img/bottle-tilt.png" alt="" /><b>DÍA 1 / 30</b></div>
            <div id="s08-actions">
              <svg id="s08-heart" viewBox="0 0 24 24"><path id="s08-heart-p" d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.2 0 3.6 1.2 5.3 3.1 1.7-1.9 3.1-3.1 5.3-3.1 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z" fill="none" stroke="#15161c" stroke-width="2" /></svg>
              <div id="s08-likes">0</div>
            </div>
            <div id="s08-cap"><b>hidra.bottle</b> Empieza el reto <b>#30DíasHIDRA</b>: dos litros al día durante un mes. ¿Te apuntas?</div>
            <div id="s08-notif"><div class="ico">%</div><div><b>Código ESTUDIANTE20</b><span>−20% con tu carné de estudiante</span></div></div>
          </div>
        </div>
        </div>
        <div id="s08-flies"></div>

        <div class="s08-panel" id="s08-b1">
          <div class="s08-h" style="top: 300px">Influencers</div>
          <div class="s08-s" style="top: 470px">de fitness</div>
          <div class="s08-net" id="s08-tt">TikTok</div>
          <div class="s08-net" id="s08-ig">Instagram</div>
        </div>
        <div class="s08-panel" id="s08-b2">
          <div class="s08-s" style="top: 190px; font-size: 96px">El reto</div>
          <div id="s08-hash">#30DíasHIDRA</div>
          <div id="s08-cal"></div>
        </div>
        <div class="s08-panel" id="s08-b3">
          <div id="s08-pct">−20%</div>
          <div id="s08-cap2">para estudiantes</div>
          <div id="s08-grad"><img src="../assets/img/gradcap.png" alt="" /></div>
        </div>
      </div>

      <script>
        (function () {
          function rng(seed) {
            return function () {
              seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
              let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }
          const r = rng(77);
          const cal = document.getElementById("s08-cal");
          const days = [];
          for (let i = 0; i < 30; i++) {
            const d = document.createElement("div");
            d.className = "s08-day";
            const fill = document.createElement("i");
            d.appendChild(fill);
            cal.appendChild(d);
            days.push(fill);
          }
          const flies = [];
          const fliesEl = document.getElementById("s08-flies");
          for (let i = 0; i < 9; i++) {
            const img = document.createElement("img");
            img.className = "s08-fly";
            img.src = "../assets/img/heart.png";
            fliesEl.appendChild(img);
            flies.push({ el: img, x0: 280 + r() * 60, y0: 660, x1: 200 + r() * 520, y1: 120 + r() * 300, rot: (r() - 0.5) * 60, s: 0.6 + r() * 0.7, d: r() * 1.4 });
          }
          const kids = (sel) => document.querySelectorAll(sel + " > *");
          const fmtK = (n) => (n >= 1000 ? (n / 1000).toFixed(1).replace(".", ",") + " K" : String(Math.round(n)));

          const tl = gsap.timeline({ paused: true });

          // Phase A — "Para venderla, apostamos por las redes sociales" (VO 0.4 s).
          tl.fromTo("#s08-mega", { opacity: 0, scale: 0.3, rotation: -40, x: -120 }, { opacity: 1, scale: 1, rotation: 0, x: 0, duration: 0.7, ease: "back.out(1.6)" }, 0.3);
          [["#s08-w1", 0.9], ["#s08-w2", 1.3]].forEach(([w, at]) => {
            tl.fromTo(w, { scale: 0.4, opacity: 0.9, x: 0 }, { scale: 1.7, opacity: 0, x: 90, duration: 0.9, ease: "power2.out", repeat: 2 }, at);
          });
          tl.fromTo("#s08-a1", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.45);
          tl.fromTo("#s08-a2 span", { opacity: 0, yPercent: 60, filter: "blur(16px)" }, { opacity: 1, yPercent: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out", stagger: 0.18 }, 1.7);
          tl.to("#s08-a", { x: -500, opacity: 0, filter: "blur(16px)", duration: 0.45, ease: "power2.in" }, 3.3);

          // Phone rises and stays for the rest of the scene.
          tl.fromTo("#s08-phonewrap", { y: 1000, rotation: -10 }, { y: 0, rotation: 0, duration: 0.8, ease: "expo.out" }, 3.55);
          tl.to("#s08-phone", { rotation: -2, duration: 4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.35);

          // B1 — "Influencers de fitness en TikTok e Instagram" (VO 3.6 s).
          tl.fromTo(kids("#s08-b1"), { opacity: 0, x: 60, filter: "blur(12px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.15 }, 3.7);
          const likes = { v: 0 };
          const likesEl = document.getElementById("s08-likes");
          tl.to(likes, { v: 12400, duration: 2.4, ease: "power2.out", onUpdate: () => { likesEl.textContent = fmtK(likes.v); } }, 4.6);
          tl.fromTo("#s08-heart-p", { fill: "rgba(255,77,94,0)", stroke: "#15161c" }, { fill: "#ff4d5e", stroke: "#ff4d5e", duration: 0.2 }, 4.7);
          tl.fromTo("#s08-heart", { scale: 1 }, { scale: 1.35, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, 4.7);
          flies.forEach((f) => {
            tl.fromTo(f.el, { x: f.x0, y: f.y0, scale: 0.2, rotation: 0, opacity: 0 }, { x: f.x1, y: f.y1, scale: f.s, rotation: f.rot, opacity: 1, duration: 1.0, ease: "power2.out" }, 4.8 + f.d);
            tl.to(f.el, { opacity: 0, y: f.y1 - 80, duration: 0.5, ease: "power1.in" }, 5.8 + f.d);
          });
          tl.to(kids("#s08-b1"), { opacity: 0, x: -40, filter: "blur(12px)", duration: 0.3, ease: "power2.in", stagger: 0.04 }, 6.55);

          // B2 — "el reto: treinta días Hidra" (VO 6.8 s).
          tl.fromTo(kids("#s08-b2"), { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.12 }, 6.8);
          tl.fromTo("#s08-hash", { scale: 0.6, rotation: -4 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2)" }, 6.9);
          tl.fromTo(days, { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.045 }, 7.3);
          tl.to(kids("#s08-b2"), { opacity: 0, x: -40, filter: "blur(12px)", duration: 0.3, ease: "power2.in", stagger: 0.04 }, 8.75);

          // B3 — "y un veinte por ciento de descuento para estudiantes" (VO 9.0 s).
          tl.fromTo("#s08-pct", { opacity: 0, scale: 2.4, rotation: -14 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.45, ease: "power4.in" }, 8.95);
          tl.to("#s08-pct", { y: 14, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 9.4);
          tl.fromTo("#s08-cap2", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 10.0);
          tl.fromTo("#s08-grad", { opacity: 0, scale: 0, rotation: 30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2)" }, 10.4);
          tl.fromTo("#s08-notif", { y: -140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, 9.5);

          // Exit.
          tl.to(["#s08-b3", "#s08-phonewrap"], { y: -120, opacity: 0, filter: "blur(14px)", duration: 0.4, ease: "power2.in", stagger: 0.05 }, 12.15);

          window.__timelines["s08-promotion"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
