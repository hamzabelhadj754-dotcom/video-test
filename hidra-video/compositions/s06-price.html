<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="s06-price-template">
      <style>
        @font-face { font-family: "Hidra Display"; src: url(../assets/fonts/ArchivoBlack.woff2) format("woff2"); font-weight: 400; }
        @font-face { font-family: "Hidra Serif"; src: url(../assets/fonts/InstrumentSerif-Italic.woff2) format("woff2"); font-style: italic; }
        @font-face { font-family: "Hidra Sans"; src: url(../assets/fonts/Montserrat-Var.woff2) format("woff2"); font-weight: 100 900; }

        #s06 { position: absolute; inset: 0; overflow: hidden; color: #15161c; }
        #s06-tag { position: absolute; left: 150px; top: 250px; width: 560px; height: 560px; }
        #s06-tag img { width: 100%; height: 100%; display: block; }
        #s06-bottle { position: absolute; left: 470px; top: 330px; width: 260px; height: 462px; }
        #s06-bottle img { width: 100%; height: 100%; display: block; }
        #s06-q { position: absolute; left: 840px; top: 170px; font: italic 400 104px/1 "Hidra Serif", serif; }

        #s06-price { position: absolute; left: 830px; top: 300px; height: 300px; display: flex; align-items: flex-start; color: #ff8a1f; font: 400 300px/300px "Hidra Display", sans-serif; letter-spacing: -0.05em; }
        #s06-pinner { display: flex; align-items: flex-start; transform-origin: left center; filter: drop-shadow(0 0 34px rgba(255, 138, 31, 0.4)); }
        .s06-wheel { position: relative; height: 300px; overflow: hidden; display: inline-block; }
        .s06-strip { display: flex; flex-direction: column; }
        .s06-strip span { height: 300px; display: block; text-align: center; }
        .s06-static { display: inline-block; }
        #s06-eur { font-size: 190px; margin-left: 24px; line-height: 330px; }

        #s06-scale { position: absolute; left: 850px; top: 760px; width: 900px; height: 120px; }
        #s06-track { position: absolute; left: 0; right: 0; top: 64px; height: 14px; border-radius: 7px; background: linear-gradient(90deg, #d6d9e2, #9aa8f0 60%, #2447e6); transform-origin: left center; }
        .s06-tick { position: absolute; top: 56px; width: 3px; height: 30px; background: rgba(21, 22, 28, 0.25); border-radius: 2px; }
        .s06-lab { position: absolute; top: 100px; font: 800 22px/1 "Hidra Sans", sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(21, 22, 28, 0.55); }
        #s06-marker { position: absolute; left: 0; top: 0; width: 0; height: 0; }
        #s06-pin {
          position: absolute; left: -84px; top: -6px; width: 168px; height: 52px; border-radius: 14px; background: #2447e6; color: #f2f4f8;
          font: 400 26px/52px "Hidra Display", sans-serif; text-align: center; letter-spacing: -0.01em; box-shadow: 0 12px 30px rgba(36, 71, 230, 0.4);
        }
        #s06-pin::after { content: ""; position: absolute; left: 50%; bottom: -10px; margin-left: -10px; border: 10px solid transparent; border-bottom: 0; border-top-color: #2447e6; }
        #s06-dot { position: absolute; left: -15px; top: 56px; width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 6px solid #2447e6; }
        #s06-cap { position: absolute; left: 850px; top: 640px; font: italic 400 72px/1 "Hidra Serif", serif; }
        #s06-cap b { font-style: italic; color: #2447e6; font-weight: 400; }
      </style>

      <div id="s06" data-composition-id="s06-price" data-width="1920" data-height="1080" data-duration="6.2">
        <div id="s06-tag"><img src="../assets/img/tag.png" alt="" /></div>
        <div id="s06-bottle"><img src="../assets/img/bottle-tilt.png" alt="" /></div>
        <div id="s06-q">¿Su precio?</div>
        <div id="s06-price"><div id="s06-pinner">
          <div class="s06-wheel" data-digit="2"></div>
          <div class="s06-wheel" data-digit="9"></div>
          <div class="s06-static">,</div>
          <div class="s06-wheel" data-digit="9"></div>
          <div class="s06-wheel" data-digit="9"></div>
          <div class="s06-static" id="s06-eur">€</div>
        </div></div>
        <div id="s06-cap"><b>Premium,</b> pero accesible.</div>
        <div id="s06-scale">
          <div id="s06-track"></div>
          <div class="s06-tick" style="left: 0"></div>
          <div class="s06-tick" style="left: 449px"></div>
          <div class="s06-tick" style="left: 897px"></div>
          <div class="s06-lab" style="left: 0">Barato</div>
          <div class="s06-lab" style="right: 0">Lujo</div>
          <div id="s06-marker"><div id="s06-pin">HIDRA</div><div id="s06-dot"></div></div>
        </div>
      </div>

      <script>
        (function () {
          // Build the rolling digit strips: each lands on its digit after a long spin.
          const wheels = [...document.querySelectorAll("#s06 .s06-wheel")];
          wheels.forEach((w) => {
            const strip = document.createElement("div");
            strip.className = "s06-strip";
            for (let i = 0; i < 20; i++) {
              const s = document.createElement("span");
              s.textContent = i % 10;
              strip.appendChild(s);
            }
            w.appendChild(strip);
            w.style.width = "0.62em";
          });

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s06-tag", { opacity: 0, scale: 0.4, rotation: -50 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.8, ease: "back.out(1.6)" }, 0.3);
          tl.fromTo("#s06-tag img", { y: 0, rotation: 0 }, { y: -18, rotation: 4, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 2 }, 1.1);
          tl.fromTo("#s06-bottle", { opacity: 0, x: 120, rotation: 20 }, { opacity: 1, x: 0, rotation: 0, duration: 0.8, ease: "power3.out" }, 0.55);
          tl.fromTo("#s06-q", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 0.4);

          // "Veintinueve euros con noventa y nueve" (VO 1.4–3.3 s): digits spin and lock left to right.
          tl.fromTo("#s06-price", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.15);
          wheels.forEach((w, i) => {
            const d = parseInt(w.dataset.digit, 10);
            tl.fromTo(w.firstChild, { y: 0 }, { y: -(10 + d) * 300, duration: 1.3 + i * 0.25, ease: "power4.out" }, 1.2 + i * 0.12);
          });
          tl.fromTo(["#s06-price .s06-static"], { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.3 }, 1.6);
          tl.fromTo("#s06-pinner", { scale: 1 }, { scale: 1.06, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1 }, 3.0);

          // "Premium, pero accesible." (VO 3.7 s): the marker settles past the middle of the scale.
          tl.fromTo("#s06-track", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 3.55);
          tl.fromTo("#s06-scale .s06-tick, #s06-scale .s06-lab", { opacity: 0 }, { opacity: 1, duration: 0.3, stagger: 0.04 }, 3.7);
          tl.fromTo("#s06-marker", { x: 0, opacity: 0 }, { x: 610, opacity: 1, duration: 0.9, ease: "back.out(1.4)" }, 3.8);
          tl.fromTo("#s06-cap", { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 3.85);

          // Exit.
          tl.to(["#s06-tag", "#s06-bottle", "#s06-q", "#s06-price", "#s06-cap", "#s06-scale"], { x: "-=300", opacity: 0, filter: "blur(14px)", duration: 0.4, ease: "power2.in", stagger: 0.02 }, 5.75);

          window.__timelines["s06-price"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
