        @font-face { font-family: "Hidra Sans"; src: url(../assets/fonts/Montserrat-Var.woff2) format("woff2"); font-weight: 100 900; }

        #s04 { position: absolute; inset: 0; overflow: hidden; color: #15161c; }
        #s04-bottle { position: absolute; left: 300px; top: 110px; width: 484px; height: 860px; }
        #s04-bottle img { position: absolute; inset: 0; width: 100%; height: 100%; }
        #s04-shadow { position: absolute; left: 392px; top: 948px; width: 300px; height: 40px; border-radius: 50%; background: radial-gradient(closest-side, rgba(21, 22, 40, 0.34), transparent); }
        #s04-glow { position: absolute; left: 342px; top: 97px; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(closest-side, rgba(159, 216, 255, 0.95), rgba(120, 180, 255, 0.35) 45%, transparent); mix-blend-mode: screen; }
        .s04-ring { position: absolute; left: 442px; top: 197px; width: 200px; height: 200px; border-radius: 50%; border: 4px solid rgba(80, 150, 255, 0.7); }
        #s04-lines { position: absolute; inset: 0; }

        .s04-panel { position: absolute; left: 900px; top: 0; bottom: 0; right: 100px; }

        #s04-notch { position: absolute; left: 50%; top: 12px; width: 110px; height: 30px; margin-left: -55px; border-radius: 16px; background: #101218; }
        #s04-time { position: absolute; left: 30px; top: 18px; font: 700 18px/1 "Hidra Sans", sans-serif; color: #15161c; }
        #s04-app { position: absolute; left: 0; right: 0; top: 70px; text-align: center; font: 400 30px/1 "Hidra Display", sans-serif; color: #2447e6; letter-spacing: -0.02em; }
        #s04-ringwrap { position: absolute; left: 50%; top: 130px; width: 240px; height: 240px; margin-left: -120px; }
        #s04-ringwrap svg { width: 240px; height: 240px; }
        #s04-liters { position: absolute; left: 0; right: 0; top: 78px; text-align: center; font: 400 54px/1 "Hidra Display", sans-serif; letter-spacing: -0.03em; }
        #s04-goal { position: absolute; left: 0; right: 0; top: 140px; text-align: center; font: 600 18px/1 "Hidra Sans", sans-serif; color: rgba(21, 22, 28, 0.55); }
        #s04-week { position: absolute; left: 34px; right: 34px; top: 420px; height: 150px; display: flex; align-items: flex-end; justify-content: space-between; }
        .s04-bar { width: 26px; height: 100%; border-radius: 8px; background: #d9def3; position: relative; overflow: hidden; }
        .s04-bar i { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; border-radius: 8px; background: #2447e6; transform-origin: bottom center; display: block; }
        #s04-days { position: absolute; left: 34px; right: 34px; top: 584px; display: flex; justify-content: space-between; font: 700 15px/1 "Hidra Sans", sans-serif; color: rgba(21, 22, 28, 0.45); }
        #s04-days span { width: 26px; text-align: center; }
        #s04-notif {
          position: absolute; left: 12px; right: 12px; top: 54px; height: 86px; border-radius: 22px; background: rgba(255, 255, 255, 0.96);
          box-shadow: 0 14px 30px rgba(21, 22, 40, 0.18); display: flex; align-items: center; gap: 12px; padding: 0 16px;
        }
        #s04-notif img { width: 46px; height: 46px; }
        #s04-notif b { display: block; font: 800 17px/1.25 "Hidra Sans", sans-serif; color: #15161c; }
        #s04-notif span { display: block; font: 500 15px/1.25 "Hidra Sans", sans-serif; color: rgba(21, 22, 28, 0.6); }

        #s04-24 { position: absolute; left: 0; top: 300px; font: 400 330px/1 "Hidra Display", sans-serif; letter-spacing: -0.05em; color: #ff8a1f; text-shadow: 0 0 70px rgba(255, 138, 31, 0.4); }
        #s04-24 small { font-size: 150px; letter-spacing: -0.02em; margin-left: 10px; }
        #s04-ice { position: absolute; left: 1490px; top: 270px; width: 400px; height: 400px; }
        #s04-ice::before { content: ""; position: absolute; inset: -10%; border-radius: 50%; background: radial-gradient(closest-side, rgba(120, 180, 255, 0.35), transparent); }
        #s04-ice img { position: relative; }
        #s04-ice img { width: 100%; height: 100%; }
        .s04-frost { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #bfe3ff; box-shadow: 0 0 12px #9fd8ff; }

        #s04-steps { position: absolute; right: 100px; bottom: 70px; display: flex; gap: 14px; }
        .s04-step { width: 64px; height: 8px; border-radius: 4px; background: rgba(21, 22, 28, 0.12); position: relative; overflow: hidden; }
        .s04-step i { position: absolute; inset: 0; background: #2447e6; transform-origin: left center; display: block; }
      </style>

      <div id="s04" data-composition-id="s04-features" data-width="1920" data-height="1080" data-duration="11">
        <div id="s04-shadow"></div>
        <div class="s04-ring" id="s04-ring1"></div>
        <div class="s04-ring" id="s04-ring2"></div>
        <div id="s04-bottle">
          <img id="s04-b-off" src="../assets/img/bottle-hero.png" alt="" />
          <img id="s04-b-on" src="../assets/img/bottle-led.png" alt="" />
        </div>
        <div id="s04-glow"></div>

        <svg id="s04-lines" viewBox="0 0 1920 1080">
          <path id="s04-l1" d="M 668 297 C 760 297, 780 250, 880 250" fill="none" stroke="#2447e6" stroke-width="3" stroke-dasharray="400" stroke-dashoffset="400" />
          <circle id="s04-d1" cx="668" cy="297" r="9" fill="#2447e6" />
          <path id="s04-l2" d="M 676 841 C 780 841, 790 470, 880 470" fill="none" stroke="#2447e6" stroke-width="3" stroke-dasharray="700" stroke-dashoffset="700" />
          <circle id="s04-d2" cx="676" cy="841" r="9" fill="#2447e6" />
          <path id="s04-l3" d="M 676 560 C 760 560, 790 400, 880 400" fill="none" stroke="#ff8a1f" stroke-width="3" stroke-dasharray="500" stroke-dashoffset="500" />
          <circle id="s04-d3" cx="676" cy="560" r="9" fill="#ff8a1f" />
        </svg>

        <div class="s04-panel" id="s04-p1">
          <div class="s04-tag" style="top: 226px"><b>01</b> Luz LED</div>
          <div class="s04-h" style="top: 330px">Te avisa</div>
          <div class="s04-s" style="top: 480px">cuándo beber.</div>
          <div class="s04-sub" style="top: 640px; width: 640px">El anillo del tapón se enciende cuando toca hidratarse.</div>
        </div>

        <div class="s04-panel" id="s04-p2">
          <div class="s04-tag" style="top: 300px"><b>02</b> Sensor + app</div>
          <div class="s04-h" style="top: 400px">Mide</div>
          <div class="s04-s" style="top: 545px; font-size: 98px">cuánto bebes</div>
          <div class="s04-sub" style="top: 690px; width: 460px">…y lo envía a tu móvil.</div>
        </div>
        <div id="s04-phone">
          <div id="s04-screen">
            <div id="s04-notch"></div>
            <div id="s04-time">9:41</div>
            <div id="s04-app" data-layout-allow-overlap>HIDRA</div>
            <div id="s04-ringwrap">
              <svg viewBox="0 0 240 240">
                <circle cx="120" cy="120" r="100" fill="none" stroke="#e3e7f6" stroke-width="22" />
                <circle id="s04-prog" cx="120" cy="120" r="100" fill="none" stroke="#2447e6" stroke-width="22" stroke-linecap="round" stroke-dasharray="628.3" stroke-dashoffset="628.3" transform="rotate(-90 120 120)" />
              </svg>
              <div id="s04-liters">0,0 L</div>
              <div id="s04-goal">de 2 L hoy</div>
            </div>
            <div id="s04-week">
              <div class="s04-bar"><i style="height: 62%"></i></div>
              <div class="s04-bar"><i style="height: 80%"></i></div>
              <div class="s04-bar"><i style="height: 55%"></i></div>
              <div class="s04-bar"><i style="height: 92%"></i></div>
              <div class="s04-bar"><i style="height: 74%"></i></div>
              <div class="s04-bar"><i style="height: 86%"></i></div>
              <div class="s04-bar"><i style="height: 70%"></i></div>
            </div>
            <div id="s04-days"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>

              <div><b>¡Hora de beber agua!</b><span>Llevas 1,4 L hoy · ¡sigue así!</span></div>

        <div class="s04-panel" id="s04-p3">
          <div class="s04-tag" style="top: 226px"><b>03</b> Doble pared</div>
          <div id="s04-24"><span id="s04-24n">0</span><small>h</small></div>
          <div class="s04-s" style="top: 660px">de agua fría.</div>
        </div>
        <div id="s04-ice"><img src="../assets/img/ice.png" alt="" /></div>
        <div id="s04-frost"></div>

        <div id="s04-steps">
          <div class="s04-step"><i id="s04-st1"></i></div>
          <div class="s04-step"><i id="s04-st2"></i></div>
          <div class="s04-step"><i id="s04-st3"></i></div>
        </div>
      </div>

      <script>
        (function () {
          function rng(seed) {
            return function () {
              seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
              let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }
          const r = rng(41);
          const frost = document.getElementById("s04-frost");
          const flakes = [];
          for (let i = 0; i < 16; i++) {
            const f = document.createElement("div");
            f.className = "s04-frost";
            const s = 4 + r() * 9;
            f.style.width = f.style.height = s + "px";
            f.style.left = 1460 + r() * 420 + "px";
            f.style.top = 260 + r() * 420 + "px";
            frost.appendChild(f);
            flakes.push({ el: f, dy: -40 - r() * 80, d: r() * 0.8 });
          }
          const kids = (sel) => document.querySelectorAll(sel + " > *");

          const tl = gsap.timeline({ paused: true });

          // Entrance: bottle arrives from the right as the reveal pans away.
          tl.fromTo("#s04-bottle", { x: 360, opacity: 0, filter: "blur(16px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo("#s04-shadow", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.1);
          tl.to("#s04-bottle", { y: -14, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.6);
          tl.fromTo("#s04-steps", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.3);

          // F1 — LED reminder (VO 0.4 s).
          tl.fromTo("#s04-b-on", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.55);
          tl.fromTo("#s04-glow", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 0.55);
          tl.to("#s04-glow", { scale: 0.82, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.95);
          [["#s04-ring1", 0.6], ["#s04-ring2", 1.1]].forEach(([el, at]) => {
            tl.fromTo(el, { scale: 0.4, opacity: 0.9 }, { scale: 2.4, opacity: 0, duration: 1.1, ease: "power2.out", repeat: 1, repeatDelay: 0.0 }, at);
          });
          tl.fromTo("#s04-l1", { strokeDashoffset: 400 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 0.5);
          tl.fromTo("#s04-d1", { scale: 0, svgOrigin: "668 297" }, { scale: 1, svgOrigin: "668 297", duration: 0.3, ease: "back.out(3)" }, 0.45);
          tl.fromTo(kids("#s04-p1"), { opacity: 0, x: 50, filter: "blur(12px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.12 }, 0.6);
          tl.fromTo("#s04-st1", { scaleX: 0 }, { scaleX: 1, duration: 2.3, ease: "none" }, 0.4);
          tl.to(kids("#s04-p1"), { opacity: 0, x: -40, filter: "blur(12px)", duration: 0.3, ease: "power2.in", stagger: 0.04 }, 2.6);
          tl.to(["#s04-l1", "#s04-d1"], { opacity: 0, duration: 0.3 }, 2.6);
          tl.to("#s04-glow", { opacity: 0, duration: 0.4 }, 2.7);
          tl.to("#s04-b-on", { opacity: 0, duration: 0.4 }, 2.75);

          // F2 — sensor + phone app (VO 2.9 s).
          tl.fromTo("#s04-l2", { strokeDashoffset: 700 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 2.95);
          tl.fromTo("#s04-d2", { scale: 0, svgOrigin: "676 841" }, { scale: 1, svgOrigin: "676 841", duration: 0.3, ease: "back.out(3)" }, 2.9);
          tl.fromTo(kids("#s04-p2"), { opacity: 0, x: 50, filter: "blur(12px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.12 }, 3.0);
          tl.fromTo("#s04-phone", { y: 1000, rotation: 8 }, { y: 0, rotation: 0, duration: 0.75, ease: "expo.out" }, 3.0);
          tl.fromTo("#s04-prog", { strokeDashoffset: 628.3 }, { strokeDashoffset: 628.3 * 0.3, duration: 1.6, ease: "power2.out" }, 3.5);
          const lit = { v: 0 };
          const litEl = document.getElementById("s04-liters");
          tl.to(lit, { v: 1.4, duration: 1.6, ease: "power2.out", onUpdate: () => { litEl.textContent = lit.v.toFixed(1).replace(".", ",") + " L"; } }, 3.5);
          tl.fromTo(document.querySelectorAll("#s04-week i"), { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "back.out(1.6)", stagger: 0.06 }, 3.7);
          tl.fromTo("#s04-notif", { y: -140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, 4.4);
          tl.fromTo("#s04-st2", { scaleX: 0 }, { scaleX: 1, duration: 3.8, ease: "none" }, 2.9);
          tl.to(kids("#s04-p2"), { opacity: 0, x: -40, filter: "blur(12px)", duration: 0.3, ease: "power2.in", stagger: 0.04 }, 6.6);
          tl.to(["#s04-l2", "#s04-d2"], { opacity: 0, duration: 0.3 }, 6.6);
          tl.to("#s04-phone", { y: 1000, rotation: -6, duration: 0.5, ease: "power3.in" }, 6.55);

          // F3 — 24 h cold (VO 6.9 s).
          tl.fromTo("#s04-l3", { strokeDashoffset: 500 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 6.95);
          tl.fromTo("#s04-d3", { scale: 0, svgOrigin: "676 560" }, { scale: 1, svgOrigin: "676 560", duration: 0.3, ease: "back.out(3)" }, 6.9);
          tl.fromTo(kids("#s04-p3"), { opacity: 0, x: 50, filter: "blur(12px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.14 }, 7.0);
          const hrs = { v: 0 };
          const hEl = document.getElementById("s04-24n");
          tl.to(hrs, { v: 24, duration: 1.4, ease: "power2.out", onUpdate: () => { hEl.textContent = Math.round(hrs.v); } }, 7.6);
          tl.fromTo("#s04-ice", { opacity: 0, scale: 0.3, rotation: -40 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.7)" }, 7.4);
          tl.to("#s04-ice", { y: -22, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 8.1);
          flakes.forEach((f) => {
            tl.fromTo(f.el, { opacity: 0, y: 0, scale: 0 }, { opacity: 0.9, y: f.dy, scale: 1, duration: 1.6, ease: "power1.out" }, 7.6 + f.d);
          });
          tl.fromTo("#s04-st3", { scaleX: 0 }, { scaleX: 1, duration: 3.6, ease: "none" }, 6.9);

          // Exit: everything pans left.
          tl.to(["#s04-p3", "#s04-ice", "#s04-frost", "#s04-lines"], { x: -300, opacity: 0, filter: "blur(14px)", duration: 0.4, ease: "power2.in" }, 10.55);
          tl.to(["#s04-bottle", "#s04-shadow", "#s04-steps"], { x: -400, opacity: 0, duration: 0.4, ease: "power2.in" }, 10.6);

          window.__timelines["s04-features"] = tl;
        })();
      </script>
    </template>
