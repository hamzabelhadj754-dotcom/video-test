<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  @font-face { font-family: "Bebas"; src: url("assets/fonts/BebasNeue-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; color: #fff; font-family: Inter, sans-serif; }
  .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .abs { position: absolute; }
  .word { position: absolute; left: 0; right: 0; text-align: center; font-family: "Bebas"; text-transform: uppercase; line-height: .84; letter-spacing: .005em; color: #F5F2EC; text-shadow: 0 10px 40px rgba(0,0,0,.55); }
  .bar { position: absolute; left: 0; width: 1080px; height: 170px; background: #000; }
  .meta { font: 600 20px/1 Inter; letter-spacing: .42em; text-transform: uppercase; color: rgba(245,242,236,.7); }
  #grain { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2040px; opacity: .16; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' seed='8' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920" data-fps="30">
  <div class="full" id="cam"><video id="film" class="clip full" src="assets/edit.mp4" data-start="0" data-duration="6" data-track-index="0" muted playsinline style="object-fit:cover"></video></div>
  <!-- light: a warm anamorphic leak drifting across + lens vignette -->
  <div class="abs" id="leak" style="left:-600px; top:300px; width:1400px; height:1100px; border-radius:50%; background: radial-gradient(ellipse at center, rgba(255,150,70,.55), rgba(255,90,40,.18) 40%, transparent 70%); mix-blend-mode: screen; filter: blur(30px)"></div>
  <div class="abs" id="streak" style="left:-200px; top:930px; width:1480px; height:6px; background: linear-gradient(90deg, transparent, rgba(255,190,140,.75), transparent); mix-blend-mode: screen; filter: blur(2px)"></div>
  <div class="full" style="background: radial-gradient(ellipse 85% 70% at 50% 48%, transparent 48%, rgba(0,0,0,.72) 100%)"></div>
  <!-- type: one word per cut, hard swaps -->
  <div class="word" id="w1" style="top:760px; font-size:250px">Your<br>muscles</div>
  <div class="word" id="w2" style="top:820px; font-size:330px">Don't</div>
  <div class="word" id="w3" style="top:820px; font-size:330px">Grow</div>
  <div class="word" id="w4" style="top:820px; font-size:300px">In the</div>
  <div class="word" id="w5" style="top:700px; font-size:440px">Gym.</div>
  <div class="abs" id="sub" style="left:0; right:0; top:1110px; text-align:center">
    <div id="rule" style="width:120px; height:3px; margin:0 auto 26px; background:#E3243B; box-shadow:0 0 14px rgba(227,36,59,.8)"></div>
    <div style="font: 500 34px/1.3 Inter; letter-spacing: .28em; text-transform: uppercase; color:#F5F2EC">They grow when you rest</div>
  </div>
  <!-- letterbox -->
  <div class="bar" id="barT" style="top:0"><div class="meta" style="position:absolute; left:120px; bottom:30px">Gainsdom</div><div class="meta" style="position:absolute; right:120px; bottom:30px">Ch. 01</div></div>
  <div class="bar" id="barB" style="bottom:0"><div class="meta" style="position:absolute; left:0; right:0; top:34px; text-align:center">Recovery is training</div></div>
  <div id="grain"></div>
  <div class="full" id="flash" style="background:#fff; pointer-events:none"></div>
  <div class="full" id="fadein" style="background:#000; pointer-events:none"></div>
  <audio id="snd" class="clip" src="assets/audio/mix.wav" data-start="0" data-duration="6" data-track-index="1" data-volume="1"></audio>
</div>
<script>
document.fonts.ready.then(() => {
  const FR = 1 / 30; let seed = 4; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const tl = gsap.timeline({ paused: true });
  const CUTS = [0, 1.0, 1.6, 2.4, 3.1, 6.0];
  gsap.set(["#w1", "#w2", "#w3", "#w4", "#w5", "#sub", "#flash"], { autoAlpha: 0 });
  tl.fromTo("#grain", { x: 0, y: 0 }, { keyframes: Array.from({ length: 90 }, () => ({ x: -Math.round(rnd() * 60), y: -Math.round(rnd() * 60), duration: 2 * FR, ease: "steps(1)" })) }, 0);
  tl.fromTo("#fadein", { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.35, ease: "power2.out" }, 0);
  // letterbox closes in, opens a little on the hero shot
  tl.fromTo(["#barT", "#barB"], { scaleY: 1.8 }, { scaleY: 1, duration: 0.7, ease: "expo.out", transformOrigin: (i) => (i ? "50% 100%" : "50% 0%") }, 0);
  // camera: each shot lands slightly pushed in and settles (a punch on every cut); the hero shot creeps in
  CUTS.slice(0, 4).forEach((t, i) => tl.fromTo("#cam", { scale: 1.1 }, { scale: 1.0, duration: CUTS[i + 1] - t, ease: "expo.out", immediateRender: i === 0 }, t));
  tl.fromTo("#cam", { scale: 1.12 }, { scale: 1.0, duration: 0.5, ease: "expo.out", immediateRender: false }, 3.1);
  tl.to("#cam", { scale: 1.08, duration: 2.4, ease: "sine.inOut" }, 3.6);
  // type swaps hard on the cuts, each word lands with a tiny scale settle
  [["#w1", 0.1, 1.0], ["#w2", 1.0, 1.6], ["#w3", 1.6, 2.4], ["#w4", 2.4, 3.1], ["#w5", 3.1, 6.0]].forEach(([id, a, b]) => {
    tl.fromTo(id, { autoAlpha: 0, scale: 1.12, filter: "blur(8px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, a);
    if (b < 6) tl.set(id, { autoAlpha: 0 }, b);
  });
  tl.to("#w5", { scale: 0.92, y: -40, duration: 1.2, ease: "power3.inOut" }, 3.9);
  tl.fromTo("#sub", { autoAlpha: 0, y: 24, filter: "blur(10px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "expo.out" }, 4.15);
  tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut" }, 4.1);
  // flashes on the two big cuts, light leak blooms on every cut
  [1.0, 3.1].forEach((t) => tl.fromTo("#flash", { autoAlpha: 0 }, { keyframes: [{ autoAlpha: 0.75, duration: FR }, { autoAlpha: 0, duration: 0.2, ease: "power2.out" }], immediateRender: false }, t));
  tl.fromTo("#leak", { x: 0, opacity: 0.5 }, { x: 900, opacity: 0.35, duration: 6, ease: "sine.inOut" }, 0);
  CUTS.slice(1, 5).forEach((t) => tl.fromTo("#leak", { scale: 1 }, { keyframes: [{ scale: 1.35, duration: 0.08 }, { scale: 1, duration: 0.5, ease: "power2.out" }], immediateRender: false }, t));
  tl.fromTo("#streak", { x: -300, opacity: 0 }, { keyframes: [{ x: 0, opacity: 0.9, duration: 0.25 }, { x: 300, opacity: 0, duration: 0.6 }], ease: "power2.out" }, 3.1);
  tl.set({}, {}, 6);
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
});
</script>
</body>
</html>
