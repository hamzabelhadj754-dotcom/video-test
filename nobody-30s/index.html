<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #07070A; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #bg { position: absolute; inset: 0; background: #07070A; }
    </style>
  </head>
  <body>
    <!-- 30 s · 120 BPM (one beat = 0.5 s) · text + music, no voice -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1080" data-height="1920" data-fps="60" data-motion-blur="on" data-motion-blur-events="on">
      <div id="bg"></div>
      <div id="stage" data-composition-id="stage" data-composition-src="compositions/stage.html" data-start="0" data-duration="30" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>

      <div id="hook"   data-composition-id="hook"   data-composition-src="compositions/hook.html"   data-start="0"    data-duration="5.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="nots"   data-composition-id="nots"   data-composition-src="compositions/nots.html"   data-start="5.6"  data-duration="5"   data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="fade"   data-composition-id="fade"   data-composition-src="compositions/fade.html"   data-start="10.6" data-duration="2.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="math"   data-composition-id="math"   data-composition-src="compositions/math.html"   data-start="13.2" data-duration="8"   data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="system" data-composition-id="system" data-composition-src="compositions/system.html" data-start="21.2" data-duration="4.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="outro"  data-composition-id="outro"  data-composition-src="compositions/outro.html"  data-start="25.6" data-duration="4.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>

      <div id="texture" data-composition-id="texture" data-composition-src="compositions/texture.html" data-start="0" data-duration="30" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:6"></div>

      <audio id="music" class="clip" src="assets/audio/mix.wav" data-start="0" data-duration="30" data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
