  <script>
    (function () {
      const START = 5.6, T = (g) => g - START;
      const tl = gsap.timeline({ paused: true });
      const R = 1250, STEP = 40;
      // cylinder: every card pivots around a point R px behind it
      [1, 2, 3].forEach((n) => tl.set("#n-c" + n, { rotationY: (n - 1) * STEP, transformOrigin: `50% 50% ${-R}px` }, 0));
      tl.set("#n-ring", { transformOrigin: `0px 0px ${-R}px` }, 0);
      gsap.set(".n-strike", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set(".n-pill", { opacity: 0, scale: 0.6 });
      gsap.set([".n-dim", ".n-glow"], { opacity: 0 });

      // whip in from below at the speed the hook left
      tl.fromTo("#n-whip", { y: 1400 }, { y: 0, duration: 0.5, ease: "expo.out" }, T(5.6));
      tl.fromTo("#n-ring", { rotationY: 0, rotationX: 16, scale: 0.94 }, { rotationX: 4, scale: 1, duration: 1.4, ease: "expo.out" }, T(5.6));

      const beat = (n, tArrive) => {
        tl.fromTo("#n-sh" + n, { xPercent: -120 }, { xPercent: 320, duration: 0.9, ease: "power2.inOut" }, T(tArrive) - 0.1);
        const tS = tArrive + 0.55;
        tl.to("#n-s" + n, { scaleX: 1, duration: 0.22, ease: "power4.out" }, T(tS));
        tl.to("#n-p" + n, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.6)" }, T(tS) + 0.06);
        tl.to("#n-g" + n, { opacity: 1, duration: 0.1, ease: "power2.out" }, T(tS)).to("#n-g" + n, { opacity: 0.35, duration: 0.6, ease: "power2.out" }, T(tS) + 0.1);
        tl.to("#n-d" + n, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, T(tS) + 0.3);
        // a small recoil when the strike lands
        tl.to("#n-c" + n + " .n-flip", { z: -40, duration: 0.07, ease: "power2.out" }, T(tS)).to("#n-c" + n + " .n-flip", { z: 0, duration: 0.4, ease: "expo.out" }, T(tS) + 0.07);
      };
      beat(1, 6.0);
      // the carousel turns on the beat (lands at 7.5 and 9.0)
      tl.to("#n-ring", { rotationY: -STEP, duration: 0.36, ease: "power3.inOut" }, T(7.14));
      beat(2, 7.5);
      tl.to("#n-ring", { rotationY: -2 * STEP, duration: 0.36, ease: "power3.inOut" }, T(8.64));
      beat(3, 9.0);

      // card 3 turns over: its back is the motivation meter (carried into the next scene)
      tl.to(["#n-c1", "#n-c2", "#n-g3"], { opacity: 0, duration: 0.4, ease: "power2.in" }, T(10.0));
      tl.to("#n-ring", { rotationX: 0, duration: 0.5, ease: "power2.inOut" }, T(10.0));
      tl.fromTo("#n-f3", { rotationY: 0 }, { rotationY: 180, duration: 0.55, ease: "power3.inOut" }, T(10.02));
      window.__timelines["nots"] = tl;
    })();
