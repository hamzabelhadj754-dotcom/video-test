<template>
  <style>
    @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Regular.woff2") format("woff2"); font-style: normal; }
    @font-face { font-family: "Instrument Serif"; src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2"); font-style: italic; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; overflow: hidden; }
    #h-whip, #h-cam { position: absolute; inset: 0; }
    #h-view { position: absolute; inset: 0; perspective: 1300px; perspective-origin: 50% 40%; }
    #h-3d { position: absolute; inset: 0; transform-style: preserve-3d; }
    .h-chrome { background: linear-gradient(100deg, #8e8e97 0%, #f4f4f6 30%, #ffffff 42%, #c9c9cf 55%, #7d7d86 80%, #b9b9c0 100%);
      background-size: 250% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; color: transparent; }
    .h-goldtx { background: linear-gradient(100deg, #8a6420 0%, #D4A64A 30%, #ffe2a0 45%, #D4A64A 60%, #9b7428 100%);
      background-size: 250% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; color: transparent; }
    #h-nobody { position: absolute; left: 0; right: 0; top: 470px; text-align: center; font: 400 340px/1 "Instrument Serif", serif; letter-spacing: -0.04em; white-space: nowrap; padding-bottom: .1em; }
    #h-coming { position: absolute; left: 0; right: 0; top: 870px; text-align: center; font: 600 46px "Inter", sans-serif; letter-spacing: .5em; padding-left: .5em; color: #c8c8ce; white-space: nowrap; }
    .h-ch { display: inline-block; }
    #h-line3 { position: absolute; left: 0; right: 0; top: 960px; text-align: center; font: 400 190px/1.05 "Instrument Serif", serif; letter-spacing: -0.03em; white-space: nowrap; }
    .h-w { display: inline-block; padding-bottom: .12em; }
    #h-to { color: #9a9aa2; font-size: 150px; }
    #h-save { font-style: italic; font-size: 220px; padding-right: .05em; }
    #h-ring { position: absolute; left: 50%; top: 1080px; width: 700px; height: 700px; margin: -350px 0 0 -350px; border-radius: 50%; border: 2px solid rgba(255,226,160,.7); }
    #h-streak { position: absolute; left: 0; right: 0; top: 1186px; height: 2px; background: linear-gradient(90deg, transparent, rgba(255,240,210,.6) 25%, #fff 50%, rgba(255,240,210,.6) 75%, transparent); }
    #h-flash { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 40% at 50% 56%, rgba(255,236,200,.6), rgba(255,236,200,.1) 50%, transparent 80%); }
    #h-sub { position: absolute; left: 0; right: 0; top: 1300px; text-align: center; font: 600 30px "Inter"; letter-spacing: .36em; padding-left: .36em; color: #8a8a92; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="h-whip">
      <div id="h-cam">
        <div id="h-view"><div id="h-3d">
          <div id="h-nobody" class="h-chrome">Nobody</div>
        </div></div>
        <div id="h-coming" data-split="IS COMING"></div>
        <div id="h-ring"></div>
        <div id="h-streak"></div>
        <div id="h-line3"><span class="h-w" id="h-to">to</span> <span class="h-w h-goldtx" id="h-save">save</span> <span class="h-w h-chrome" id="h-you">you.</span></div>
      </div>
    </div>
    <div id="h-flash"></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      function rng(s) { return function () { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const el = document.getElementById("h-coming");
      el.innerHTML = [...el.dataset.split].map((c, i) => `<span class="h-ch" id="h-c${i}">${c === " " ? "&nbsp;" : c}</span>`).join("");
      const shake = (t, amt, seed, n = 8) => { const r = rng(seed); let tt = t;
        for (let i = 0; i < n; i++) { const k = 1 - i / n; tl.to("#h-cam", { x: (r() - 0.5) * amt * k, y: (r() - 0.5) * amt * k, duration: 1 / 30, ease: "none" }, tt); tt += 1 / 30; }
        tl.to("#h-cam", { x: 0, y: 0, duration: 0.12, ease: "power2.out" }, tt); };

      // 0.0 — frame 0 IS the hook: the word flies in out of depth, already legible
      tl.fromTo("#h-nobody", { rotationX: 30, z: -300, y: 40, opacity: 0.85, filter: "blur(2px)" },
        { rotationX: 0, z: 0, y: 0, opacity: 1, filter: "blur(0px)", duration: 1.1, ease: "expo.out" }, 0);
      tl.fromTo("#h-nobody", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.6, ease: "power2.inOut" }, 0.15);
      tl.fromTo("#h-cam", { x: 0, y: 0, scale: 1 }, { x: 0, y: 0, scale: 1, duration: 0.01 }, 0);
      shake(0.0, 16, 3, 6);

      // 1.5 — IS COMING: letters snap in from the centre outward on the beat
      const cs = [...document.querySelectorAll(".h-ch")], c0 = (cs.length - 1) / 2;
      cs.forEach((c, i) => tl.fromTo(c, { opacity: 0, filter: "blur(8px)", y: 26 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.5, ease: "expo.out" }, 1.5 + Math.abs(i - c0) * 0.025));

      // 2.5 "to" · 3.0 SAVE (the hit, on the bar) · 3.5 "you."
      tl.fromTo("#h-to", { opacity: 0, filter: "blur(10px)", x: -30 }, { opacity: 1, filter: "blur(0px)", x: 0, duration: 0.45, ease: "expo.out" }, 2.5);
      tl.fromTo("#h-save", { opacity: 0, scale: 1.9, filter: "blur(20px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 2.97);
      tl.fromTo("#h-save", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "power2.inOut" }, 3.2);
      tl.fromTo("#h-you", { opacity: 0, filter: "blur(10px)", x: 30 }, { opacity: 1, filter: "blur(0px)", x: 0, duration: 0.45, ease: "expo.out" }, 3.5);
      tl.fromTo("#h-you", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.0, ease: "power2.inOut" }, 3.7);

      // the hit
      tl.fromTo("#h-flash", { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.to("#h-flash", { opacity: 1, duration: 0.05, ease: "none" }, 3.0).to("#h-flash", { opacity: 0, duration: 0.5, ease: "power3.out" }, 3.05);
      tl.fromTo("#h-ring", { scale: 0.1, opacity: 0 }, { scale: 0.1, opacity: 0, duration: 0.01 }, 0);
      tl.to("#h-ring", { scale: 1.6, opacity: 0, duration: 0.9, ease: "expo.out", startAt: { scale: 0.1, opacity: 1 } }, 3.0);
      tl.fromTo("#h-streak", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "expo.out" }, 3.0).to("#h-streak", { opacity: 0.25, duration: 1.2, ease: "power2.out" }, 3.45);
      tl.to("#h-cam", { scale: 1.06, duration: 0.06, ease: "power2.out" }, 3.0);
      shake(3.0, 28, 11, 9);
      tl.to(["#h-nobody", "#h-coming"], { opacity: 0.28, duration: 0.7, ease: "power2.out" }, 3.15);


      // 5.1 — vertical whip out (the next scene whips in from below at matched speed)
      tl.to("#h-whip", { y: -1300, duration: 0.42, ease: "power3.in" }, 5.18);
      window.__timelines["hook"] = tl;
    })();
  </script>
</template>
