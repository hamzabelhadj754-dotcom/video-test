<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
  @font-face { font-family: "Bebas"; src: url("assets/fonts/BebasNeue-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Script"; src: url("assets/fonts/MrsSaintDelafield-Regular.woff2") format("woff2"); }
  :root { --red:#E3243B; --cream:#F3EFE7; --ink:#111113; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "Inter", sans-serif; }
  .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .abs { position: absolute; }
  .sc { visibility: hidden; overflow: hidden; }
  .black { background: radial-gradient(ellipse 80% 60% at 50% 45%, #141012 0%, #050506 60%, #000 100%); color: #fff; }
  .cream { background: var(--cream); color: var(--ink); }
  .darkred { background: linear-gradient(180deg, #050506 0%, #0B0708 38%, #3A0D16 78%, #5E1622 100%); color: #fff; }
  .grid { position: absolute; left: -120px; top: -120px; width: 1320px; height: 2160px; background-image: linear-gradient(rgba(255,255,255,.08) 1.5px, transparent 1.5px), linear-gradient(90deg, rgba(255,255,255,.08) 1.5px, transparent 1.5px); background-size: 120px 120px; background-position: 60px 0; -webkit-mask: linear-gradient(180deg, transparent 0%, #000 30%); mask: linear-gradient(180deg, transparent 0%, #000 30%); }
  .center { position: absolute; left: 120px; right: 120px; text-align: center; }
  .stack { position: absolute; left: 120px; right: 120px; text-align: center; white-space: nowrap; }
  .p { font: 600 64px/1.05 Inter; letter-spacing: -.025em; }
  .a { font: 900 168px/.95 Inter; letter-spacing: -.05em; color: var(--red); }
  .black .a, .darkred .a { text-shadow: 0 0 30px rgba(227,36,59,.65), 0 0 80px rgba(227,36,59,.35); }
  .w { display: inline-block; overflow: hidden; vertical-align: bottom; padding: .08em .06em .16em; margin: -.08em -.06em -.16em; }
  .wi { display: inline-block; will-change: transform, opacity, filter; }
  .bebas { font-family: "Bebas"; text-transform: uppercase; letter-spacing: .01em; }
  .script { font-family: "Script"; color: var(--red); }
  .tag { position: absolute; right: 120px; top: 250px; display: flex; align-items: center; gap: 12px; font: 800 18px/1 Inter; letter-spacing: .14em; }
  .vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 90% 75% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%); }
  .vigL { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 90% 75% at 50% 50%, transparent 60%, rgba(120,110,95,.2) 100%); }
  #grain { position: absolute; left: -60px; top: -60px; width: 1200px; height: 2040px; opacity: .08; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='9' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .row { display: flex; align-items: center; gap: 18px; }
  .row svg { width: 38px; height: 38px; stroke: #fff; flex: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12.2" data-width="1080" data-height="1920" data-fps="30">

<!-- 1 · black: halftone athlete, a glowing circle for a head with the question inside -->
<section class="sc full black" id="s1"><div class="cam full">
  <img class="abs" id="s1-body" src="assets/photos/flex_halftone.png" alt="" style="left:40px; top:860px; width:1000px" />
  <div class="abs" id="s1-head" style="left:280px; top:750px; width:520px; height:520px; border-radius:50%; background:#F6F3EE; box-shadow: 0 0 60px rgba(255,255,255,.55), 0 0 160px rgba(255,255,255,.25)"></div>
  <div class="stack" id="s1-q" style="top:915px; color:#111"><span class="p" style="font-size:48px"><span class="w"><span class="wi" id="w1a">Same</span></span> <span class="w"><span class="wi" id="w1b">weight</span></span></span><br><span class="a" style="font-size:74px; text-shadow:none"><span class="w"><span class="wi" id="w1c">every</span></span> <span class="w"><span class="wi" id="w1d">week?</span></span></span></div>
  <div class="tag" style="color:#fff"><i style="display:inline-block; width:56px; height:22px; background: repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 7px,transparent 7px 9px)"></i>GAINSDOM</div>
</div><div class="vig"></div></section>

<!-- 2 · cream: glossy dumbbell cut by the edge -->
<section class="sc full cream" id="s2"><div class="cam full">
  <div class="abs" id="s2-shadow" style="left:230px; top:1300px; width:820px; height:80px; border-radius:50%; background: radial-gradient(ellipse at center, rgba(60,50,40,.35), transparent 70%)"></div>
  <img class="abs" id="s2-db" src="assets/objects/dumbbell.png" alt="" style="left:180px; top:720px; width:1080px; filter: drop-shadow(0 40px 50px rgba(60,50,40,.35))" />
  <div class="stack" style="top:430px; text-align:left; left:120px"><span class="p" style="font-size:72px"><span class="w"><span class="wi" id="w2a">Same</span></span></span><br><span class="a" style="font-size:230px"><span class="w"><span class="wi" id="w2b">body.</span></span></span></div>
  <div class="tag" style="color:#111"><i style="display:inline-block; width:56px; height:22px; background: repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 7px,transparent 7px 9px)"></i>GAINSDOM</div>
</div><div class="vigL"></div></section>

<!-- 3 · black: text only, red glow -->
<section class="sc full black" id="s3"><div class="cam full">
  <div class="abs" id="s3-glow" style="left:40px; top:560px; width:1000px; height:1000px; border-radius:50%; background: radial-gradient(circle, rgba(227,36,59,.22), transparent 62%)"></div>
  <div class="stack" style="top:820px"><span class="p"><span class="w"><span class="wi" id="w3a">Your</span></span> <span class="w"><span class="wi" id="w3b">muscles</span></span></span><br><span class="a" style="font-size:124px"><span class="w"><span class="wi" id="w3c">stop</span></span> <span class="w"><span class="wi" id="w3d">growing</span></span></span></div>
</div><div class="vig"></div></section>

<!-- 4 · cream: grey swoosh, pinned log card -->
<section class="sc full cream" id="s4"><div class="cam full">
  <svg class="abs" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0; top:0; overflow:visible"><path id="s4-band" d="M-160 300 C 420 460, 640 960, 320 1480 S 280 2100, 720 2300" stroke="#CFCBC3" stroke-width="170" fill="none" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1.2" stroke-dashoffset="1.1"/></svg>
  <div class="stack" style="top:400px"><span class="p"><span class="w"><span class="wi" id="w4a">No</span></span> <span class="w"><span class="wi" id="w4b">new</span></span></span><br><span class="a" style="font-size:170px"><span class="w"><span class="wi" id="w4c">signal.</span></span></span></div>
  <div class="abs" id="card" style="left:300px; top:900px; width:480px; transform-origin: 50% 0%; background: linear-gradient(180deg,#8F8F94,#76767B); box-shadow: 0 40px 70px rgba(60,50,40,.35), 0 8px 18px rgba(60,50,40,.25); padding: 44px 40px 46px; color:#fff">
    <div style="font:700 64px/1 Inter; letter-spacing:-.02em; padding-bottom:18px; border-bottom:3px solid rgba(255,255,255,.75)">Your log</div>
    <div id="logrows" style="margin-top:26px; display:flex; flex-direction:column; gap:22px; font:600 34px/1 Inter"></div>
  </div>
  <div class="tag" style="color:#111"><i style="display:inline-block; width:56px; height:22px; background: repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 7px,transparent 7px 9px)"></i>GAINSDOM</div>
</div><div class="vigL"></div></section>

<!-- 5 · dark red grid: red circle, B&W athlete, title blur-in (ref B) -->
<section class="sc full darkred" id="s5"><div class="cam full">
  <div class="grid" id="s5-grid"></div>
  <div class="abs" id="s5-circle" style="left:110px; top:930px; width:860px; height:860px; border-radius:50%; background: radial-gradient(circle at 50% 45%, #F23A50 0%, #E3243B 55%, #B8162B 100%); box-shadow: 0 0 120px rgba(227,36,59,.55), 0 0 260px rgba(227,36,59,.3)"></div>
  <img class="abs" id="s5-hero" src="assets/photos/flex_bw.png" alt="" style="left:-20px; top:1000px; width:1120px; filter: drop-shadow(0 -10px 40px rgba(0,0,0,.6)) contrast(1.05)" />
  <div class="abs" style="left:0; right:0; bottom:0; height:380px; background: linear-gradient(180deg, transparent, rgba(40,8,14,.95))"></div>
  <div class="center script" id="s5-script" style="top:300px; font-size:110px; line-height:1.15; transform: rotate(-6deg)">it adapts to…</div>
  <div class="center bebas" id="s5-title" style="top:420px; font-size:220px; line-height:.9; color:#fff">Demand</div>
  <div class="center bebas" id="s5-sub" style="top:635px; font-size:56px; letter-spacing:.14em; color:var(--red); text-shadow: 0 0 24px rgba(227,36,59,.55)">Give it a reason</div>
  <div class="tag" style="color:#fff"><i style="display:inline-block; width:56px; height:22px; background: repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 4px,#fff 4px 7px,transparent 7px 9px)"></i>GAINSDOM</div>
</div><div class="vig"></div></section>

<!-- transition layers -->
<svg class="full" viewBox="0 0 1080 1920" style="pointer-events:none; overflow:visible">
  <path id="wipefill" d="M-160 300 C 420 460, 640 960, 320 1480 S 280 2100, 720 2300" stroke="#F3EFE7" stroke-width="3000" fill="none" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1.2" stroke-dashoffset="1.1"/>
  <path id="wipelead" d="M-160 300 C 420 460, 640 960, 320 1480 S 280 2100, 720 2300" stroke="#CFCBC3" stroke-width="170" fill="none" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1.2" stroke-dashoffset="1.1"/>
</svg>
<div class="abs" id="disc" style="left:518px; top:856px; width:44px; height:44px; border-radius:50%; background:#E3243B">
  <div class="abs" id="pinhl" style="inset:0; border-radius:50%; background: radial-gradient(circle at 35% 30%, #FF6B78, #D01C2F 60%, #8E0F1E); box-shadow: 0 8px 14px rgba(0,0,0,.35)"></div>
</div>
<div class="full" id="flash" style="background:#fff; pointer-events:none"></div>
<div id="grain"></div>
<audio id="sfx" class="clip" src="assets/audio/sfx.wav" data-start="0" data-duration="12.2" data-track-index="1" data-volume="1"></audio>
</div>

<script>
const IC = {};
Promise.all(["calendar-days", "circle-x"].map((n) => fetch(`assets/icons/${n}.svg`).then((r) => r.text()).then((t) => { IC[n] = t.replace(new RegExp("<" + "!--[\\s\\S]*?--" + ">"), ""); })))
  .then(() => document.fonts.ready).then(() => {
  const $ = (s) => document.querySelector(s), $$ = (s) => Array.from(document.querySelectorAll(s)), FR = 1 / 30;
  let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  $("#logrows").innerHTML = [["W1", "20 kg"], ["W6", "20 kg"], ["W12", "20 kg"]].map(([w, v]) => `<div class="row lr">${IC["calendar-days"]}<span style="opacity:.8; width:90px">${w}</span><span>${v}</span></div>`).join("")
    + `<div class="row lr" id="nochange" style="color:#FFD3D8">${IC["circle-x"].replace("<svg", '<svg style="stroke:#FF8C99"')}No change</div>`;
  const tl = gsap.timeline({ paused: true });

  // word entrances (each word slides up out of its own mask; accent words pop bigger with blur)
  const plain = (id, t) => tl.fromTo(id, { yPercent: 105, autoAlpha: 0 }, { yPercent: 0, autoAlpha: 1, duration: 0.55, ease: "expo.out" }, t);
  const accent = (id, t) => tl.fromTo(id, { yPercent: 60, scale: 1.25, autoAlpha: 0, filter: "blur(10px)" }, { yPercent: 0, scale: 1, autoAlpha: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, t);

  gsap.set(".sc", { autoAlpha: 0 }); gsap.set("#s1", { autoAlpha: 1 });
  gsap.set(".wi", { autoAlpha: 0 }); gsap.set([".lr", "#flash", "#disc"], { autoAlpha: 0 }); gsap.set("#pinhl", { opacity: 0 });
  gsap.set("#card", { autoAlpha: 0, rotation: -28, y: -40 });
  tl.fromTo("#grain", { x: 0, y: 0 }, { keyframes: Array.from({ length: 92 }, () => ({ x: -Math.round(rnd() * 60), y: -Math.round(rnd() * 60), duration: 4 * FR, ease: "steps(1)" })) }, 0);

  // ===== 1 · 0 – 2.6 =====
  tl.fromTo("#s1 .cam", { scale: 1.0 }, { scale: 1.05, duration: 2.6, ease: "sine.inOut" }, 0);
  tl.fromTo("#s1-body", { y: 160, autoAlpha: 0, filter: "blur(10px)" }, { y: 0, autoAlpha: 1, filter: "blur(0px)", duration: 1.2, ease: "expo.out" }, 0.05);
  tl.fromTo("#s1-head", { scale: 0 }, { scale: 1, duration: 0.9, ease: "back.out(1.4)" }, 0.15);
  tl.fromTo("#s1-head", { boxShadow: "0 0 60px rgba(255,255,255,.55), 0 0 160px rgba(255,255,255,.25)" }, { keyframes: [{ boxShadow: "0 0 90px rgba(255,255,255,.75), 0 0 220px rgba(255,255,255,.35)", duration: 0.8 }, { boxShadow: "0 0 60px rgba(255,255,255,.55), 0 0 160px rgba(255,255,255,.25)", duration: 0.8 }], ease: "sine.inOut" }, 0.9);
  plain("#w1a", 0.55); plain("#w1b", 0.78); accent("#w1c", 1.1); accent("#w1d", 1.4);
  // OUT: the head circle grows into the cream world of scene 2
  tl.to("#s1-q", { scale: 0.9, autoAlpha: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, 2.2);
  tl.to("#s1-body", { y: 200, autoAlpha: 0, duration: 0.3, ease: "power3.in" }, 2.25);
  tl.to("#s1-head", { scale: 6.2, duration: 0.42, ease: "power3.in" }, 2.2);
  tl.set("#s1", { autoAlpha: 0 }, 2.62); tl.set("#s2", { autoAlpha: 1 }, 2.62);

  // ===== 2 · 2.6 – 4.9 =====
  tl.fromTo("#s2 .cam", { scale: 1.06 }, { scale: 1.0, duration: 2.3, ease: "sine.out" }, 2.62);
  tl.fromTo("#s2-db", { x: 700, rotation: -40, autoAlpha: 1 }, { x: 0, rotation: -14, duration: 1.0, ease: "expo.out" }, 2.65);
  tl.to("#s2-db", { rotation: -6, y: -20, duration: 0.85, ease: "sine.inOut" }, 3.65);
  tl.fromTo("#s2-shadow", { autoAlpha: 0, scaleX: 0.4 }, { autoAlpha: 1, scaleX: 1, duration: 0.9, ease: "expo.out" }, 2.75);
  plain("#w2a", 2.95); accent("#w2b", 3.25);
  tl.fromTo("#w2b", { rotation: 0 }, { keyframes: [{ rotation: -3, duration: 0.12 }, { rotation: 0, duration: 0.4, ease: "elastic.out(1, 0.4)" }], immediateRender: false }, 3.55);
  // OUT: the dumbbell rockets off, the text tilts and drops
  tl.to("#s2-db", { x: 1100, rotation: 25, duration: 0.4, ease: "power3.in" }, 4.5);
  tl.to(["#w2a", "#w2b"], { rotation: 10, y: 140, autoAlpha: 0, duration: 0.38, ease: "power3.in", stagger: 0.04 }, 4.52);
  tl.set("#s2", { autoAlpha: 0 }, 4.92); tl.set("#s3", { autoAlpha: 1 }, 4.92);

  // ===== 3 · 4.9 – 7.0 =====
  tl.fromTo("#s3 .cam", { scale: 1.12 }, { scale: 1.0, duration: 2.1, ease: "expo.out" }, 4.92);
  tl.fromTo("#s3-glow", { scale: 0.6, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 1.2, ease: "expo.out" }, 4.95);
  plain("#w3a", 5.05); plain("#w3b", 5.28); accent("#w3c", 5.62); accent("#w3d", 5.98);
  tl.fromTo("#s3-glow", { scale: 1 }, { keyframes: [{ scale: 1.15, duration: 0.15 }, { scale: 1, duration: 0.6, ease: "sine.inOut" }], immediateRender: false }, 6.0);
  // OUT: a cream band sweeps across the frame (ref A swoosh) and leaves scene 4 behind it
  tl.to(["#w3a", "#w3b", "#w3c", "#w3d"], { autoAlpha: 0, filter: "blur(10px)", scale: 1.08, duration: 0.35, ease: "power2.in", stagger: 0.03 }, 6.35);
  tl.fromTo("#wipelead", { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.75, ease: "power2.inOut" }, 6.35);
  tl.fromTo("#wipefill", { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.73, ease: "power2.inOut" }, 6.47);
  tl.fromTo("#s3 .cam", { x: 0 }, { x: -40, duration: 0.75, ease: "power2.in", immediateRender: false }, 6.35);
  tl.set("#s3", { autoAlpha: 0 }, 7.2); tl.set("#s4", { autoAlpha: 1 }, 7.2);
  tl.set(["#wipelead", "#wipefill"], { autoAlpha: 0 }, 7.2);

  // ===== 4 · 7.0 – 9.4 =====
  tl.fromTo("#s4 .cam", { scale: 1.0 }, { scale: 1.05, duration: 2.4, ease: "sine.inOut" }, 7.02);
  gsap.set("#s4-band", { strokeDashoffset: 0 });
  tl.set("#disc", { autoAlpha: 1, scale: 0, y: 0 }, 7.25); tl.set("#pinhl", { opacity: 1 }, 7.25);
  tl.to("#disc", { scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 7.25);
  tl.fromTo("#card", { autoAlpha: 0, rotation: -28, y: -40 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out" }, 7.3);
  tl.fromTo("#card", { rotation: -28 }, { rotation: -4, duration: 1.4, ease: "elastic.out(1, 0.45)", immediateRender: false }, 7.3);
  plain("#w4a", 7.25); plain("#w4b", 7.45); accent("#w4c", 7.8);
  $$(".lr").forEach((r, i) => tl.fromTo(r, { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "expo.out" }, 8.0 + i * 0.18));
  tl.fromTo("#nochange", { x: 0 }, { keyframes: [-8, 8, -5, 5, 0].map((x) => ({ x, duration: 0.04 })), ease: "none", immediateRender: false }, 8.62);
  // OUT: the pushpin swells into a full red screen …
  tl.to(["#w4a", "#w4b", "#w4c"], { yPercent: -100, autoAlpha: 0, duration: 0.3, ease: "power3.in", stagger: 0.04 }, 8.95);
  tl.to("#card", { rotation: 25, y: 1200, duration: 0.5, ease: "power3.in" }, 8.98);
  tl.to("#disc", { scale: 120, duration: 0.47, ease: "power2.in" }, 8.95);
  tl.to("#pinhl", { opacity: 0, duration: 0.3, ease: "power1.in" }, 8.95);
  tl.set("#s4", { autoAlpha: 0 }, 9.4); tl.set("#s5", { autoAlpha: 1 }, 9.4);

  // ===== 5 · 9.4 – 12.2 … which shrinks into the red circle behind the athlete (ref B) =====
  tl.set("#s5-circle", { autoAlpha: 0 }, 9.4); tl.set("#disc", { y: 1360 - 878 }, 9.42);
  tl.to("#disc", { scale: 860 / 44, duration: 0.75, ease: "expo.inOut" }, 9.42);
  tl.set("#disc", { autoAlpha: 0 }, 10.17); tl.set("#s5-circle", { autoAlpha: 1 }, 10.17);
  tl.fromTo("#s5 .cam", { scale: 1.0 }, { scale: 1.05, duration: 2.8, ease: "sine.inOut" }, 9.4);
  tl.fromTo("#s5-grid", { y: 0 }, { y: -40, duration: 2.8, ease: "sine.inOut" }, 9.4);
  tl.fromTo("#s5-hero", { y: 220, autoAlpha: 0, filter: "blur(14px) contrast(1.05)" }, { y: 0, autoAlpha: 1, filter: "blur(0px) contrast(1.05)", duration: 1.2, ease: "expo.out" }, 10.18);
  tl.fromTo("#s5-script", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.9, ease: "power2.inOut" }, 10.2);
  tl.fromTo("#s5-title", { autoAlpha: 0, filter: "blur(22px)", scale: 1.12 }, { autoAlpha: 1, filter: "blur(0px)", scale: 1, duration: 0.9, ease: "expo.out" }, 10.55);
  tl.fromTo("#s5-sub", { autoAlpha: 0, y: 20, filter: "blur(8px)" }, { autoAlpha: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 11.15);

  tl.set({}, {}, 12.2);
  window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
});
</script>
</body>
</html>
