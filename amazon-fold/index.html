    <script>
      (function () {
        var clock = { t: 0 };
        var host = { clock: clock, render: null };
        window.__fold = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["fold"] = new Promise(function (resolve) {
          host.ready = resolve;
        });

        var tl = gsap.timeline({ paused: true });
        tl.to(clock, {
          t: 20,
          duration: 20,
          ease: "none",
          onUpdate: function () {
            if (host.render) host.render(clock.t);
          },
        }, 0);

        // "Here." — blurs in beside the first light, leaves with the climb
        tl.fromTo("#here-word", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 2.2);
        tl.to("#here-word", { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, 4.25);
        // "There." — far up the map
        tl.fromTo("#there-word", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 5.5);
        tl.to("#there-word", { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power2.in" }, 7.35);

        // brand line: per word, blur to sharp, no translate
        ["#bw0", "#bw1", "#bw2", "#bw3", "#bw4"].forEach(function (id, i) {
          tl.fromTo(id, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 16.9 + i * 0.09);
        });

        // wordmark: letters arrive one by one; the smile is already there (it was the crease)
        tl.fromTo("#logo-smile", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 17.4);
        tl.fromTo("#logo-arrow", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.inOut" }, 17.4);
        ["#logo-l0", "#logo-l1", "#logo-l0b", "#logo-l2", "#logo-l3", "#logo-l4"].forEach(function (id, i) {
          tl.fromTo(id, { opacity: 0.0, filter: "blur(5px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.22, ease: "power2.out" }, 17.55 + i * 0.085);
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
