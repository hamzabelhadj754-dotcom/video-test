<script>
document.fonts.ready.then(() => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const FR = 1 / 30;
  const LINE = "rgba(243,241,236,.22)", INK2 = "rgba(243,241,236,.55)", INK = "#F3F1EC", ACC = "#FF6A3D";
  let seed = 11; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const tl = gsap.timeline({ paused: true });
  try { const v = window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables(); if (v && v.handle) $("#handle").textContent = v.handle; } catch (e) {}

  // ---------------- build: fibre bundle (fig 2) ----------------
  const FX0 = 70, FX1 = 1010, FCY = 1120, FH = 330;
  const TEARS = { 3: .30, 8: .56, 12: .43, 16: .64, 20: .48 };
  const fy = (i, u) => { const v = (i / 23 - .5) * 2; return FCY + v * FH / 2 * Math.pow(Math.sin(Math.PI * (0.06 + u * 0.88)), 0.9) + Math.sin(u * 9 + i * .7) * 3; };
  const fpath = (i, ua, ub) => { let d = ""; for (let k = 0; k <= 60; k++) { const u = ua + (ub - ua) * k / 60; d += (k ? "L" : "M") + (FX0 + (FX1 - FX0) * u).toFixed(1) + " " + fy(i, u).toFixed(1); } return d; };
  { let h = ""; const G = .022;
    for (let i = 0; i < 24; i++) {
      h += `<path class="fbr" id="fb${i}" d="${fpath(i, 0, 1)}" stroke="${LINE}" stroke-width="1.5" fill="none" pathLength="1" stroke-dasharray="1 1.2" stroke-dashoffset="1.1"/>`;
      if (TEARS[i] != null) { const u = TEARS[i];
        h += `<g class="tear" id="tr${i}" opacity="0"><g class="tl"><path d="${fpath(i, 0, u - G)}" stroke="${LINE}" stroke-width="1.5" fill="none"/><path d="${fpath(i, u - G - .05, u - G)}" stroke="${ACC}" stroke-width="2" fill="none"/></g>`;
        h += `<g class="trr"><path d="${fpath(i, u + G, 1)}" stroke="${LINE}" stroke-width="1.5" fill="none"/><path d="${fpath(i, u + G, u + G + .05)}" stroke="${ACC}" stroke-width="2" fill="none"/></g>`;
        const tx = FX0 + (FX1 - FX0) * u, ty = fy(i, u);
        for (let k = 0; k < 14; k++) { const a = rnd() * 6.283, r = 6 + rnd() * 40;
          h += `<circle class="pt" data-x="${(tx + Math.cos(a) * r).toFixed(1)}" data-y="${(ty + Math.sin(a) * r * .6).toFixed(1)}" cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="${(0.8 + rnd() * 1.8).toFixed(1)}" fill="${ACC}" data-o="${(.35 + rnd() * .6).toFixed(2)}" opacity="0"/>`; }
        h += `</g>`; }
    }
    const nx = FX0 + (FX1 - FX0) * .56, ny = fy(8, .56);
    h += `<circle id="cnode" cx="${nx}" cy="${ny}" r="9" fill="none" stroke="${INK2}" stroke-width="1.5" opacity="0"/>`;
    h += `<path id="clead" opacity="0" d="M${nx + 6} ${ny - 7} L${nx + 120} ${ny - 190} L${nx + 300} ${ny - 190}" stroke="${INK2}" stroke-width="1.5" fill="none" stroke-dasharray="6 6"/>`;
    h += `<text id="clabel" x="${nx + 128}" y="${ny - 206}" font-family="Geist Mono" font-size="24" letter-spacing="2" fill="${INK}" opacity="0">MICRO-TEARS</text>`;
    h += `<g id="fcap" opacity="0"><text x="${FX0}" y="${FCY + FH / 2 + 120}" font-family="Geist Mono" font-size="22" letter-spacing="2" fill="${INK2}">FIG. 02 — FIBRE BUNDLE, 24 STRANDS</text>`;
    h += `<line x1="${FX0}" y1="${FCY + FH / 2 + 80}" x2="${FX1}" y2="${FCY + FH / 2 + 80}" stroke="${LINE}" stroke-width="1"/>`;
    for (let k = 0; k <= 10; k++) { const x = FX0 + (FX1 - FX0) * k / 10; h += `<line x1="${x}" y1="${FCY + FH / 2 + 74}" x2="${x}" y2="${FCY + FH / 2 + 86}" stroke="${LINE}" stroke-width="1"/>`; }
    h += `</g>`;
    $("#fib").innerHTML = h; }

  // ---------------- build: 48-hour ring (fig 3) ----------------
  const RR = 220, RC = 2 * Math.PI * RR;
  { let h = `<circle id="rtrack" r="${RR}" fill="none" stroke="${LINE}" stroke-width="1.5"/><g id="rticks" opacity="0">`;
    for (let k = 0; k < 48; k++) { const a = k / 48 * 6.283 - 1.5708, r0 = RR + 16, r1 = RR + (k % 6 ? 24 : 34);
      h += `<line x1="${Math.cos(a) * r0}" y1="${Math.sin(a) * r0}" x2="${Math.cos(a) * r1}" y2="${Math.sin(a) * r1}" stroke="${k % 6 ? LINE : INK2}" stroke-width="1.5"/>`; }
    for (const [k, t] of [[0, "0H"], [12, "12"], [24, "24"], [36, "36"]]) { const b = k / 48 * 6.283 - 1.5708; h += `<text x="${Math.cos(b) * (RR + 62)}" y="${Math.sin(b) * (RR + 62) + 8}" text-anchor="middle" font-family="Geist Mono" font-size="22" fill="${INK2}">${t}</text>`; }
    h += `</g><circle id="rarc" r="${RR}" fill="none" stroke="${ACC}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${RC} ${RC}" stroke-dashoffset="${RC}" transform="rotate(-90)"/>`;
    const a = -1.5708; h += `<circle id="rdot" cx="${Math.cos(a) * RR}" cy="${Math.sin(a) * RR}" r="7" fill="${ACC}" opacity="0"/>`;
    $("#ring").innerHTML = h;
    const ones = $("#ones"); for (let k = 0; k < 50; k++) { const b = document.createElement("b"); b.textContent = k % 10; ones.appendChild(b); } }

  // ---------------- build: three glass columns (fig 4) ----------------
  const CW = 300, CGAP = 30, CTOP = 660, CH = 820;
  const glyph = (k) => {
    const P = (d) => `<path class="gl" d="${d}" stroke="${INK}" stroke-opacity=".7" stroke-width="2" fill="none" pathLength="1" stroke-dasharray="1 1.2" stroke-dashoffset="1.1"/>`;
    if (k === 0) { let d = "M20 150"; for (let i = 0; i < 6; i++) d += ` H${20 + (i + 1) * 40} V${150 - (i + 1) * 21}`; return P(d); }
    if (k === 1) { let h = ""; const hex = (cx, cy) => { let d = ""; for (let i = 0; i < 6; i++) { const a = i * 1.0472 + .5236; d += (i ? "L" : "M") + (cx + Math.cos(a) * 24).toFixed(1) + " " + (cy + Math.sin(a) * 24).toFixed(1); } return P(d + "Z"); };
      const Q = [[50, 110], [92, 86], [134, 110], [176, 86], [218, 110]]; Q.forEach(([x, y], i) => { h += hex(x, y); if (i) h += P(`M${Q[i - 1][0] + 18} ${Q[i - 1][1] + (i % 2 ? -10 : 10)} L${x - 18} ${y + (i % 2 ? 10 : -10)}`); }); return h; }
    let d = "M14 150"; for (let x = 18; x <= 256; x += 4) d += ` L${x} ${(150 + Math.sin(x / 14) * 8 * (1 - x / 300)).toFixed(1)}`;
    return P("M150 40 a42 42 0 1 0 46 58 a34 34 0 1 1 -46 -58Z") + P(d);

  tl.fromTo("#s6-uline", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, 18.85);
  tl.fromTo("#handle", { autoAlpha: 0, filter: "blur(10px)", y: 10 }, { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: 0.6, ease: "power3.out" }, 19.0);
  tl.fromTo("#endfade", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power2.in" }, 19.56);

  // ---------------- particles: chart lines -> drift up -> assemble the arch ----------------
  { const cv = $("#parts"), g = cv.getContext("2d"), N = 1900, P = [];
    const sc5 = 1.03, c5 = (x, y) => [540 + (x - 540) * sc5, 960 + (y - 960) * sc5];
    for (let i = 0; i < N; i++) {
      const fromE = rnd() < 0.55, u = rnd(), f = fromE ? ember : grey;
      const [sx, sy] = c5(CL + (CR - CL) * u + (rnd() - .5) * 6, CB - (CB - CT) * f(u) + (rnd() - .5) * 6);
      let tx, ty; const r = rnd();
      if (r < 0.72) { const per = Math.PI * 308 + 816 * 2, p = rnd() * per, s = Math.pow(rnd(), 2) * 26 * (rnd() < .5 ? -1 : 1);
        if (p < 816) { tx = 232 + s; ty = 1488 - p; } else if (p < 816 + Math.PI * 308) { const a = Math.PI + (p - 816) / 308; tx = 540 + Math.cos(a) * (308 + s); ty = 980 + Math.sin(a) * (308 + s); } else { tx = 848 + s; ty = 980 + (p - 816 - Math.PI * 308); }
      } else { tx = 80 + rnd() * 920; ty = 620 + rnd() * 980; }
      P.push({ sx, sy, up: 60 + rnd() * 220, dx: (rnd() - .5) * 60, tx, ty, r: .6 + rnd() * 1.3, a: .15 + rnd() * .5, e: fromE, d: rnd() * .25, ph: rnd() * 6.283, ac: rnd() < .08 });
    }
    const ease3 = (p) => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, eo = (p) => 1 - Math.pow(1 - p, 3);
    const draw = (t) => {
      g.clearRect(0, 0, 1080, 1920); if (t < 17.05) return;
      const s = s6s(t), fade = t > 19.56 ? Math.max(0, 1 - (t - 19.56) / 0.4) : 1;
      for (const q of P) {
        const a = Math.min(1, Math.max(0, (t - 17.05) / 0.5)), b = ease3(Math.min(1, Math.max(0, (t - 17.3 - q.d) / 0.75)));
        const mx = q.sx + q.dx * eo(a), my = q.sy - q.up * eo(a);
        const wob = Math.sin(t * 1.4 + q.ph) * 2.2;
        const tx = 540 + (q.tx + wob - 540) * s, ty = 960 + (q.ty + Math.cos(t * 1.1 + q.ph) * 2.2 - 960) * s;
        const x = mx + (tx - mx) * b, y = my + (ty - my) * b;
        const al = Math.min(1, a * 4) * (q.a + (1 - b) * .35) * fade;
        const em = (q.e && b < 1) ? (1 - b) : (q.ac ? 1 : 0);
        g.fillStyle = em > .5 ? `rgba(255,106,61,${al.toFixed(3)})` : `rgba(243,241,236,${al.toFixed(3)})`;
        g.beginPath(); g.arc(x, y, q.r, 0, 6.283); g.fill();
      }
    };
    const pr = { v: 0 };
    tl.fromTo(pr, { v: 0 }, { v: 1, duration: 3.0, ease: "none", onUpdate: () => draw(17.0 + pr.v * 3.0) }, 17.0);
  }

  tl.set({}, {}, 20);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
});
