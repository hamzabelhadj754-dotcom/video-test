<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--color-cobalt, #1e3cff);
      color: var(--color-bone, #f1ece2);
    }
    #space-world {
      position: absolute;
      inset: 0;
      transform-origin: 700px 600px;
    }
    #space-orbits {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    .space-orbit {
      fill: none;
      stroke: var(--color-bone, #f1ece2);
      stroke-opacity: 0.45;
      stroke-width: 3;
    }
    .space-planet {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
    }
    #space-sun {
      position: absolute;
      left: 540px;
      top: 440px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: var(--color-yellow, #ffc400);
      z-index: 5;
    }
    #space-copy {
      position: absolute;
      right: 120px;
      top: 96px;
      text-align: right;
      z-index: 20;
    }
    #space-title {
      font-family: "Archivo Black", sans-serif;
      font-size: 150px;
      line-height: 0.95;
      letter-spacing: -0.02em;
    }
    #space-counter {
      margin-top: 18px;
      font-family: "League Gothic", sans-serif;
      font-size: 96px;
      line-height: 1;
      color: var(--color-yellow, #ffc400);
      font-variant-numeric: tabular-nums;
    }
    #space-note {
      position: absolute;
      left: 120px;
      bottom: 80px;
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      font-size: 34px;
      letter-spacing: 0.01em;
      z-index: 20;
    }
    .space-label {
      position: absolute;
      left: 0;
      top: 0;
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      font-size: 28px;
      white-space: nowrap;
      z-index: 15;
    }
  </style>
  <div id="root" data-composition-id="space" data-width="1920" data-height="1080">
    <div id="space-world" data-layout-allow-overflow data-layout-allow-overlap>
      <svg id="space-orbits" viewBox="0 0 1920 1080">
        <ellipse class="space-orbit" id="space-orbit-0" cx="700" cy="600" rx="250" ry="92" pathLength="100" />
        <ellipse class="space-orbit" id="space-orbit-1" cx="700" cy="600" rx="370" ry="137" pathLength="100" />
        <ellipse class="space-orbit" id="space-orbit-2" cx="700" cy="600" rx="500" ry="185" pathLength="100" />
        <ellipse class="space-orbit" id="space-orbit-3" cx="700" cy="600" rx="640" ry="237" pathLength="100" />
        <ellipse class="space-orbit" id="space-orbit-4" cx="700" cy="600" rx="900" ry="333" pathLength="100" />
      </svg>
      <div id="space-sun"></div>
      <div class="space-planet" id="space-p0" style="width: 26px; height: 26px; background: #f1ece2"></div>
      <div class="space-planet" id="space-p1" style="width: 44px; height: 44px; background: #ffc400"></div>
      <div class="space-planet" id="space-p2" style="width: 50px; height: 50px; background: #111111; box-shadow: inset -12px 0 0 #3a6bff"></div>
      <div class="space-planet" id="space-p3" style="width: 34px; height: 34px; background: #ff3b1f"></div>
      <div class="space-planet" id="space-p4" style="width: 110px; height: 110px; background: repeating-linear-gradient(0deg, #f1ece2 0 14px, #ff3b1f 14px 22px, #ffc400 22px 34px)"></div>
      <div class="space-label" id="space-earth-label">EARTH</div>
    </div>
    <div id="space-copy">
      <div id="space-title">SPACE</div>
      <div id="space-counter">DAY <span id="space-day">0</span></div>
    </div>
    <div id="space-note">Real orbital periods &nbsp;·&nbsp; 1 second = 60 days</div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Real orbital periods in days.
      const planets = [
        { el: "#space-p0", rx: 250, ry: 92, period: 87.97, phase: 0.6, size: 26 },
        { el: "#space-p1", rx: 370, ry: 137, period: 224.7, phase: 2.3, size: 44 },
        { el: "#space-p2", rx: 500, ry: 185, period: 365.25, phase: 1.1, size: 50 },
        { el: "#space-p3", rx: 640, ry: 237, period: 686.98, phase: 3.9, size: 34 },
        { el: "#space-p4", rx: 900, ry: 333, period: 4332.6, phase: 0.35, size: 110 },
      ].map((p) => ({ ...p, node: document.querySelector(p.el) }));
      const label = document.querySelector("#space-earth-label");
      const dayEl = document.querySelector("#space-day");
      const CX = 700;
      const CY = 600;

      function place(days) {
        planets.forEach((p, i) => {
          const a = p.phase + (2 * Math.PI * days) / p.period;
          const x = CX + Math.cos(a) * p.rx;
          const y = CY + Math.sin(a) * p.ry;
          const depth = 0.82 + 0.18 * (Math.sin(a) + 1) * 0.5 + 0.1; // nearer = bigger
          gsap.set(p.node, {
            x: x - p.size / 2,
            y: y - p.size / 2,
            scale: depth,
            zIndex: Math.sin(a) > 0 ? 10 : 2,
          });
          if (i === 2) {
            gsap.set(label, { x: x + 38, y: y - 54 });
          }
        });
        dayEl.textContent = String(Math.round(days));
      }

      const clock = { days: 0 };
      place(0);

      // The sun lands first.
      tl.fromTo(
        "#space-sun",
        { scale: 0 },
        { scale: 1, duration: 0.8, ease: "back.out(1.4)" },
        0.05,
      );
      // Orbits draw on, inner to outer.
      for (let i = 0; i < 5; i++) {
        tl.fromTo(
          "#space-orbit-" + i,
          { strokeDasharray: "100 120", strokeDashoffset: 110 },
          { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" },
          0.25 + i * 0.08,
        );
      }
      tl.fromTo(
        ".space-planet",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.06 },
        0.55,
      );
      tl.fromTo(
        "#space-earth-label",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" },
        1.3,
      );

      // Time itself: constant speed is the point, so linear.
      tl.fromTo(
        clock,
        { days: 0 },
        {
          days: 330,
          duration: 5.5,
          ease: "none",
          onUpdate: () => place(clock.days),
        },
        0,
      );

      // Copy: title per letter, counter blurs in.
      tl.fromTo(
        "#space-title",
        { opacity: 0, filter: "blur(10px)", x: 60 },
        { opacity: 1, filter: "blur(0px)", x: 0, duration: 0.5, ease: "expo.out" },
        0.35,
      );
      tl.fromTo(
        "#space-counter",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" },
        0.75,
      );
      tl.fromTo(
        "#space-note",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.out" },
        1.0,
      );

      // Exit: copy leaves, camera dives into the sun until yellow fills the frame.
      tl.to(["#space-copy", "#space-note"], { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, 5.05);
      tl.to([".space-planet", "#space-orbits", "#space-earth-label"], { opacity: 0, duration: 0.3, ease: "power2.in" }, 5.25);
      tl.to("#space-world", { scale: 9.5, duration: 0.75, ease: "power3.in" }, 5.2);

      window.__timelines["space"] = tl;
    })();
  </script>
</template>
