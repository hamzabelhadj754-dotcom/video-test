  </style>
  <div id="root" data-composition-id="music" data-width="1920" data-height="1080">
    <div id="music-copy">
      <div id="music-title">MUSIC</div>
      <div id="music-rpm">33⅓ RPM</div>
    </div>
    <div id="music-eq"></div>
    <div id="music-record" data-layout-allow-overflow>
      <div id="music-disc">
        <div id="music-label">
          <div id="music-label-top">SIDE A</div>
          <div id="music-hole"></div>
          <div id="music-label-bottom">HyperFrames</div>
        </div>
      </div>
      <div id="music-sheen"></div>
    </div>
    <div id="music-arm" data-layout-allow-overflow>
      <div id="music-arm-rod-wrap">
        <div id="music-arm-rod"></div>
        <div id="music-arm-head"></div>
      </div>

    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Build the equaliser bars once (static markup count, deterministic).
      const eq = document.querySelector("#music-eq");
      const N = 20;
      const bars = [];
      for (let i = 0; i < N; i++) {
        const b = document.createElement("div");
        b.className = "music-bar" + (i % 5 === 2 ? " music-hot" : "");
        b.id = "music-bar-" + i;
        b.style.left = i * 32 + "px";
        eq.appendChild(b);
        bars.push(b);
      }

      // Split MUSIC into letters: outer span enters, inner span bounces on the beat.
      const titleEl = document.querySelector("#music-title");
      const tw = titleEl.textContent;
      titleEl.textContent = "";
      const bounceEls = [];
      tw.split("").forEach((ch) => {
        const o = document.createElement("span");
        o.className = "music-l";
        const i = document.createElement("span");
        i.className = "music-li";
        i.textContent = ch;
        o.appendChild(i);
        titleEl.appendChild(o);
        bounceEls.push(i);
      });

      // Seeded phases (mulberry32) so every render is identical.
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rnd = mulberry32(33);
      const phases = bars.map(() => [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28]);

      const BPM = 120;
      function levels(t, gain) {
        const beat = (t * BPM) / 60;
        const kick = Math.pow(1 - (beat % 1), 3); // decays every beat
        bars.forEach((b, i) => {
          const p = phases[i];
          const low = 1 - i / N; // bass bars hit harder on the kick
          let v =
            0.18 +
            0.32 * Math.abs(Math.sin(t * 7.1 + p[0])) +
            0.2 * Math.abs(Math.sin(t * 13.3 + p[1])) +
            0.1 * Math.abs(Math.sin(t * 3.7 + p[2])) +
            0.35 * kick * low;
          v = Math.min(1, v) * gain;
          gsap.set(b, { scaleY: Math.max(0.03, v) });
        });
        // The title dances: each letter hops on the kick, offset like a wave.
        bounceEls.forEach((el, i) => {
          const lb = beat - i * 0.12;
          const k = lb > 0 ? Math.pow(1 - (((lb % 1) + 1) % 1), 4) : 0;
          gsap.set(el, { y: -26 * k * gain, scaleY: 1 + 0.08 * k * gain, transformOrigin: "50% 100%" });
        });
      }
      levels(0, 0);

      // Record arrives from the right, blurred, and sharpens.
      tl.fromTo(
        "#music-record",
        { x: 900, filter: "blur(20px)" },
        { x: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" },
        0.0,
      );
      // It turns at a real 33 1/3 rpm = 200 deg/s. Linear: constant speed is the point.
      tl.fromTo("#music-disc", { rotation: 0 }, { rotation: 1200, duration: 6, ease: "none" }, 0);

      // Tonearm swings onto the record.
      tl.fromTo(
        "#music-arm-rod-wrap",
        { rotation: -8 },
        { rotation: 22, duration: 0.6, ease: "power2.inOut", transformOrigin: "0px 0px" },
        0.85,
      );

      // Copy.
      tl.fromTo(
        "#music-title .music-l",
        { opacity: 0, y: -140, rotation: -25, scale: 1.4, filter: "blur(10px)" },
        { opacity: 1, y: 0, rotation: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "back.out(2)", stagger: 0.06 },
        0.25,
      );
      tl.fromTo(
        "#music-rpm",
        { opacity: 0, clipPath: "inset(0 100% 0 0)" },
        { opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "expo.out" },
        0.7,
      );
      // Needle drop: the record dips under the stylus.
      tl.fromTo(
        "#music-record",
        { scale: 1 },
        { keyframes: { scale: [1, 0.97, 1.015, 1] }, duration: 0.35, ease: "none", immediateRender: false },
        1.45,
      );
      // Exit: the camera pushes into the label before the iris opens from it.
      tl.to("#music-copy", { x: -120, opacity: 0, filter: "blur(12px)", duration: 0.3, ease: "power3.in" }, 5.3);
      tl.to("#music-eq", { scaleY: 0, transformOrigin: "50% 100%", duration: 0.3, ease: "power3.in" }, 5.3);
      tl.to("#music-arm", { x: 260, y: -200, rotation: 20, opacity: 0, duration: 0.35, ease: "power3.in" }, 5.25);
      tl.to("#music-record", { scale: 1.9, rotation: 20, duration: 0.75, ease: "power3.in", immediateRender: false }, 5.25);

      // Equaliser comes alive when the needle lands.
      const clock = { t: 0, g: 0 };
      tl.fromTo(
        clock,
        { t: 0, g: 0 },
        {
          t: 4.55,
          duration: 4.55,
          ease: "none",
          onUpdate: () => levels(clock.t, Math.min(1, clock.t / 0.25)),
        },
        1.45,
      );

      window.__timelines["music"] = tl;
    })();
  </script>
