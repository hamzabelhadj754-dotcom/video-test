  <style>

  </style>
  <div id="root" data-composition-id="endcard" data-width="1920" data-height="1080">
    <div id="end-stage">
      <div class="end-ring" id="end-ring-1"></div>
      <div class="end-ring" id="end-ring-2"></div>
      <div id="end-core"></div>
      <div id="end-tagline" data-layout-allow-overlap data-layout-allow-overflow>
        <div class="end-plate end-p-yellow" data-text="Anything.|In|motion." aria-hidden="true" data-layout-ignore></div>
        <div class="end-plate end-p-cobalt" data-text="Anything.|In|motion." aria-hidden="true" data-layout-ignore></div>
        <div class="end-plate end-p-ink" data-text="Anything.|In|motion."></div>
      </div>
      <div id="end-lockup">
        <img src="assets/logo/hyperframes-wordmark.svg" alt="HyperFrames" />
      </div>
      <div id="end-cta"><span id="end-cta-prompt">$</span> <span id="end-cta-text">npx hyperframes init</span><span id="end-cursor"></span></div>
      <div id="end-credit" data-layout-ignore>
        Built in HTML with HyperFrames · Sound: Vilkas_Sound, MeijstroAudio, elmasmalo1 (CC BY) · qubodup, ludvique (CC0) via Freesound
      </div>
    </div>
  </div>
  <script>
    (function () {
      // Build the three print plates of the tagline: masked letters, word by word.
      document.querySelectorAll("#end-tagline .end-plate").forEach((plate) => {
        plate.dataset.text.split("|").forEach((w, wi) => {
          const word = document.createElement("span");
          word.className = "end-word" + (wi === 0 ? " end-accent" : "");
          w.split("").forEach((ch) => {
            const m = document.createElement("span");
            m.className = "end-mask";
            const c = document.createElement("span");
            c.className = "end-ch";
            c.textContent = ch;
            m.appendChild(c);
            word.appendChild(m);
          });
          plate.appendChild(word);
          if (wi < 2) plate.appendChild(document.createTextNode(" "));
        });
      });
      // The command, one character per span so it can be typed.
      const cmd = document.querySelector("#end-cta-text");
      const ct = cmd.textContent;
      cmd.textContent = "";
      ct.split("").forEach((ch) => {
        const c = document.createElement("span");
        c.className = "end-cta-ch";
        c.textContent = ch;
        cmd.appendChild(c);
      });

      const tl = gsap.timeline({ paused: true });

      // The red square implodes with a twist...
      tl.fromTo(
        "#end-core",
        { scale: 1, rotation: 0 },
        { scale: 0, rotation: 135, duration: 0.35, ease: "power3.in" },
        0.05,
      );

      // ...and the mark springs out of the same point, kicking two rings outward.
      tl.fromTo(
        "#end-lockup",
        { x: 420, scale: 0, clipPath: "inset(0% 83.5% 0% 0%)", transformOrigin: "80px 75px" },
        { scale: 1, duration: 0.55, ease: "back.out(1.8)" },
        0.38,
      );
      tl.fromTo(
        "#end-ring-1",
        { scale: 0.2, opacity: 1 },
        { scale: 4.5, opacity: 0, duration: 0.8, ease: "expo.out", immediateRender: false },
        0.4,
      );
      tl.fromTo(
        "#end-ring-2",
        { scale: 0.2, opacity: 1 },
        { scale: 3.2, opacity: 0, duration: 0.8, ease: "expo.out", immediateRender: false },
        0.48,
      );
      // Impact shake.
      tl.to(
        "#end-stage",
        { keyframes: { x: [0, -14, 11, -7, 4, 0], y: [0, 9, -7, 4, -2, 0] }, duration: 0.32, ease: "none" },
        0.42,
      );
      // The wordmark wipes in beside the mark while the lockup slides to centre.
      tl.to("#end-lockup", { x: 0, duration: 0.7, ease: "expo.out" }, 0.95);
      tl.to("#end-lockup", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "expo.out" }, 0.95);

      // Tagline printed plate by plate, the colour plates leading the ink.
      [
        [".end-p-yellow", 0],
        [".end-p-cobalt", 0.05],
        [".end-p-ink", 0.1],
      ].forEach(([sel, d]) => {
        tl.fromTo(
          "#end-tagline " + sel + " .end-ch",
          { yPercent: 190, scaleY: 1.8, skewX: -16 },
          { yPercent: 0, scaleY: 1, skewX: 0, duration: 0.7, ease: "expo.out", stagger: 0.028 },
          1.2 + d,
        );
      });

      // The call to action: the block opens, the command types itself, the cursor blinks.
      tl.fromTo(
        "#end-cta",
        { clipPath: "inset(0 50% 0 50%)" },
        { clipPath: "inset(0 0% 0 0%)", duration: 0.45, ease: "expo.out" },
        1.75,
      );
      document.querySelectorAll("#end-cta .end-cta-ch").forEach((c, i) => {
        tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 2.0 + i * 0.035);
      });
      tl.fromTo(
        "#end-cursor",
        { opacity: 1 },
        { opacity: 0, duration: 0.01, ease: "none", repeat: 5, repeatDelay: 0.25, yoyo: true },
        2.75,
      );
      tl.fromTo(
        "#end-credit",
        { opacity: 0 },
        { opacity: 0.7, duration: 0.4, ease: "power2.out" },
        2.2,
      );

      window.__timelines["endcard"] = tl;
    })();
  </script>
