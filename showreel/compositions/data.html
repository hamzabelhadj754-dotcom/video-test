  <div id="root" data-composition-id="data" data-width="1920" data-height="1080">
    <div id="data-stage">
      <div id="data-left">
        <div id="data-kicker">DATA</div>
        <div id="data-number"><span id="data-count">0.0</span></div>
        <div id="data-unit">BILLION</div>
        <div id="data-caption">people on Earth in 2025 —<br />more than triple 1950.</div>
      </div>
      <div id="data-chart">
        <div class="data-col" id="data-c0" style="left: 0px">
          <div class="data-bar" id="data-b0" style="height: 182px"></div>
          <div class="data-val" id="data-v0" style="bottom: 200px">2.5</div>
        </div>
        <div class="data-col" id="data-c1" style="left: 224px">
          <div class="data-bar" id="data-b1" style="height: 298px"></div>
          <div class="data-val" id="data-v1" style="bottom: 316px">4.1</div>
        </div>
        <div class="data-col" id="data-c2" style="left: 448px">
          <div class="data-bar" id="data-b2" style="height: 445px"></div>
          <div class="data-val" id="data-v2" style="bottom: 463px">6.1</div>
        </div>
        <div class="data-col" id="data-c3" style="left: 672px">
          <div class="data-bar data-accent" id="data-b3" style="height: 598px"></div>
          <div class="data-val" id="data-v3" style="bottom: 616px">8.2</div>
        </div>
        <div id="data-baseline"></div>
        <div class="data-year" style="left: 0px">1950</div>
        <div class="data-year" style="left: 224px">1975</div>
        <div class="data-year" style="left: 448px">2000</div>
        <div class="data-year" style="left: 672px">2025</div>
      </div>
      <div id="data-stamp">×3.3 IN 75 YEARS</div>
      <div id="data-source">Source: UN World Population Prospects 2024</div>
    </div>
    <div id="data-slab"></div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const countEl = document.querySelector("#data-count");
      const counter = { v: 0 };

      // Hold the yellow flood for a beat, then the kicker.
      tl.fromTo(
        "#data-kicker",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" },
        0.25,
      );
      tl.fromTo(
        "#data-baseline",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "expo.out" },
        0.3,
      );

      // Count-up runs 1.4 s, then holds.
      tl.fromTo(
        counter,
        { v: 0 },
        {
          v: 8.2,
          duration: 1.4,
          ease: "power3.out",
          onUpdate: () => {
            countEl.textContent = counter.v.toFixed(1);
          },
        },
        0.4,
      );
      tl.fromTo(
        "#data-unit",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" },
        0.55,
      );

      // Bars rise one after another, values pop on top.
      for (let i = 0; i < 4; i++) {
        tl.fromTo(
          "#data-b" + i,
          { scaleY: 0 },
          { scaleY: 1, duration: 0.7, ease: "expo.out" },
          0.55 + i * 0.15,
        );
        tl.fromTo(
          "#data-v" + i,
          { opacity: 0, y: 30, scale: 0.6 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)" },
          0.95 + i * 0.15,
        );
      }
      tl.fromTo(
        ".data-year",
        { opacity: 0 },
        { opacity: 1, duration: 0.25, ease: "power2.out", stagger: 0.06 },
        0.6,
      );
      tl.fromTo(
        "#data-caption",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" },
        1.9,
      );
      tl.fromTo(
        "#data-source",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.out" },
        2.1,
      );

      // New information while the chart holds: a stamp prints the takeaway.
      tl.fromTo(
        "#data-stamp",
        { scale: 1.6, rotation: -14, opacity: 0 },
        { scale: 1, rotation: -6, opacity: 1, duration: 0.4, ease: "back.out(2)" },
        3.0,
      );

      // Whip: content smears left as an ink slab sweeps in from the right.
      tl.to("#data-stage", { x: -700, filter: "blur(18px)", duration: 0.35, ease: "power3.in" }, 5.6);
      tl.fromTo(
        "#data-slab",
        { xPercent: 100 },
        { xPercent: 0, duration: 0.35, ease: "power3.in" },
        5.6,
      );

      window.__timelines["data"] = tl;
    })();
  </script>
