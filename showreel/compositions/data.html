        <div id="data-caption"><span class="data-w">people</span> <span class="data-w">on</span> <span class="data-w">Earth</span> <span class="data-w">in</span> <span class="data-w">2025</span> <span class="data-w">—</span><br /><span class="data-w">more</span> <span class="data-w">than</span> <span class="data-w">triple</span> <span class="data-w">1950.</span></div>
      </div>
      <div id="data-chart">
        <div class="data-col" id="data-c0" style="left: 0px">
          <div class="data-bar" id="data-b0" style="height: 182px"></div>
          <div class="data-val" id="data-v0" style="bottom: 200px">2.5</div>

        <div class="data-col" id="data-c1" style="left: 224px">

  </div>
  <script>
    (function () {
      // Split the kicker and the unit into letters.
      ["#data-kicker", "#data-unit"].forEach((sel) => {
        const el = document.querySelector(sel);
        const t = el.textContent;
        el.textContent = "";
        t.split("").forEach((ch) => {
          const c = document.createElement("span");
          c.className = "data-ch";
          c.textContent = ch;
          el.appendChild(c);
        });
      });

      const tl = gsap.timeline({ paused: true });
      const countEl = document.querySelector("#data-count");
      const counter = { v: 0 };

      // Camera continues the sun's spin and settles.
      tl.fromTo(
        "#data-cam",
        { scale: 1.3, rotation: 8 },
        { scale: 1, rotation: 0, duration: 1.1, ease: "expo.out" },
        0,
      );

      // Kicker and unit rise letter by letter out of their line.
      tl.fromTo(
        "#data-kicker .data-ch",
        { yPercent: 110, skewX: -14 },
        { yPercent: 0, skewX: 0, duration: 0.6, ease: "expo.out", stagger: 0.04 },
        0.2,
      );
      tl.fromTo(
        "#data-baseline",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.7, ease: "expo.out" },
        0.3,
      );

      // Count-up runs 1.4 s, then the number punches as it lands.
      tl.fromTo(
        counter,
        { v: 0 },
        {
          v: 8.2,
          duration: 1.4,
          ease: "power3.out",
          onUpdate: () => {
            countEl.textContent = counter.v.toFixed(1);
          },
        },
        0.4,
      );
      tl.fromTo(
        "#data-number",
        { opacity: 0, scaleY: 0.2, filter: "blur(10px)" },
        { opacity: 1, scaleY: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
        0.4,
      );
      tl.fromTo(
        "#data-number",
        { scaleY: 1.18, scaleX: 0.94 },
        { scaleY: 1, scaleX: 1, duration: 0.6, ease: "elastic.out(1, 0.5)", immediateRender: false },
        1.8,
      );
      tl.fromTo(
        "#data-unit .data-ch",
        { yPercent: 110 },
        { yPercent: 0, duration: 0.55, ease: "expo.out", stagger: 0.035 },
        0.6,
      );

      // Bars rise one after another with a slight overshoot; values pop on top.
      for (let i = 0; i < 4; i++) {
        tl.fromTo(
          "#data-b" + i,
          { scaleY: 0 },
          { scaleY: 1, duration: 0.75, ease: "back.out(1.3)" },
          0.55 + i * 0.15,
        );
        tl.fromTo(
          "#data-v" + i,
          { opacity: 0, y: 40, scale: 0.4 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2.2)" },
          0.95 + i * 0.15,
        );
      }
      tl.fromTo(
        ".data-year",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.3, ease: "expo.out", stagger: 0.06 },
        0.6,
      );
      tl.fromTo(
        "#data-caption .data-w",
        { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out", stagger: 0.067 },
        1.9,
      );
      tl.fromTo(
        "#data-source",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power2.out" },
        2.4,
      );

      // The stamp slams down and shakes the frame.
      tl.fromTo(
        "#data-stamp",
        { scale: 3.2, rotation: -22, opacity: 0 },
        { scale: 1, rotation: -6, opacity: 1, duration: 0.28, ease: "power4.in" },
        2.85,
      );
      tl.to(
        "#data-cam",
        { keyframes: { x: [0, -16, 13, -8, 5, 0], y: [0, 10, -8, 5, -2, 0] }, duration: 0.3, ease: "none" },
        3.13,
      );

      // Whip: content smears left as three stripes of ink sweep in from the right.
      tl.to("#data-stage", { x: -800, filter: "blur(22px)", duration: 0.42, ease: "power3.in" }, 5.5);
      [["#data-slab-r", 5.42], ["#data-slab-c", 5.5], ["#data-slab", 5.58]].forEach(([sel, at]) => {
        tl.fromTo(
          sel,
          { xPercent: 118, skewX: -12 },
          { xPercent: 0, skewX: 0, duration: 0.4, ease: "power3.in" },
          at,
        );
      });

      window.__timelines["data"] = tl;
    })();
  </script>
