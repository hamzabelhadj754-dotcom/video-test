<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"color-red","type":"color","label":"Red ink","default":"#FF3B1F"},
    {"id":"color-cobalt","type":"color","label":"Cobalt ink","default":"#1E3CFF"},
    {"id":"color-yellow","type":"color","label":"Yellow ink","default":"#FFC400"},
    {"id":"color-ink","type":"color","label":"Ink","default":"#111111"},
    {"id":"color-bone","type":"color","label":"Bone","default":"#F1ECE2"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-red: #ff3b1f;
        --color-cobalt: #1e3cff;
        --color-yellow: #ffc400;
        --color-ink: #111111;
        --color-bone: #f1ece2;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-red);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31"
      data-width="1920"
      data-height="1080"
    >
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 1"></div>
      <div id="space" data-composition-id="space" data-composition-src="compositions/space.html"
        data-start="5" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="data" data-composition-id="data" data-composition-src="compositions/data.html"
        data-start="11" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="music" data-composition-id="music" data-composition-src="compositions/music.html"
        data-start="17" data-duration="6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 4"></div>
      <div id="pattern" data-composition-id="pattern" data-composition-src="compositions/pattern.html"
        data-start="22.6" data-duration="4.4" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 5"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="27" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080" style="z-index: 6"></div>

      <!-- Sound effects: each peak lands one frame after the picture it belongs to. -->
      <audio id="sfx-motion" class="clip" src="assets/sfx/swoosh-short.mp3" data-start="0.12" data-duration="0.37" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-dive-1" class="clip" src="assets/sfx/whoosh-long.mp3" data-start="4.1" data-duration="1.25" data-track-index="10" data-volume="0.9"></audio>
      <audio id="sfx-dive-2" class="clip" src="assets/sfx/whoosh-long.mp3" data-start="10.05" data-duration="1.25" data-track-index="11" data-volume="0.75"></audio>
      <audio id="sfx-pop-1" class="clip" src="assets/sfx/pop.mp3" data-start="12.02" data-duration="0.1" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-pop-2" class="clip" src="assets/sfx/pop.mp3" data-start="12.17" data-duration="0.1" data-track-index="11" data-volume="0.5"></audio>
      <audio id="sfx-pop-3" class="clip" src="assets/sfx/pop.mp3" data-start="12.32" data-duration="0.1" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-pop-4" class="clip" src="assets/sfx/pop.mp3" data-start="12.47" data-duration="0.1" data-track-index="11" data-volume="0.65"></audio>
      <audio id="sfx-whip" class="clip" src="assets/sfx/swoosh-short.mp3" data-start="16.68" data-duration="0.37" data-track-index="10" data-volume="0.7"></audio>
      <audio id="sfx-needle" class="clip" src="assets/sfx/record-scratch.mp3" data-start="18.42" data-duration="0.45" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-iris" class="clip" src="assets/sfx/whoosh-long.mp3" data-start="22.25" data-duration="1.25" data-track-index="11" data-volume="0.6"></audio>
      <audio id="sfx-stamp" class="clip" src="assets/sfx/pop.mp3" data-start="14.04" data-duration="0.1" data-track-index="11" data-volume="0.8"></audio>
      <audio id="sfx-collapse" class="clip" src="assets/sfx/swoosh-short.mp3" data-start="26.3" data-duration="0.37" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-mark" class="clip" src="assets/sfx/impact.mp3" data-start="27.4" data-duration="2.04" data-track-index="11" data-volume="0.9"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
