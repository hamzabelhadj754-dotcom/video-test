<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gainsdom — cinematic style frames</title>
<script src="../assets/vendor/three.min.js"></script>
<style>
  @font-face { font-family: "Bebas"; src: url("../assets/fonts/BebasNeue-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Anton"; src: url("../assets/fonts/Anton-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-Variable.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; }
  .frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #030304; margin-bottom: 40px; font-family: Inter, sans-serif; color: #fff; }
  .abs { position: absolute; }
  .layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  canvas.gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .bloom { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; filter: blur(30px) brightness(1.2) saturate(1.2); mix-blend-mode: screen; opacity: .5; }
  .refl { position: absolute; left: 0; width: 1080px; height: 1920px; transform: scaleY(-1); filter: blur(5px); opacity: .32; -webkit-mask: linear-gradient(0deg, #000 0%, transparent 22%); mask: linear-gradient(0deg, #000 0%, transparent 22%); }
  .grain { position: absolute; inset: -40px; opacity: .1; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' seed='8' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  .smoke { position: absolute; inset: 0; opacity: .5; mix-blend-mode: screen;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='1920'><filter id='s'><feTurbulence type='fractalNoise' baseFrequency='.0028 .006' numOctaves='5' seed='3'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .55  0 0 0 0 .6  0 0 0 .9 -.32'/></filter><rect width='100%' height='100%' filter='url(%23s)'/></svg>"); }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 65% at 50% 50%, transparent 40%, rgba(0,0,0,.85) 100%); }
  .chrome { background: linear-gradient(180deg, #ffffff 0%, #d7dbe2 30%, #6c717b 48%, #f4f6fa 52%, #a8adb6 75%, #ffffff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 18px rgba(0,0,0,.6)); }
  .thin { font: 300 30px/1 Inter; letter-spacing: .6em; text-transform: uppercase; }
  .tiny { font: 600 18px/1 Inter; letter-spacing: .5em; text-transform: uppercase; color: rgba(255,255,255,.55); }
  .tag { position: absolute; right: 24px; bottom: 24px; font: 600 20px Inter; color: rgba(255,255,255,.25); }
  body.clean .tag { display: none; }
</style>
</head>
<body>

<!-- 1 · CHROME -->
<section class="frame" id="f1">
  <div class="layer" style="background: radial-gradient(ellipse 60% 40% at 50% 54%, #1b1c22 0%, #050506 70%)"></div>
  <div class="abs" style="left:240px; top:-200px; width:600px; height:1500px; background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.04) 70%, transparent); clip-path: polygon(40% 0, 60% 0, 100% 100%, 0 100%); filter: blur(18px); mix-blend-mode: screen"></div>
  <div class="smoke"></div>
  <canvas class="gl" id="c1" width="1080" height="1920"></canvas>
  <div class="abs" style="left:0; right:0; top:330px; text-align:center">
    <div class="chrome" style="font: 400 300px/.86 Bebas; letter-spacing: .02em">Built</div>
    <div class="thin" style="margin-top:28px; color:rgba(255,255,255,.85)">in the quiet hours</div>
  </div>
  <div class="abs tiny" style="left:0; right:0; top:1600px; text-align:center">Gainsdom &nbsp;·&nbsp; Recovery series &nbsp;·&nbsp; 01</div>
  <div class="vig"></div><div class="grain"></div><div class="tag">01 · CHROME</div>
</section>

<!-- 2 · EMBER -->
<section class="frame" id="f2">
  <div class="layer" style="background: radial-gradient(ellipse 70% 45% at 50% 52%, #2a0507 0%, #070203 60%, #000 100%)"></div>
  <canvas class="gl" id="c2" width="1080" height="1920"></canvas>
  <div class="abs" style="left:0; right:0; top:300px; text-align:center; line-height:.84">
    <div style="font: 400 330px/.84 Bebas; color: transparent; -webkit-text-stroke: 3px rgba(255,255,255,.9)">Torn</div>
    <div style="font: 400 210px/.9 Bebas; color:#FF3B2F; text-shadow: 0 0 40px rgba(255,59,47,.7), 0 0 120px rgba(255,90,40,.4)">to grow</div>
  </div>
  <div class="abs thin" style="left:0; right:0; top:1600px; text-align:center; font-size:26px; color:rgba(255,220,210,.8)">micro-tears &nbsp;→&nbsp; repair &nbsp;→&nbsp; size</div>
  <div class="vig"></div><div class="grain"></div><div class="tag">02 · EMBER</div>
</section>

<!-- 3 · MONOLITH -->
<section class="frame" id="f3">
  <div class="layer" style="background: linear-gradient(180deg, #08080a 0%, #0d0d10 55%, #050506 100%)"></div>
  <div class="abs" style="left:120px; right:0; top:700px; text-align:center; font: 400 820px/1 Anton; color: rgba(255,255,255,.11); letter-spacing: -.02em">48</div>
  <div class="abs" style="left:430px; top:-300px; width:900px; height:1700px; background: linear-gradient(200deg, rgba(255,240,225,.3), rgba(255,240,225,.03) 70%, transparent); clip-path: polygon(45% 0, 58% 0, 80% 100%, 10% 100%); filter: blur(22px); mix-blend-mode: screen; transform: rotate(-16deg)"></div>
  <div class="smoke" style="opacity:.6"></div>
  <canvas class="gl" id="c3" width="1080" height="1920"></canvas>
  <div class="abs" style="left:120px; top:300px">
    <div class="tiny" style="color:#FF3B2F">Chapter 02</div>
    <div style="font: 400 150px/.88 Bebas; margin-top:18px">48 hours</div>
    <div class="thin" style="margin-top:20px; font-size:26px; color:rgba(255,255,255,.75)">to rebuild</div>
  </div>
  <div class="vig"></div><div class="grain"></div><div class="tag">03 · MONOLITH</div>
</section>

<!-- 4 · HALO -->
<section class="frame" id="f4">
  <div class="layer" style="background: radial-gradient(ellipse 70% 50% at 50% 50%, #12070a 0%, #040304 70%)"></div>
  <canvas class="gl" id="c4" width="1080" height="1920"></canvas>
  <div class="abs" style="left:0; right:0; top:820px; text-align:center">
    <div class="chrome" style="font: 400 260px/.86 Bebas">Rest</div>
    <div class="thin" style="margin-top:24px; color:rgba(255,255,255,.85)">is the last rep</div>
  </div>
  <div class="abs tiny" style="left:0; right:0; top:300px; text-align:center">Gainsdom</div>
  <div class="vig"></div><div class="grain"></div><div class="tag">04 · HALO</div>
</section>

<script>
const T = THREE;
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
function rig(canvas, fov = 30) {
  const r = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1); r.setSize(1080, 1920, false); r.setClearColor(0x000000, 0);
  r.toneMapping = T.ACESFilmicToneMapping; r.toneMappingExposure = 1.05; r.outputEncoding = T.sRGBEncoding; r.physicallyCorrectLights = true;
  const scene = new T.Scene(), cam = new T.PerspectiveCamera(fov, 1080 / 1920, 0.1, 100);
  return { r, scene, cam };
}
// light-studio environment: black room with softbox strips (and an optional red strip) for premium reflections
function studio(r, red = true, warm = false) {
  const env = new T.Scene(); env.background = new T.Color(0x000000);
  const box = (w, h, x, y, z, c, k) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(c).multiplyScalar(k), side: T.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); };
  box(8, 1.2, 0, 7, 0, warm ? 0xfff0e0 : 0xffffff, 6);       // top strip
  box(1.2, 9, -7, 1, 2, 0xffffff, 4);                        // left tall softbox
  box(1.4, 9, 7, 1, -1, 0xdfe8ff, 5);                        // right tall softbox
  if (red) box(10, 0.8, 0, -1.5, -7, 0xff2a2a, 5);           // red kicker behind
  box(3, 3, 0, 2, 8, 0xffffff, 0.6);                         // soft front fill
  const pm = new T.PMREMGenerator(r); const tex = pm.fromScene(env, 0.02).texture; pm.dispose(); return tex;
}
function dumbbell(rubber, chrome, steel) {
  const g = new T.Group();
  const handle = new T.Mesh(new T.CylinderGeometry(0.16, 0.16, 2.2, 64), steel); handle.rotation.z = Math.PI / 2; g.add(handle);
  for (let i = -6; i <= 6; i++) { const k = new T.Mesh(new T.TorusGeometry(0.162, 0.009, 8, 64), chrome); k.rotation.y = Math.PI / 2; k.position.x = i * 0.08; g.add(k); }
  [-1, 1].forEach((s) => {
    const head = new T.Mesh(new T.CylinderGeometry(0.62, 0.62, 0.78, 6, 1), rubber); head.rotation.z = Math.PI / 2; head.position.x = s * 1.42; g.add(head);
    const bevel = new T.Mesh(new T.CylinderGeometry(0.6, 0.62, 0.04, 6, 1), chrome); bevel.rotation.z = Math.PI / 2; bevel.position.x = s * (1.42 + 0.41); g.add(bevel);
    const cap = new T.Mesh(new T.CylinderGeometry(0.34, 0.34, 0.06, 64), chrome); cap.rotation.z = Math.PI / 2; cap.position.x = s * 1.86; g.add(cap);
    const collar = new T.Mesh(new T.CylinderGeometry(0.24, 0.24, 0.16, 64), chrome); collar.rotation.z = Math.PI / 2; collar.position.x = s * 0.98; g.add(collar);
  });
  return g;
}
const done = (id) => { const c = document.getElementById(id), f = c.parentElement, url = c.toDataURL("image/png");
  const b = new Image(); b.src = url; b.className = "bloom"; c.after(b); return url; };
const reflect = (id, top) => { const c = document.getElementById(id), f = c.parentElement, img = new Image(); img.src = c.toDataURL("image/png"); img.className = "refl"; img.style.top = top + "px"; c.before(img); };

// ---------- 1 · chrome dumbbell ----------
(() => { const { r, scene, cam } = rig(document.getElementById("c1"), 28); scene.environment = studio(r, true);
  const rubber = new T.MeshPhysicalMaterial({ color: "#050506", roughness: 0.32, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.04, envMapIntensity: 1.2 });
  const chrome = new T.MeshStandardMaterial({ color: "#ffffff", roughness: 0.06, metalness: 1, envMapIntensity: 1.4 });
  const steel = new T.MeshStandardMaterial({ color: "#c9ced6", roughness: 0.18, metalness: 1, envMapIntensity: 1.2 });
  const g = dumbbell(rubber, chrome, steel); g.rotation.set(0.38, -0.62, -0.12); g.position.set(0, -1.1, 0); scene.add(g);
  const rim = new T.SpotLight(0xff2a2a, 260, 30, 0.6, 0.6); rim.position.set(-3, -2, -6); scene.add(rim);
  const top = new T.SpotLight(0xffffff, 380, 30, 0.35, 0.7); top.position.set(0, 8, 2); top.target.position.set(0, -0.5, 0); scene.add(top, top.target);
  cam.position.set(0, 0.6, 17); cam.lookAt(0, -0.6, 0);
  r.render(scene, cam); done("c1"); reflect("c1", 470); })();

// ---------- 2 · ember fibres ----------
(() => { const { r, scene, cam } = rig(document.getElementById("c2"), 34);
  const N = 70, grp = new T.Group();
  for (let i = 0; i < N; i++) {
    const a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * 0.9, oy = Math.cos(a) * rr, oz = Math.sin(a) * rr * 0.7, torn = rnd() < 0.18, gap = torn ? 0.12 + rnd() * 0.1 : 0;
    const seg = (x0, x1) => { const pts = []; for (let k = 0; k <= 30; k++) { const u = x0 + (x1 - x0) * k / 30, sw = Math.pow(Math.max(0, Math.sin(Math.PI * (u + 2.6) / 5.2)), 0.8); pts.push(new T.Vector3(u, oy * sw + Math.sin(u * 2 + i) * 0.03, oz * sw)); } return new T.CatmullRomCurve3(pts); };
    const hot = rnd(), col = hot < 0.3 ? new T.Color(0.16, 0.01, 0.015) : hot < 0.85 ? new T.Color().setHSL(0.995 + hot * 0.012, 1, 0.16 + hot * 0.2) : new T.Color().setHSL(0.045, 1, 0.5);
    const mat = new T.MeshBasicMaterial({ color: col, toneMapped: false });
    const tx = -0.2 + rnd() * 0.6;
    const parts = torn ? [[-2.6, tx - gap], [tx + gap, 2.6]] : [[-2.6, 2.6]];
    parts.forEach(([x0, x1]) => grp.add(new T.Mesh(new T.TubeGeometry(seg(x0, x1), 80, 0.012 + rnd() * 0.02, 6, false), mat)));
    if (torn) { const pg = new T.BufferGeometry(), pp = []; for (let k = 0; k < 40; k++) pp.push(tx + (rnd() - .5) * .5, oy * 0.9 + (rnd() - .3) * .6, oz + (rnd() - .5) * .4); pg.setAttribute("position", new T.Float32BufferAttribute(pp, 3));
      grp.add(new T.Points(pg, new T.PointsMaterial({ color: new T.Color(1.0, 0.62, 0.3), size: 0.03, toneMapped: false }))); }
  }
  grp.rotation.set(0.12, 0.6, 0.36); grp.position.set(0, -0.95, 0); grp.scale.setScalar(0.62); scene.add(grp);
  const dust = new T.BufferGeometry(), dp = []; for (let k = 0; k < 600; k++) dp.push((rnd() - .5) * 8, (rnd() - .5) * 12, (rnd() - .5) * 6 - 2); dust.setAttribute("position", new T.Float32BufferAttribute(dp, 3));
  scene.add(new T.Points(dust, new T.PointsMaterial({ color: new T.Color(1, 0.35, 0.25), size: 0.02, transparent: true, opacity: 0.6, toneMapped: false })));
  cam.position.set(0, 0, 8.5); cam.lookAt(0, -0.4, 0);
  r.render(scene, cam); done("c2"); })();

// ---------- 3 · monolith plate ----------
(() => { const { r, scene, cam } = rig(document.getElementById("c3"), 30); scene.environment = studio(r, true, true);
  const prof = []; const R = 2.25; [[0.32, -0.16], [0.32, 0.16], [0.55, 0.2], [0.62, 0.12], [1.85, 0.12], [2.0, 0.28], [R, 0.3], [R + 0.05, 0.26], [R + 0.05, -0.26], [R, -0.3], [2.0, -0.28], [1.85, -0.12], [0.62, -0.12], [0.55, -0.2], [0.32, -0.16]].forEach(([x, y]) => prof.push(new T.Vector2(x, y)));
  const geo = new T.LatheGeometry(prof, 160); geo.computeVertexNormals();
  const black = new T.MeshPhysicalMaterial({ color: "#050506", roughness: 0.55, metalness: 0.0, clearcoat: 0.6, clearcoatRoughness: 0.25, envMapIntensity: 0.18 });
  const chrome = new T.MeshStandardMaterial({ color: "#ffffff", roughness: 0.05, metalness: 1, envMapIntensity: 1.5 });
  const plate = new T.Group(); const body = new T.Mesh(geo, black); body.rotation.x = Math.PI / 2; plate.add(body);
  const ring = new T.Mesh(new T.TorusGeometry(0.42, 0.06, 24, 128), chrome); plate.add(ring);
  const hub = new T.Mesh(new T.CylinderGeometry(0.36, 0.36, 0.5, 96, 1, true), chrome); hub.rotation.x = Math.PI / 2; plate.add(hub);
  const edge = new T.Mesh(new T.TorusGeometry(R + 0.02, 0.03, 16, 200), chrome); edge.position.z = 0.26; plate.add(edge);
  const edge2 = edge.clone(); edge2.position.z = -0.26; plate.add(edge2);
  plate.rotation.set(-0.06, -0.72, 0.03); plate.position.set(0.55, -1.25, 0); scene.add(plate);
  const key = new T.SpotLight(0xfff1e2, 160, 40, 0.3, 0.8); key.position.set(4, 9, 3); key.target.position.set(0, -0.5, 0); scene.add(key, key.target);
  const rim = new T.SpotLight(0xff2a2a, 400, 30, 0.5, 0.6); rim.position.set(-4, 1, -6); scene.add(rim);
  cam.position.set(0, 0.2, 16); cam.lookAt(0, -0.7, 0);
  r.render(scene, cam); done("c3"); reflect("c3", 600); })();

// ---------- 4 · halo ring ----------
(() => { const { r, scene, cam } = rig(document.getElementById("c4"), 30); scene.environment = studio(r, true);
  const glow = new T.MeshBasicMaterial({ color: new T.Color(1.0, 0.12, 0.08).multiplyScalar(2.4), toneMapped: false });
  const ring = new T.Mesh(new T.TorusGeometry(1.55, 0.04, 32, 256), glow); ring.rotation.x = 0.28; ring.rotation.y = -0.35; ring.position.y = 0.05; scene.add(ring);
  const ring2 = new T.Mesh(new T.TorusGeometry(1.72, 0.01, 16, 256), new T.MeshBasicMaterial({ color: new T.Color(1, 0.55, 0.45).multiplyScalar(2), toneMapped: false })); ring2.rotation.x = 0.28; ring2.rotation.y = -0.35; ring2.position.y = 0.05; scene.add(ring2);
  const floor = new T.Mesh(new T.CircleGeometry(9, 128), new T.MeshPhysicalMaterial({ color: "#060607", roughness: 0.15, metalness: 0.6, clearcoat: 1, envMapIntensity: 0.5 })); floor.rotation.x = -Math.PI / 2; floor.position.y = -2.9; scene.add(floor);
  
  const sp = new T.BufferGeometry(), pp = []; for (let k = 0; k < 500; k++) { const a = rnd() * 6.283, rr = 1.55 + (rnd() - .5) * 0.5; pp.push(Math.cos(a) * rr, Math.sin(a) * rr + (rnd() - .5) * 0.4, (rnd() - .5) * 0.6); }
  sp.setAttribute("position", new T.Float32BufferAttribute(pp, 3)); scene.add(new T.Points(sp, new T.PointsMaterial({ color: new T.Color(1, .5, .4).multiplyScalar(2), size: 0.025, toneMapped: false })));
  cam.position.set(0, 0.4, 12); cam.lookAt(0, 0.05, 0);
  r.render(scene, cam); done("c4"); reflect("c4", 760); })();

document.fonts.ready.then(() => setTimeout(() => (document.body.dataset.ready = "1"), 300));
</script>
</body>
</html>
