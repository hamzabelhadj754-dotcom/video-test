<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stripe style frames</title>
<style>
@font-face{font-family:"Geist";src:url(assets/fonts/geist.woff2) format("woff2");font-weight:100 900;font-display:block}
@font-face{font-family:"GeistMono";src:url(assets/fonts/geist-mono.woff2) format("woff2");font-weight:400 600;font-display:block}
:root{--navy:#0A2540;--deep:#061B31;--blurple:#635BFF;--cyan:#00D4FF;--paper:#F6F9FC;--line:#E5EDF5;--slate:#8C9EB1;--pink:#FF5996;--m:80px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--navy)}
.frame{position:absolute;inset:0;overflow:hidden;display:none}
.frame.on{display:block}
.mono{font-family:"GeistMono";font-weight:500;font-size:22px;letter-spacing:.04em}
.disp{font-family:"Geist";font-weight:500;letter-spacing:-0.035em;line-height:.98}
.grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.12;z-index:40}
svg.full{position:absolute;inset:0}

/* ---------- checkout card (original merchant UI) ---------- */
.card{position:absolute;width:640px;border-radius:28px;background:#fff;padding:44px;
  box-shadow:0 50px 100px -20px rgba(50,50,93,.25),0 30px 60px -30px rgba(0,0,0,.3)}
.prod{display:flex;gap:24px;align-items:center;padding-bottom:30px;border-bottom:1px solid var(--line)}
.thumb{width:96px;height:96px;border-radius:18px;background:radial-gradient(circle at 35% 30%,#F3E9DC,#D9C6AE 60%,#B89F84);position:relative;overflow:hidden}
.thumb::after{content:"";position:absolute;left:24px;top:22px;width:46px;height:54px;border-radius:8px 8px 14px 14px;background:#F7F2EA;box-shadow:inset -6px 0 0 rgba(0,0,0,.06)}
.pname{font-family:"Geist";font-weight:600;font-size:30px;color:var(--navy);letter-spacing:-0.02em}
.pmer{font-family:"Geist";font-weight:500;font-size:22px;color:var(--slate);margin-top:4px}
.price{margin-left:auto;font-family:"Geist";font-weight:600;font-size:30px;color:var(--navy);font-variant-numeric:tabular-nums}
.fld{margin-top:26px}
.fl{font-family:"Geist";font-weight:500;font-size:19px;color:#425466;margin-bottom:10px}
.inp{height:68px;border:1.5px solid var(--line);border-radius:14px;display:flex;align-items:center;padding:0 22px;font-family:"GeistMono";font-size:24px;color:var(--navy);gap:16px}
.row{display:flex;gap:16px}.row>div{flex:1}
.brand{margin-left:auto;width:52px;height:34px;border-radius:6px;background:linear-gradient(135deg,#1A1F71,#2B3AA8)}
.pay{margin-top:34px;box-shadow:0 0 0 6px rgba(99,91,255,.18),0 16px 40px -10px rgba(99,91,255,.7);height:84px;border-radius:16px;background:var(--blurple);color:#fff;display:grid;place-items:center;font-family:"Geist";font-weight:600;font-size:30px;letter-spacing:-0.01em;position:relative}
</style>
</head>
<body>

<!-- ========== F1 THE TAP ========== -->
<section class="frame" id="f1" style="background:var(--paper)">
  <div style="position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 55%,#FFFFFF,transparent 70%)"></div>
  <div class="mono" style="position:absolute;left:var(--m);top:84px;color:var(--slate)">00 — TAP</div>
  <div class="mono" style="position:absolute;right:var(--m);top:84px;color:var(--navy)">t = 0.000 s</div>
  <div class="card" style="left:220px;top:250px;transform:scale(1.22);transform-origin:50% 0">
    <div class="prod"><div class="thumb"></div><div><div class="pname">Speckled mug</div><div class="pmer">Kiln &amp; Co.</div></div><div class="price">€38.00</div></div>
    <div class="fld"><div class="fl">Card</div><div class="inp">•••• •••• •••• 4242<div class="brand"></div></div></div>
    <div class="row fld"><div><div class="fl">Expiry</div><div class="inp">12 / 29</div></div><div><div class="fl">CVC</div><div class="inp">•••</div></div></div>
    <div class="pay" id="pay">Pay €38.00</div>
  </div>
  <!-- tap ripple + cursor -->
  <svg class="full" viewBox="0 0 1080 1350">
    <defs>
      <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <linearGradient id="beam1" gradientUnits="userSpaceOnUse" x1="0" y1="972" x2="0" y2="1350"><stop offset="0" stop-color="#9F9BFF"/><stop offset=".15" stop-color="#635BFF"/><stop offset="1" stop-color="#635BFF" stop-opacity="0"/></linearGradient>
    </defs>
    <circle cx="770" cy="866" r="58" fill="none" stroke="#635BFF" stroke-width="2" opacity=".55"/>
    <circle cx="770" cy="866" r="96" fill="none" stroke="#635BFF" stroke-width="1.5" opacity=".22"/>
    <rect x="767" y="972" width="6" height="378" fill="url(#beam1)" filter="url(#glow1)"/><rect x="769" y="972" width="2" height="300" fill="url(#beam1)"/><circle cx="770" cy="972" r="5" fill="#fff" filter="url(#glow1)"/>
    <path d="M776 858 l0 54 l13 -12 l10 24 l9 -4 l-10 -23 l18 -1 z" fill="#0A2540" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
  </svg>
</section>

<!-- ========== F2 FRAUD CHECK (inside the second) ========== -->
<section class="frame" id="f2" style="background:var(--deep)">
  <div style="position:absolute;inset:0;background:radial-gradient(70% 55% at 52% 52%,#0E2D52 0%,var(--deep) 70%)"></div>
  <svg class="full" viewBox="0 0 1080 1350">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#635BFF" stop-opacity="0"/><stop offset=".55" stop-color="#635BFF"/><stop offset=".9" stop-color="#9F9BFF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
      <radialGradient id="core"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#B8B5FF"/><stop offset="1" stop-color="#635BFF" stop-opacity="0"/></radialGradient>
    </defs>
    <!-- far grid (depth) -->
    <g stroke="#8C9EB1" stroke-opacity=".07" filter="url(#soft)">
      <path d="M0 300 H1080 M0 420 H1080 M0 540 H1080 M0 660 H1080 M0 780 H1080 M0 900 H1080 M0 1020 H1080 M0 1140 H1080"/>
    </g>
    <!-- the gate: precise instrument rings -->
    <g transform="translate(560 690)">
      <circle r="300" fill="none" stroke="#E5EDF5" stroke-opacity=".10" stroke-width="1.5"/>
      <circle r="240" fill="none" stroke="#E5EDF5" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="2 10"/>
      <circle r="180" fill="none" stroke="#00D4FF" stroke-opacity=".55" stroke-width="2"/>
      <path d="M0 -180 A180 180 0 0 1 155.9 90" fill="none" stroke="#00D4FF" stroke-width="5" filter="url(#glow)"/>
      <circle r="120" fill="none" stroke="#E5EDF5" stroke-opacity=".18" stroke-width="1"/>
      <g stroke="#E5EDF5" stroke-opacity=".45" stroke-width="2">
        <path d="M0 -300 v26 M0 300 v-26 M-300 0 h26 M300 0 h-26"/>
        <path d="M212 -212 l-16 16 M-212 212 l16 -16 M212 212 l-16 -16 M-212 -212 l16 16" stroke-opacity=".25"/>
      </g>
      <!-- scan line -->
      <path d="M-260 -60 H260" stroke="#00D4FF" stroke-opacity=".35" stroke-width="1.5"/>
      <rect x="-260" y="-60" width="520" height="70" fill="url(#scan)" opacity=".5"/>
    </g>
    <defs><linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00D4FF" stop-opacity=".18"/><stop offset="1" stop-color="#00D4FF" stop-opacity="0"/></linearGradient></defs>
    <!-- the line of light -->
    <path d="M-40 1010 C 220 1000, 330 760, 560 690" stroke="url(#beam)" stroke-width="6" fill="none" filter="url(#glow)"/>
    <path d="M-40 1010 C 220 1000, 330 760, 560 690" stroke="#fff" stroke-opacity=".8" stroke-width="1.5" fill="none"/>
    <circle cx="560" cy="690" r="46" fill="url(#core)"/>
    <circle cx="560" cy="690" r="7" fill="#fff"/>
  </svg>
  <div class="mono" style="position:absolute;left:var(--m);top:84px;color:var(--slate)">02 / 04</div>
  <div class="mono" style="position:absolute;right:var(--m);top:84px;color:#E5EDF5;opacity:.85">inside the second</div>
  <div class="disp" style="position:absolute;left:var(--m);bottom:150px;font-size:96px;color:#F6F9FC">Fraud<br>checked.</div>
  <div class="mono" style="position:absolute;left:var(--m);bottom:96px;color:var(--cyan)">● passed</div>
</section>

<!-- ========== F3 END ========== -->
<section class="frame" id="f3" style="background:var(--navy)">
  <!-- the gradient: blooms once, at the end -->
  <div style="position:absolute;left:-200px;right:-200px;top:760px;height:900px;filter:blur(90px);transform:skewY(-10deg)">
    <div style="position:absolute;left:0;top:120px;width:700px;height:420px;border-radius:50%;background:#635BFF"></div>
    <div style="position:absolute;left:420px;top:40px;width:640px;height:380px;border-radius:50%;background:#00D4FF;opacity:.85"></div>
    <div style="position:absolute;left:860px;top:160px;width:620px;height:420px;border-radius:50%;background:#FF5996;opacity:.9"></div>
    <div style="position:absolute;left:300px;top:330px;width:800px;height:400px;border-radius:50%;background:#7A73FF"></div>
  </div>
  <div style="position:absolute;inset:0;background:linear-gradient(to bottom,var(--navy) 45%,rgba(10,37,64,0) 75%)"></div>
  <div class="mono" style="position:absolute;right:var(--m);top:84px;color:#E5EDF5;opacity:.85">t = 1.000 s</div>
  <div class="disp" style="position:absolute;left:var(--m);top:250px;font-size:118px;color:#F6F9FC">A lot happens<br>in one second.</div>
  <div class="disp" style="position:absolute;left:var(--m);top:520px;font-size:118px;color:#8C9EB1">You’ll never<br>notice.</div>
  <img src="assets/stripe_wordmark_white.svg" style="position:absolute;left:var(--m);bottom:96px;width:150px">
  <div class="mono" style="position:absolute;right:var(--m);bottom:104px;font-size:16px;line-height:1.6;color:rgba(255,255,255,.7);text-align:right">SPEC AD · NOT AFFILIATED<br>WITH STRIPE, INC.</div>
</section>

<canvas class="grain" id="grain" width="1080" height="1350"></canvas>
<script>
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
(function(){const c=grain,x=c.getContext('2d'),r=rng(3),img=x.createImageData(c.width,c.height);
for(let i=0;i<img.data.length;i+=4){const v=r()*255;img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255}x.putImageData(img,0,0)})();
const f=new URLSearchParams(location.search).get('f')||'1';document.getElementById('f'+f).classList.add('on');
document.fonts.ready.then(()=>{document.body.dataset.ready=1});
</script>
</body>
</html>
