<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"color-ground","type":"color","label":"Background","default":"#0B0D10"},
  {"id":"color-ink","type":"color","label":"Text","default":"#ECEEF1"},
  {"id":"color-accent","type":"color","label":"Accent (ice blue)","default":"#5BB8E8"},
  {"id":"color-slate","type":"color","label":"Second series","default":"#3B4C5E"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #0B0D10;
        --color-ink: #ECEEF1;
        --color-accent: #5BB8E8;
        --color-slate: #3B4C5E;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--color-ground); }
      #root { width: 100%; height: 100%; background: var(--color-ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.8"
         data-width="1080" data-height="1920" data-motion-blur="on">
      <div id="world" data-composition-id="world" data-composition-src="compositions/world.html"
           data-start="0" data-duration="4.6" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
           data-start="4.6" data-duration="3.2" data-track-index="1" data-track-kind="graphics"
           data-width="1080" data-height="1920"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
           data-start="0" data-duration="4.5" data-track-index="2" data-track-kind="captions"
           data-width="1080" data-height="1920" style="z-index: 5;"></div>
      <div id="grain" data-composition-id="grain" data-composition-src="compositions/grain.html"
           data-start="0" data-duration="7.8" data-track-index="3" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index: 6;"></div>

      <!-- sound design (licensed SFX, see assets/sfx/CREDITS.md): every sound sits on a visible action -->
      <audio id="sfx-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="1.28" data-duration="2.1" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-zoom" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="1.92" data-duration="0.57" data-track-index="11" data-volume="0.45"></audio>
      <audio id="sfx-base" class="clip" src="assets/sfx/click-soft.mp3" data-start="2.56" data-duration="0.36" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-same" class="clip" src="assets/sfx/click-soft.mp3" data-start="3.65" data-duration="0.36" data-track-index="10" data-volume="0.4"></audio>
      <audio id="sfx-switch" class="clip" src="assets/sfx/click.mp3" data-start="4.5" data-duration="0.36" data-track-index="10" data-volume="0.5"></audio>
      <audio id="sfx-logo" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="4.78" data-duration="2.59" data-track-index="10" data-volume="0.4" data-fade-out="0.8"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
