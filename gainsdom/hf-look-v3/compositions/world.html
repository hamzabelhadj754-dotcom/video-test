<template>
  <style>
    @font-face { font-family: 'Barlow'; src: url('assets/fonts/Barlow-300.woff2') format('woff2'); font-weight: 300; font-display: block; }
    @font-face { font-family: 'Barlow'; src: url('assets/fonts/Barlow-500.woff2') format('woff2'); font-weight: 500; font-display: block; }
    @font-face { font-family: 'Barlow'; src: url('assets/fonts/Barlow-700.woff2') format('woff2'); font-weight: 700; font-display: block; }
    @font-face { font-family: 'Barlow Condensed'; src: url('assets/fonts/BarlowCondensed-600.woff2') format('woff2'); font-weight: 600; font-display: block; }
    @font-face { font-family: 'Barlow Condensed'; src: url('assets/fonts/BarlowCondensed-800.woff2') format('woff2'); font-weight: 800; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--color-ground, #0B0D10); }
    #w-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 3840px; transform-origin: 540px 960px; }
    .w-beat { position: absolute; left: 0; width: 1080px; height: 1920px; }
    .w-mono { font-family: 'IBM Plex Mono', monospace; font-size: 28px; letter-spacing: .16em; text-transform: uppercase; color: #8A939E; font-variant-numeric: tabular-nums; }
    .w-light { font-family: 'Barlow'; font-weight: 300; text-transform: uppercase; color: var(--color-ink, #ECEEF1); letter-spacing: .04em; }
    .w-hero { font-family: 'Barlow Condensed'; font-weight: 800; text-transform: uppercase; color: var(--color-ink, #ECEEF1); line-height: .9; letter-spacing: -.01em; }
    .w-acc { color: var(--color-accent, #5BB8E8); }
    .w-abs { position: absolute; }
    .w-word { display: inline-block; }
    /* the plate: flat, matte, front-on */
    #w-plate { position: absolute; left: 470px; top: 600px; width: 820px; height: 820px; z-index: 0; }
    .w-beat > div { z-index: 2; }
    .w-bar { position: absolute; bottom: 0; width: 170px; height: 290px; transform-origin: 50% 100%; }
  </style>

  <div id="root" data-composition-id="world" data-width="1080" data-height="1920">
    <div id="w-cam" data-layout-allow-overflow>

      <!-- BEAT 1: the hook -->
      <div class="w-beat" id="w-b1" style="top:0;">
        <div class="w-mono w-abs" id="w-label1" style="left:146px; top:330px;">Dom Science &nbsp;/&nbsp; 001</div>
        <div class="w-light w-abs" id="w-l1" style="left:142px; top:384px; font-size:84px;">Light weights.</div>
        <div class="w-hero w-abs" style="left:146px; top:488px; font-size:196px;">
          <span class="w-word" id="w-real">Real</span><br>
          <span class="w-word w-acc" id="w-muscle">Muscle.</span>
        </div>

        <svg id="w-plate" viewBox="-310 -310 620 620" data-layout-ignore>
          <g id="w-plate-spin">
            <circle r="306" fill="#151A20"/>
            <circle r="306" fill="none" stroke="#252D36" stroke-width="4"/>
            <circle r="262" fill="none" stroke="#252D36" stroke-width="2"/>
            <circle r="150" fill="#11151A"/>
            <circle r="150" fill="none" stroke="#252D36" stroke-width="2"/>
            <circle r="64" fill="#0B0D10" stroke="#2E3742" stroke-width="10"/>
            <text y="-196" text-anchor="middle" font-family="Barlow Condensed" font-weight="600" font-size="64" letter-spacing="4" fill="#5BB8E8">5 KG</text>
            <text y="232" text-anchor="middle" font-family="IBM Plex Mono" font-size="22" letter-spacing="8" fill="#5D6773">GAINSDOM</text>
            <g id="w-ticks" stroke="#2E3742" stroke-width="2"></g>
          </g>
        </svg>
      </div>

      <!-- BEAT 2: the data -->
      <div class="w-beat" id="w-b2" style="top:1920px;">
        <div class="w-mono w-abs" id="w-src" style="left:146px; top:330px;">Schoenfeld 2017 · Lopez 2021</div>
        <div class="w-hero w-abs" style="left:146px; top:372px; font-size:140px;">
          <span class="w-word" id="w-same">Same</span><br>
          <span class="w-word w-acc" id="w-growth">growth.</span>

        <div class="w-abs" id="w-chart" style="left:146px; top:712px; width:634px; height:290px;">

          <div class="w-abs" id="w-base" style="left:0; bottom:-2px; width:634px; height:2px; background:#2A323C; transform-origin:0 50%;"></div>
        </div>
        <div class="w-abs" id="w-lblL" style="left:230px; top:1018px; width:170px; text-align:center;">

          <div class="w-mono" style="font-size:28px; line-height:1.1; margin-top:10px; letter-spacing:.06em;">30% 1RM</div>
        </div>
        <div class="w-abs" id="w-lblH" style="left:560px; top:1018px; width:170px; text-align:center;">
          <div class="w-light" style="font-weight:500; font-size:36px; line-height:1.1;">Heavy</div>
          <div class="w-mono" style="font-size:28px; line-height:1.1; margin-top:10px; letter-spacing:.06em;">80% 1RM</div>
        </div>

  </div>

  <script>
    // plate tick marks (static geometry, built once, deterministic)
    (function () {
      const g = document.querySelector('#w-ticks'), NS = 'http://www.w3.org/2000/svg';
      for (let i = 0; i < 72; i++) {
        const a = i / 72 * Math.PI * 2, r1 = i % 6 === 0 ? 270 : 278, r2 = 290;
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', (Math.cos(a) * r1).toFixed(2)); l.setAttribute('y1', (Math.sin(a) * r1).toFixed(2));
        l.setAttribute('x2', (Math.cos(a) * r2).toFixed(2)); l.setAttribute('y2', (Math.sin(a) * r2).toFixed(2));
        g.appendChild(l);
      }
    })();

    const tl = gsap.timeline({ paused: true });
    const T_REAL = 0.85, T_MUSCLE = 1.30, T_GLIDE = 2.05, T_SAME = 3.55;

    // ---- camera: a slow push on the hook, a glide down to the data, a slow push again ----
    tl.fromTo('#w-cam', { y: 0, scale: 1 }, { scale: 1.025, duration: T_GLIDE, ease: 'power1.inOut' }, 0);
    tl.to('#w-cam', { y: -1920, scale: 1.0, duration: 0.62, ease: 'power3.inOut' }, T_GLIDE);
    tl.to('#w-cam', { scale: 1.02, duration: 4.6 - (T_GLIDE + 0.62), ease: 'power1.inOut' }, T_GLIDE + 0.62);
    // impact: tiny settle on MUSCLE (the camera, not the title)
    tl.to('#w-b1', { y: 6, duration: 0.06, ease: 'power2.out' }, T_MUSCLE);
    tl.to('#w-b1', { y: 0, duration: 0.25, ease: 'power3.out' }, T_MUSCLE + 0.06);

    // the plate turns slowly: the world moves, the titles stay still
    tl.fromTo('#w-plate-spin', { rotation: -112, svgOrigin: '0 0' }, { rotation: -92, svgOrigin: '0 0', duration: 2.6, ease: 'none' }, 0);
    tl.fromTo('#w-plate', { y: 30, opacity: 0.85 }, { y: 0, opacity: 1, duration: 1.2, ease: 'expo.out' }, 0);

    // ---- beat 1 type ----
    
    tl.fromTo('#w-real', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out' }, T_REAL);
    tl.fromTo('#w-muscle', { opacity: 0, filter: 'blur(8px)', y: 24 }, { opacity: 1, filter: 'blur(0px)', y: 0, duration: 0.32, ease: 'expo.out' }, T_MUSCLE);

    // ---- beat 2: headline, then the chart in reading order ----
    tl.fromTo('#w-src', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, T_GLIDE + 0.45);
    tl.fromTo('#w-base', { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'expo.out' }, T_GLIDE + 0.4);
    tl.fromTo(['#w-lblL', '#w-lblH'], { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power4.out', stagger: 0.08 }, T_GLIDE + 0.55);
    tl.fromTo('#w-barH', { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: 'expo.out' }, T_GLIDE + 0.6);
    tl.fromTo('#w-barL', { scaleY: 0 }, { scaleY: 1, duration: T_SAME - (T_GLIDE + 0.6), ease: 'power2.inOut' }, T_GLIDE + 0.6);
    tl.fromTo('#w-ref', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.4, ease: 'power3.out' }, T_SAME);
    tl.fromTo('#w-reflabel', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power2.out' }, T_SAME + 0.15);
    tl.fromTo('#w-same', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out' }, T_SAME);
    tl.fromTo('#w-growth', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out' }, T_SAME + 0.12);

    // dip before the cut to the end card
    tl.to('#w-cam', { opacity: 0.45, duration: 0.1, ease: 'power2.in' }, 4.48);

    window.__timelines["world"] = tl;
  </script>
