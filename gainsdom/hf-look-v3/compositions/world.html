<template>
  <style>

    @font-face { font-family: 'Barlow'; src: url('assets/fonts/Barlow-500.woff2') format('woff2'); font-weight: 500; font-display: block; }
    @font-face { font-family: 'Barlow'; src: url('assets/fonts/Barlow-700.woff2') format('woff2'); font-weight: 700; font-display: block; }
    @font-face { font-family: 'Barlow Condensed'; src: url('assets/fonts/BarlowCondensed-600.woff2') format('woff2'); font-weight: 600; font-display: block; }
    @font-face { font-family: 'Barlow Condensed'; src: url('assets/fonts/BarlowCondensed-800.woff2') format('woff2'); font-weight: 800; font-display: block; }
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--color-ground, #0B0D10); }
    /* the plate's hub centre is the camera's pivot: the zoom goes through the hole */
    #w-cam1 { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 880px 1010px; }
    #w-punch { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 960px; }
    #w-cam2 { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 460px 860px; }
    .w-mono { font-family: 'IBM Plex Mono', monospace; font-size: 28px; letter-spacing: .16em; text-transform: uppercase; color: #8A939E; font-variant-numeric: tabular-nums; }
    .w-light { font-family: 'Barlow'; font-weight: 300; text-transform: uppercase; color: var(--color-ink, #ECEEF1); letter-spacing: .04em; }
    .w-hero { font-family: 'Barlow Condensed'; font-weight: 800; text-transform: uppercase; color: var(--color-ink, #ECEEF1); line-height: .9; letter-spacing: -.01em; }
    .w-acc { color: var(--color-accent, #5BB8E8); }
    .w-abs { position: absolute; z-index: 2; }
    .w-word { display: inline-block; }
    #w-plate { position: absolute; left: 470px; top: 600px; width: 820px; height: 820px; z-index: 0; }
    .w-bar { position: absolute; bottom: 0; width: 170px; height: 290px; transform-origin: 50% 100%; }
  </style>

  <div id="root" data-composition-id="world" data-width="1080" data-height="1920">

    <!-- BEAT 1: the hook (complete on frame 0: it is the thumbnail) -->
    <div id="w-cam1" data-layout-allow-overflow>
     <div id="w-punch">
      <div class="w-mono w-abs" id="w-label1" style="left:146px; top:330px;">Dom Science &nbsp;/&nbsp; 001</div>
      <div class="w-light w-abs" id="w-l1" style="left:142px; top:384px; font-size:84px;">Light weights.</div>
      <div class="w-hero w-abs" style="left:146px; top:488px; font-size:196px;">
        <span class="w-word" id="w-real">Real</span><br>
        <span class="w-word" id="w-muscle">Muscle.</span>
      </div>
      <svg id="w-plate" viewBox="-410 -410 820 820" data-layout-ignore>
        <g id="w-plate-spin">
          <circle r="406" fill="#151A20"/>
          <circle r="406" fill="none" stroke="#252D36" stroke-width="4"/>
          <circle r="350" fill="none" stroke="#252D36" stroke-width="2"/>
          <circle r="200" fill="#11151A"/>
          <circle r="200" fill="none" stroke="#252D36" stroke-width="2"/>
          <circle r="64" fill="#0B0D10" stroke="#2E3742" stroke-width="10"/>
          <text y="-262" text-anchor="middle" font-family="Barlow Condensed" font-weight="600" font-size="84" letter-spacing="5" fill="#5BB8E8">5 KG</text>
          <text y="306" text-anchor="middle" font-family="IBM Plex Mono" font-size="28" letter-spacing="10" fill="#5D6773">GAINSDOM</text>
          <g id="w-ticks" stroke="#2E3742" stroke-width="2"></g>
        </g>
      </svg>
     </div>
    </div>

    <!-- BEAT 2: the data, opening out of the plate's hole -->
    <div id="w-cam2" data-layout-allow-overflow>
      <div class="w-mono w-abs" id="w-src" style="left:146px; top:330px;">Schoenfeld 2017 · Lopez 2021</div>
      <div class="w-hero w-abs" id="w-vs" style="left:146px; top:372px; font-size:140px;">Light<br>vs heavy.</div>
      <div class="w-hero w-abs" id="w-sim" style="left:146px; top:372px; font-size:140px;">Same<br><span class="w-acc">growth.</span></div>
      <div class="w-abs" id="w-chart" style="left:146px; top:712px; width:634px; height:290px;">
        <div class="w-abs" id="w-ref" style="left:0; top:0; width:634px; height:0; border-top:2px dashed #5BB8E8;"></div>
        <div class="w-mono w-abs" id="w-reflabel" style="right:0; top:-48px; color:#5BB8E8;">Muscle growth</div>
        <div class="w-bar" id="w-barL" style="left:84px; background: var(--color-accent, #5BB8E8);"></div>
        <div class="w-bar" id="w-barH" style="left:414px; background: var(--color-slate, #3B4C5E);"></div>
        <div class="w-abs" id="w-base" style="left:0; bottom:-2px; width:634px; height:2px; background:#2A323C; transform-origin:0 50%;"></div>
      </div>
      <div class="w-abs" id="w-lblL" style="left:230px; top:1018px; width:170px; text-align:center;">
        <div class="w-light" style="font-weight:500; font-size:36px; line-height:1.1;">Light</div>
        <div class="w-mono" style="line-height:1.1; margin-top:10px; letter-spacing:.06em;">30% 1RM</div>
      </div>
      <div class="w-abs" id="w-lblH" style="left:560px; top:1018px; width:170px; text-align:center;">
        <div class="w-light" style="font-weight:500; font-size:36px; line-height:1.1;">Heavy</div>
        <div class="w-mono" style="line-height:1.1; margin-top:10px; letter-spacing:.06em;">80% 1RM</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const g = document.querySelector('#w-ticks'), NS = 'http://www.w3.org/2000/svg';
      for (let i = 0; i < 96; i++) {
        const a = i / 96 * Math.PI * 2, r1 = i % 8 === 0 ? 362 : 372;
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', (Math.cos(a) * r1).toFixed(2)); l.setAttribute('y1', (Math.sin(a) * r1).toFixed(2));
        l.setAttribute('x2', (Math.cos(a) * 388).toFixed(2)); l.setAttribute('y2', (Math.sin(a) * 388).toFixed(2));
        g.appendChild(l);
      }
    })();

    const tl = gsap.timeline({ paused: true });
    const T_MUSCLE = 1.30, T_ZOOM = 2.00, T_OPEN = 2.42, T_SAME = 3.65;

    // ---- beat 1: slow push, then the punch on the stressed word ----
    tl.fromTo('#w-punch', { scale: 1 }, { scale: 1.015, duration: T_MUSCLE, ease: 'power1.inOut' }, 0);
    tl.to('#w-punch', { scale: 1.05, duration: 0.14, ease: 'power3.out' }, T_MUSCLE);           // punch-in
    tl.to('#w-punch', { scale: 1.04, duration: T_ZOOM - T_MUSCLE - 0.14, ease: 'power2.inOut' }, T_MUSCLE + 0.14);
    tl.fromTo('#w-muscle', { color: '#ECEEF1' }, { color: '#5BB8E8', duration: 0.16, ease: 'power2.out' }, T_MUSCLE);
    tl.fromTo('#w-plate-spin', { rotation: -112, svgOrigin: '0 0' }, { rotation: -70, svgOrigin: '0 0', duration: T_OPEN, ease: 'power1.in' }, 0);

    // ---- the zoom through the plate's hole: the hub fills the frame with the ground colour ----
    tl.fromTo('#w-cam1', { scale: 1, opacity: 1 }, { scale: 26, duration: T_OPEN - T_ZOOM, ease: 'power3.in', immediateRender: false }, T_ZOOM);
    tl.to(['#w-label1', '#w-l1', '#w-real', '#w-muscle'], { opacity: 0, filter: 'blur(10px)', duration: 0.2, ease: 'power2.in' }, T_ZOOM + 0.05);
    tl.set('#w-cam1', { opacity: 0 }, T_OPEN);

    // ---- beat 2 comes in slightly large and settles, then a slow push ----
    tl.fromTo('#w-cam2', { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1.0, duration: 0.5, ease: 'expo.out', immediateRender: true }, T_OPEN - 0.06);
    tl.to('#w-cam2', { scale: 1.025, duration: 4.6 - T_OPEN - 0.5, ease: 'power1.inOut' }, T_OPEN + 0.44);

    tl.fromTo('#w-src', { opacity: 0 }, { opacity: 1, duration: 0.3, ease: 'power2.out' }, T_OPEN + 0.1);
    tl.fromTo('#w-vs', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out' }, T_OPEN - 0.02);
    tl.fromTo('#w-base', { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: 'expo.out' }, T_OPEN + 0.15);
    tl.fromTo(['#w-lblL', '#w-lblH'], { opacity: 0, filter: 'blur(6px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.2, ease: 'power4.out', stagger: 0.08 }, T_OPEN + 0.3);
    tl.fromTo('#w-barH', { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: 'expo.out' }, T_OPEN + 0.3);
    tl.fromTo('#w-barL', { scaleY: 0 }, { scaleY: 1, duration: T_SAME - (T_OPEN + 0.3), ease: 'power2.inOut' }, T_OPEN + 0.3);
    // the payoff: blur swap on one stage
    tl.to('#w-vs', { opacity: 0, filter: 'blur(8px)', duration: 0.15, ease: 'power2.in' }, T_SAME - 0.15);
    tl.fromTo('#w-sim', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out', immediateRender: true }, T_SAME);
    tl.fromTo('#w-ref', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.4, ease: 'power3.out' }, T_SAME);
    tl.fromTo('#w-reflabel', { opacity: 0 }, { opacity: 1, duration: 0.2, ease: 'power2.out', immediateRender: true }, T_SAME + 0.15);

    // dip before the light switch to the end card
    tl.to('#w-cam2', { opacity: 0.4, duration: 0.1, ease: 'power2.in' }, 4.48);

    window.__timelines["world"] = tl;
  </script>
</template>
