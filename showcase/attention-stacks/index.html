<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("assets/fonts/geist.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("assets/fonts/geist-mono.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        --void: #07080a;
        --ink: #eef1f5;
        --dim: #8b919c;
        --red: #ff453a;
        --green: #32d74b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--void);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--void);
        font-family: "Geist", sans-serif;
        color: var(--ink);
      }
      .abs {
        position: absolute;
        left: 0;
        top: 0;
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 470px 900px;
      }
      /* a browser tab as frosted glass */
      .pane {
        position: absolute;
        left: 0;
        top: 0;
        width: 560px;
        height: 352px;
        border-radius: 26px;
        transform-origin: 0 0;
        background: linear-gradient(160deg, rgba(58, 60, 68, 0.26), rgba(16, 17, 21, 0.55) 55%, rgba(10, 10, 13, 0.64));
        backdrop-filter: blur(10px) saturate(130%);
        box-shadow:
          inset 0 1.5px 0 rgba(255, 255, 255, 0.24),
          inset 0 0 0 1.5px rgba(255, 255, 255, 0.1),
          0 40px 90px rgba(0, 0, 0, 0.6),
          0 0 70px rgba(255, 69, 58, 0.2);
        overflow: hidden;
        will-change: transform, filter, opacity;
      }
      .pane .bar {
        position: absolute;
        left: 18px;
        top: 16px;
        height: 44px;
        width: 330px;
        border-radius: 14px 14px 4px 4px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .pane .fav {
        position: absolute;
        left: 14px;
        top: 14px;
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: rgba(238, 241, 245, 0.35);
      }
      .pane .ttl {
        position: absolute;
        left: 38px;
        top: 9px;
        font: 500 21px/26px "Geist", sans-serif;
        color: rgba(238, 241, 245, 0.88);
        letter-spacing: -0.01em;
        white-space: nowrap;
      }
      .pane .spin {
        position: absolute;
        right: 40px;
        top: 12px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2.5px solid rgba(255, 69, 58, 0.18);
        border-top-color: var(--red);
        box-shadow: 0 0 12px rgba(255, 69, 58, 0.55);
      }
      .pane .x {
        position: absolute;
        right: 12px;
        top: 8px;
        font: 400 22px/26px "Geist", sans-serif;
        color: rgba(238, 241, 245, 0.4);
      }
      .pane .plus {
        position: absolute;
        left: 362px;
        top: 24px;
        font: 300 28px/28px "Geist", sans-serif;
        color: rgba(238, 241, 245, 0.35);
      }
      .pane .load {
        position: absolute;
        left: 0;
        top: 0;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, rgba(255, 69, 58, 0), #ff6a60 40%, #ffd2cc 70%, rgba(255, 69, 58, 0));
        box-shadow: 0 0 18px 2px rgba(255, 69, 58, 0.8);
      }
      .pane .addr {
        position: absolute;
        left: 18px;
        top: 74px;
        width: 524px;
        height: 34px;
        border-radius: 17px;
        background: rgba(255, 255, 255, 0.05);
      }
      .pane .ln {
        position: absolute;
        left: 34px;
        height: 12px;
        border-radius: 6px;
        background: rgba(238, 241, 245, 0.1);
      }
      .pane .prog {
        position: absolute;
        left: 34px;
        bottom: 34px;
        width: 492px;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.07);
      }
      .pane .prog i {
        position: absolute;
        left: 0;
        top: 0;
        height: 6px;
        border-radius: 3px;
        background: var(--red);
        box-shadow: 0 0 14px rgba(255, 69, 58, 0.7);
      }
      .pane .pct {
        position: absolute;
        right: 34px;
        bottom: 50px;
        font: 500 18px/20px "Geist Mono", monospace;
        color: rgba(255, 69, 58, 0.85);
      }
      .pane.new {
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.2),
          inset 0 0 0 1.5px rgba(255, 120, 110, 0.35),
          0 40px 90px rgba(0, 0, 0, 0.55),
          0 0 120px rgba(255, 69, 58, 0.6);
      }
      .hd {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        will-change: transform, filter, opacity;
      }
      .hl {
        display: block;
        font-family: "Geist", sans-serif;
        font-weight: 620;
        line-height: 1.04;
        letter-spacing: -0.035em;
        white-space: nowrap;
        will-change: transform, filter, opacity;
      }
      .hl.dim {
        color: rgba(238, 241, 245, 0.62);
        font-weight: 520;
        letter-spacing: -0.02em;
      }
      .hl .n,
      .hl .r {
        color: var(--red);
        font-variant-numeric: tabular-nums;
        text-shadow:
          0 0 28px rgba(255, 69, 58, 0.75),
          0 0 80px rgba(255, 69, 58, 0.45);
      }
      .hl .g {
        color: rgba(238, 241, 245, 0.42);
      }
      .frag {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        font-family: "Geist", sans-serif;
        font-weight: 640;
        line-height: 1;
        letter-spacing: -0.04em;
        white-space: nowrap;
        color: var(--ink);
        text-shadow: 0 0 40px rgba(238, 241, 245, 0.18);
        will-change: transform, filter, opacity;
      }
      .pane .ok {
        position: absolute;
        right: 36px;
        top: 9px;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 18px rgba(50, 215, 75, 0.8);
        opacity: 0;
      }
      .pane .ok::after {
        content: "";
        position: absolute;
        left: 8px;
        top: 5px;
        width: 7px;
        height: 12px;
        border-right: 3px solid #07080a;
        border-bottom: 3px solid #07080a;
        transform: rotate(40deg);
      }
      .pane .ghost {
        position: absolute;
        left: 352px;
        top: 16px;
        width: 150px;
        height: 44px;
        border-radius: 14px 14px 4px 4px;
        border: 1.5px dashed rgba(255, 69, 58, 0.7);
        background: rgba(255, 69, 58, 0.08);
        opacity: 0;
      }
      .en3 {
        display: block;
        margin-top: 0.55em;
      }
      .en3 .lab {
        font: 500 1em/1 "Geist Mono", monospace;
        letter-spacing: 0.12em;
        color: var(--dim);
      }
      .en3 .val {
        font: 560 3.1em/1 "Geist Mono", monospace;
        letter-spacing: -0.04em;
        color: var(--red);
        text-shadow: 0 0 30px rgba(255, 69, 58, 0.6);
        font-variant-numeric: tabular-nums;
      }
      .en3 .trk {
        position: relative;
        margin-top: 0.5em;
        width: 21em;
        height: 0.36em;
        border-radius: 0.18em;
        background: rgba(255, 255, 255, 0.08);
      }
      .en3 .fill {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 100%;
        border-radius: 0.18em;
        background: var(--red);
        box-shadow: 0 0 1.2em rgba(255, 69, 58, 0.8);
        transform-origin: 0 50%;
      }
      #en {
        position: absolute;
        left: 132px;
        top: 418px;
        font: 500 28px/1 "Geist Mono", monospace;
        letter-spacing: 0.08em;
        color: var(--dim);
        white-space: nowrap;
        opacity: 0;
      }
      #en .mini {
        display: inline-block;
        position: relative;
        width: 150px;
        height: 8px;
        margin: 0 14px 0 10px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.1);
        vertical-align: 4px;
      }
      #en .mini i {
        position: absolute;
        left: 0;
        top: 0;
        height: 8px;
        width: 150px;
        border-radius: 4px;
        transform-origin: 0 50%;
      }
      #sys {
        position: absolute;
        left: 132px;
        top: 372px;
        font: 500 28px/1 "Geist Mono", monospace;
        letter-spacing: 0.08em;
        color: var(--dim);
        white-space: nowrap;
      }
      #sys b {
        font-weight: 500;
        color: var(--red);
        text-shadow: 0 0 16px rgba(255, 69, 58, 0.7);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920" data-layout-allow-overlap data-layout-allow-overflow>
      <!-- light: soft red haze deep in the field -->
      <div class="abs" data-layout-ignore style="width: 1080px; height: 1920px; background: radial-gradient(60% 34% at 62% 40%, rgba(255, 69, 58, 0.13), rgba(255, 69, 58, 0) 70%), radial-gradient(70% 40% at 20% 85%, rgba(120, 40, 36, 0.12), rgba(0, 0, 0, 0) 70%)"></div>
      <div id="world" data-layout-ignore></div>
      <div id="sys"><b id="sysDot">●</b> <span id="sysTx">OPEN TABS</span> <span id="sysN">41</span></div>
      <div id="en">ENERGY<span class="mini"><i id="enBar"></i></span><span id="enV">9%</span></div>
      <svg class="abs" width="1080" height="1920" data-layout-ignore style="opacity: 0.075; mix-blend-mode: overlay"><filter id="gr"><feTurbulence id="grT" type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="1" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter><rect width="1080" height="1920" filter="url(#gr)" /></svg>
      <div class="abs" data-layout-ignore style="width: 1080px; height: 1920px; background: radial-gradient(115% 75% at 44% 47%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.7) 100%)"></div>
    </div>

    <script src="assets/engine.js"></script>
  </body>
</html>
