<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("assets/fonts/geist-var.woff2") format("woff2");
        font-weight: 100 900;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050505;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050505;
        font-family: "Geist", sans-serif;
        color: #f2f2f2;
      }
      .layer {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      #flashW {
        background: #f2f2f2;
        opacity: 0;
        z-index: 1;
      }
      #lineW {
        z-index: 2;
      }
      #line {
        position: absolute;
        left: 0;
        top: 920px;
        height: 80px;
        white-space: nowrap;
        font-size: 58px;
        line-height: 80px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .u {
        display: inline-block;
        white-space: pre;
        opacity: 0;
      }
      #wordW,
      #keyW {
        z-index: 3;
      }
      .solo {
        position: absolute;
        left: 0;
        width: 1080px;
        top: 900px;
        height: 120px;
        text-align: center;
        font-size: 84px;
        line-height: 120px;
        font-weight: 700;
        letter-spacing: -0.02em;
        opacity: 0;
      }
      #key {
        color: #ff5a4a;
        text-shadow: 0 0 40px rgba(255, 90, 74, 0.45);
      }
      #glitch {
        z-index: 5;
        opacity: 0;
        background: #f2f2f2;
      }
      #glitch div {
        position: absolute;
        left: 0;
        width: 1080px;
        top: 900px;
        text-align: center;
        font-size: 84px;
        line-height: 120px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #2fe3b4;
      }
      #logoW {
        z-index: 6;
      }
      #logo {
        position: absolute;
        left: 0;
        width: 1080px;
        top: 900px;
        text-align: center;
        font-size: 82px;
        line-height: 120px;
        font-weight: 700;
        letter-spacing: 0.32em;
        padding-left: 0.32em;
        color: #f2f2f2;
        text-shadow: 0 0 34px rgba(255, 255, 255, 0.55), 0 0 90px rgba(255, 255, 255, 0.25);
        opacity: 0;
      }
      #grain {
        z-index: 9;
        opacity: 0.05;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.4" data-width="1080" data-height="1920">
      <svg width="0" height="0" style="position: absolute">
        <filter id="hb" x="-60%" y="-20%" width="220%" height="140%"><feGaussianBlur id="hbg" stdDeviation="0 0" /></filter>
        <filter id="vb" x="-5%" y="-200%" width="110%" height="500%"><feGaussianBlur id="vbg" stdDeviation="0 0" /></filter>
      </svg>
      <div id="flashW" class="layer" data-layout-ignore></div>
      <div id="lineW" class="layer" data-layout-allow-overlap>
        <div id="line"></div>
      </div>
      <div id="wordW" class="layer"><div id="word" class="solo">Save</div></div>
      <div id="keyW" class="layer"><div id="key" class="solo">yourself.</div></div>
      <div id="glitch" class="layer" data-layout-ignore><div>yourself.</div></div>
      <div id="logoW" class="layer"><div id="logo">GAINS DOM</div></div>
      <div id="grain" class="layer" data-layout-ignore></div>
    </div>

    <script>
      // Frame-matched to the owner's reference 3 (17.35–21.75 s): every time below
      // is a reference frame number at 30 fps (F(n) = n / 30).
      const F = (n) => n / 30;
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const $ = (id) => document.getElementById(id);
      function proxy(init, onSet) {
        const o = {};
        for (const k of Object.keys(init)) {
          let v = init[k];
          Object.defineProperty(o, k, {
            get() {
              return v;
            },
            set(x) {
              v = x;
              onSet(o, k);
            },
            enumerable: true,
          });
        }
        return o;
      }
      const tl = gsap.timeline({ paused: true });
      const NI = { immediateRender: false };

      // ---------- the line: letters of "Nobody is coming", then words "to save you." ----------
      const line = $("line");
      const LETTERS = "Nobody is coming";
      const WORDS = [" to", " save", " you."];
      const units = [];
      [...LETTERS].forEach((c) => units.push({ t: c, kind: "l" }));
      WORDS.forEach((w) => units.push({ t: w, kind: "w" }));
      units.forEach((u) => {
        const s = document.createElement("span");
        s.className = "u";
        s.textContent = u.t;
        line.appendChild(s);
        u.el = s;
        u.w = 0;
        u.p = proxy({ e: 0 }, layout);
      });
      const TR = proxy({ k: 1 }, layout); // tracking: 1 = wide, 0 = normal
      const TRACK = 22; // px added between letters at the start (frames 8–15 look "L e t")
      function layout() {
        if (!units[0].w) units.forEach((u) => (u.w = u.el.getBoundingClientRect().width));
        let x = 0;
        const nL = LETTERS.length;
        units.forEach((u, i) => {
          const e = clamp(u.p.e, 0, 1);
          let dx = 0;
          let dy = 0;
          let sc = 1;
          if (u.kind === "l") {
            dx = i * TRACK * TR.k + (1 - e) * 16;
            u.el.style.filter = e > 0.99 ? "none" : `blur(${((1 - e) * 7).toFixed(2)}px)`;
          } else {
            // words slide in from the lower right, small and soft, like "your ideas"
            dx = nL * TRACK * TR.k + (1 - e) * 46;
            dy = (1 - e) * 26;
            sc = 0.78 + 0.22 * e;
            u.el.style.filter = e > 0.99 ? "none" : `blur(${((1 - e) * 9).toFixed(2)}px)`;
          }
          u.el.style.opacity = e.toFixed(3);
          u.el.style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px) scale(${sc.toFixed(3)})`;
          x += u.w * (u.kind === "l" ? 1 : e);
        });
        // keep the visible phrase centred as it grows
        const spread = (LETTERS.length - 1) * TRACK * TR.k;
        line.style.left = (540 - (x + spread) / 2).toFixed(2) + "px";
      }

      // 4–7: white flash fades out
      tl.fromTo("#flashW", { opacity: 0.85 }, { opacity: 0, duration: F(4), ease: "power2.out", ...NI }, F(3));
      // 8–22: letters arrive ~1 per frame, tracking tightens
      units.forEach((u, i) => {
        if (u.kind !== "l") return;
        tl.fromTo(u.p, { e: 0 }, { e: 1, duration: F(6), ease: "power2.out", ...NI }, F(8 + i * 0.85));
      });
      tl.fromTo(TR, { k: 1 }, { k: 0, duration: F(14), ease: "expo.out", ...NI }, F(8));
      // 27–35: words enter from the lower right
      [27, 29.5, 32].forEach((f, i) => {
        tl.fromTo(units[LETTERS.length + i].p, { e: 0 }, { e: 1, duration: F(8), ease: "expo.out", ...NI }, F(f));
      });
      // 36–43: hold with a slow drift
      tl.to("#line", { x: -10, duration: F(8), ease: "none" }, F(36));
      // 44–56: the whole line smears out to the left
      const HB = proxy({ s: 0 }, (o) => {
        $("hbg").setAttribute("stdDeviation", `${o.s.toFixed(1)} 0`);
        $("lineW").style.filter = o.s > 0.3 ? "url(#hb)" : "none";
      });
      tl.to("#line", { x: -520, duration: F(14), ease: "power2.in" }, F(44));
      tl.to(HB, { s: 28, duration: F(6), ease: "power1.in" }, F(44));
      tl.to("#line", { opacity: 0, duration: F(8), ease: "power1.in" }, F(50));
      // 48–56: "Save" comes in from the right, bold, alone
      tl.fromTo("#word", { opacity: 0, x: 300, filter: "blur(16px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: F(8), ease: "expo.out", ...NI }, F(48));
      // 68–75: scramble from "Save" into "yourself." (accent from frame 71)
      const CH = "abcdefghijklmnopqrstuvwxyz";
      const FROM = "Save";
      const TO = "yourself.";
      const SC = proxy({ k: 0 }, (o) => {
        const n = Math.round(30 * o.k);
        const len = Math.round(FROM.length + (TO.length - FROM.length) * o.k);
        let s = "";
        for (let i = 0; i < len; i++) {
          const settled = o.k >= 1 || i < Math.floor(o.k * TO.length * 0.6);
          s += settled ? TO[i] : CH[(i * 7 + n * 13 + 3) % 26];
        }
        $("word").textContent = o.k <= 0 ? FROM : s;
        $("word").style.color = o.k >= 0.4 ? "#ff5a4a" : "#f2f2f2";
      });
      tl.fromTo(SC, { k: 0 }, { k: 1, duration: F(8), ease: "none", ...NI }, F(68));
      tl.set("#word", { opacity: 0 }, F(76));
      tl.set("#key", { opacity: 1 }, F(76));
      tl.fromTo("#key", { scale: 1.02 }, { scale: 1, duration: F(24), ease: "power1.out", ...NI }, F(76));
      // 101: one inverted glitch frame, 102 white, 103 grey, 104 black
      tl.set("#glitch", { opacity: 1 }, F(101));
      tl.set("#key", { opacity: 0 }, F(101));
      tl.set("#glitch div", { opacity: 0 }, F(102));
      tl.set("#glitch", { backgroundColor: "#8a8a8a" }, F(103));
      tl.set("#glitch", { opacity: 0 }, F(104));
      // 105–118: the logo drops in with a vertical smear and settles with a glow
      const VB = proxy({ s: 0 }, (o) => {
        $("vbg").setAttribute("stdDeviation", `0 ${o.s.toFixed(1)}`);
        $("logoW").style.filter = o.s > 0.3 ? "url(#vb)" : "none";
      });
      tl.set("#logo", { opacity: 1 }, F(105));
      tl.fromTo("#logo", { y: -150 }, { y: 0, duration: F(12), ease: "expo.out", ...NI }, F(105));
      tl.fromTo(VB, { s: 22 }, { s: 0, duration: F(9), ease: "power2.out", ...NI }, F(105));
      tl.fromTo("#logo", { textShadow: "0 0 60px rgba(255,255,255,0.9), 0 0 140px rgba(255,255,255,0.5)" }, { textShadow: "0 0 34px rgba(255,255,255,0.55), 0 0 90px rgba(255,255,255,0.25)", duration: F(14), ease: "power2.out", ...NI }, F(106));

      layout();
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
