<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/lib/three.module.js", "three/addons/": "./assets/lib/addons/" } }
    </script>
    <style>
      @font-face {
        font-family: "Big Shoulders";
        src: url("assets/fonts/big-shoulders.woff2") format("woff2");
        font-weight: 700 900;
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/manrope.woff2") format("woff2");
        font-weight: 500 800;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050405;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050405;
        color: #f3efe8;
      }
      canvas#gl {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      #copy {
        position: absolute;
        left: 120px;
        top: 300px;
        width: 720px;
      }
      .kick {
        display: block;
        font: 700 28px/1 "Manrope", sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(243, 239, 232, 0.6);
        margin-bottom: 22px;
        will-change: opacity, transform;
      }
      .kick b {
        color: #ff3a2a;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .big {
        display: block;
        font: 900 104px/0.92 "Big Shoulders", sans-serif;
        text-transform: uppercase;
        text-shadow: 0 10px 50px rgba(0, 0, 0, 0.7);
        will-change: transform, filter, opacity;
        white-space: nowrap;
      }
      .red {
        color: #ff3a2a;
        text-shadow:
          0 0 30px rgba(255, 58, 42, 0.55),
          0 10px 50px rgba(0, 0, 0, 0.7);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920" data-layout-allow-overlap>
      <canvas id="gl" width="1080" height="1920" data-layout-ignore></canvas>
      <div id="copy">
        <span class="kick" id="kick"><b id="cnt">41</b> unfinished tasks</span>
        <span class="big" id="l1">You’re not tired.</span>
        <span class="big red" id="l2">You’re tied down.</span>
      </div>
      <svg width="1080" height="1920" data-layout-ignore style="position: absolute; left: 0; top: 0; opacity: 0.09; mix-blend-mode: overlay"><filter id="gr"><feTurbulence id="grT" type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="9" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter><rect width="1080" height="1920" filter="url(#gr)" /></svg>
      <div data-layout-ignore style="position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: radial-gradient(115% 70% at 50% 58%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.75) 100%)"></div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      await Promise.all([document.fonts.load('900 124px "Big Shoulders"'), document.fonts.load('700 28px "Manrope"'), document.fonts.load('800 64px "Manrope"')]);
      const loadImg = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
      const [IMG_SET, IMG_BG, IMG_MATTE] = await Promise.all([loadImg("assets/img/athlete-set.png"), loadImg("assets/img/stands.jpg"), loadImg("assets/img/athlete-set-matte.png")]);

      const W = 1080;
      const H = 1920;
      const FPS = 30;
      const DUR = 3;
      const V = THREE.Vector3;
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const lerp = (a, b, k) => a + (b - a) * k;
      const eo = (x) => 1 - Math.pow(1 - x, 4);
      const c3 = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      function mulberry(a) {
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      // a rope snapping taut: damped spring, 1 = slack, 0 = taut
      const spring = (u) => (u <= 0 ? 1 : Math.exp(-u * 7.5) * Math.cos(u * 26));

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050405);
      scene.fog = new THREE.FogExp2(0x050405, 0.035);
      const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);
      const tagScene = new THREE.Scene(); // task tags: drawn after depth of field so they stay readable
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.25;
      scene.add(new THREE.HemisphereLight(0x302a28, 0x050405, 0.5));
      const key = new THREE.DirectionalLight(0xffe7cf, 2.6);
      key.position.set(-6, 9, 8);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xff3a2a, 5.5);
      rim.position.set(4, 2, -9);
      scene.add(rim);
      const rim2 = new THREE.PointLight(0xff3a2a, 60, 18, 2);
      rim2.position.set(0, -1, -3);
      scene.add(rim2);

      // ---------- images ----------
      function graded(img, { contrast = 1.25, bright = 1.0, blur = 0 } = {}) {
        const c = document.createElement("canvas");
        c.width = img.width;
        c.height = img.height;
        const g = c.getContext("2d");
        g.filter = `grayscale(1) contrast(${contrast}) brightness(${bright})${blur ? ` blur(${blur}px)` : ""}`;
        g.drawImage(img, 0, 0);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }
      function silhouetteGlow(img, blur, color) {
        const c = document.createElement("canvas");
        const pad = blur * 3;
        c.width = img.width + pad * 2;
        c.height = img.height + pad * 2;
        const g = c.getContext("2d");
        g.filter = `blur(${blur}px)`;
        g.drawImage(img, pad, pad);
        g.globalCompositeOperation = "source-in";
        g.filter = "none";
        g.fillStyle = color;
        g.fillRect(0, 0, c.width, c.height);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }
      const bg = new THREE.Mesh(new THREE.PlaneGeometry(46, 46 * (IMG_BG.height / IMG_BG.width)), new THREE.MeshBasicMaterial({ map: graded(IMG_BG, { contrast: 1.1, bright: 0.45, blur: 6 }), color: new THREE.Color(0.55, 0.5, 0.5), fog: false }));
      bg.position.set(0, 2.5, -22);
      scene.add(bg);

      const AH = 6.3;
      const AW = AH * (IMG_SET.width / IMG_SET.height);
      const athlete = new THREE.Group();
      const body = new THREE.Mesh(new THREE.PlaneGeometry(AW, AH), new THREE.MeshBasicMaterial({ map: graded(IMG_SET), alphaTest: 0.12 }));
      const gt = silhouetteGlow(IMG_SET, 14, "#ff2a1a");
      const glowMat = new THREE.MeshBasicMaterial({ map: gt, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, color: new THREE.Color(1.6, 1.6, 1.6), opacity: 0.55 });
      const glow = new THREE.Mesh(new THREE.PlaneGeometry(AW * (gt.image.width / IMG_SET.width), AH * (gt.image.height / IMG_SET.height)), glowMat);
      glow.position.set(0.04, 0.02, -0.08);
      // closed silhouette matte: gaps inside her outline stay dark, the red rim only shows outside
      const mt = new THREE.CanvasTexture(IMG_MATTE);
      const matte = new THREE.Mesh(new THREE.PlaneGeometry(AW, AH), new THREE.MeshBasicMaterial({ map: mt, transparent: true, depthWrite: false, color: 0x060506 }));
      matte.position.z = -0.04;
      athlete.add(glow, matte, body);
      const A0 = new V(0, -2.2, 0);
      athlete.position.copy(A0);
      scene.add(athlete);
      const onBody = (px, py, dz) => new V((px / IMG_SET.width - 0.5) * AW, (0.5 - py / IMG_SET.height) * AH, dz).add(athlete.position);

      // ---------- ropes ----------
      const braid = (() => {
        const c = document.createElement("canvas");
        c.width = 64;
        c.height = 256;
        const g = c.getContext("2d");
        for (let y = -64; y < 320; y += 16) {
          const grd = g.createLinearGradient(0, y, 64, y + 32);
          grd.addColorStop(0, "#1a0606");
          grd.addColorStop(0.5, "#b0362a");
          grd.addColorStop(1, "#1a0606");
          g.fillStyle = grd;
          g.beginPath();
          g.moveTo(0, y);
          g.lineTo(64, y + 32);
          g.lineTo(64, y + 44);
          g.lineTo(0, y + 12);
          g.fill();
        }
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      })();
      const PTS = { head: [580, 470], shL: [400, 520], shR: [745, 530], back: [580, 640], hip: [560, 780], elL: [300, 860], elR: [860, 880], hdL: [190, 1190], hdR: [1010, 1210], knee: [660, 930], foot: [705, 1150] };
      const KEYS = Object.keys(PTS);
      const TASKS = ["the email", "diet starts monday", "call back", "that project", "taxes", "the course", "reply later", "fix the car", "the essay", "gym plan", "book dentist", "pay rent"];
      const rnd = mulberry(11);
      const ropes = [];
      // 41 already tied (ten of them still snapping tight in the first second), six more shoot in: 41 -> 47
      const NEW = [0.35, 0.58, 0.8, 1.0, 1.18, 1.34];
      for (let i = 0; i < 47; i++) {
        const k = KEYS[i % KEYS.length];
        const px = PTS[k][0] + (rnd() - 0.5) * 40;
        const py = PTS[k][1] + (rnd() - 0.5) * 40;
        const dz = 0.1 + rnd() * 0.15;
        const a = rnd() * Math.PI * 2;
        const toward = i % 6 === 0;
        const A = toward ? new V(Math.cos(a) * (2.2 + rnd() * 1.5), Math.sin(a) * 3 - 0.5, 9 + rnd() * 3) : new V(Math.cos(a) * (8 + rnd() * 7), Math.sin(a) * (7 + rnd() * 6) - 1, -4 - rnd() * 14);
        const isNew = i >= 41;
        const tightAt = isNew ? NEW[i - 41] + 0.12 : i % 4 === 1 ? 0.05 + (i / 41) * 0.9 : -9;
        const sagBase = 0.4 + rnd();
        const mat = new THREE.MeshStandardMaterial({ map: braid, color: 0x9a2a20, roughness: 0.75, metalness: 0.05, bumpMap: braid, bumpScale: 0.6 });
        const mesh = new THREE.Mesh(new THREE.BufferGeometry(), mat);
        scene.add(mesh);
        ropes.push({ px, py, dz, A, r: 0.035 + rnd() * 0.025, sagBase, isNew, shootAt: isNew ? NEW[i - 41] : -9, tightAt, mesh, toward });
      }
      // tags ride their ropes; never in the headline's zone (they're placed low on the frame)
      function makeTag(text) {
        const c = document.createElement("canvas");
        c.width = 700;
        c.height = 150;
        const g = c.getContext("2d");
        g.font = '800 64px "Manrope"';
        const tw = Math.min(640, g.measureText(text).width + 70);
        g.fillStyle = "rgba(12,10,10,0.92)";
        g.strokeStyle = "#ff3a2a";
        g.lineWidth = 5;
        g.beginPath();
        g.roundRect((700 - tw) / 2, 22, tw, 106, 18);
        g.fill();
        g.stroke();
        g.fillStyle = "#f3efe8";
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillText(text, 350, 77);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        const m = new THREE.Mesh(new THREE.PlaneGeometry(0.34 * 4.67, 0.34), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthTest: false, toneMapped: false }));
        m.renderOrder = 10;
        tagScene.add(m);
        return m;
      }
      let ti = 0;
      ropes.forEach((r, i) => {
        if (!r.toward && i % 3 === 0 && ti < TASKS.length && r.A.y < 4) r.tag = makeTag(TASKS[ti++]);
      });

      // ---------- camera: a slow push and drift, real parallax through the ropes ----------
      function camAt(t) {
        const u = c3(seg(t, 0, 3.6)); // still travelling at the end of the 3 s
        return { p: new V(lerp(-2.0, 0.9, u), lerp(0.9, -0.1, u), lerp(16.8, 12.4, u)), q: new V(lerp(-0.35, 0.1, u), lerp(-0.45, -0.8, u), 0) };
      }

      // ---------- post ----------
      const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType }));
      composer.setPixelRatio(1);
      composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      const bokeh = new BokehPass(scene, camera, { focus: 13.8, aperture: 0.0026, maxblur: 0.012 });
      composer.addPass(bokeh);
      const tagPass = new RenderPass(tagScene, camera);
      tagPass.clear = false;
      composer.addPass(tagPass);
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.7, 0.5, 0.8));
      composer.addPass(new OutputPass());

      const $ = (id) => document.getElementById(id);
      function render(t) {
        const f = Math.round(t * FPS);
        const c = camAt(t);
        camera.position.copy(c.p);
        camera.lookAt(c.q);
        // every rope that snaps tight jolts the athlete and flares the red rim
        let jx = 0;
        let jy = 0;
        let flare = 0;
        ropes.forEach((r, i) => {
          const u = t - r.tightAt;
          if (u > 0 && u < 0.6) {
            const e = Math.exp(-u * 10) * Math.sin(u * 46);
            jx += e * 0.018 * Math.sign(r.A.x);
            jy += e * 0.012;
            flare += Math.exp(-u * 8) * (r.isNew ? 1 : 0.4);
          }
        });
        athlete.position.set(A0.x + jx, A0.y + jy, A0.z);
        glowMat.opacity = 0.5 + 0.3 * Math.min(1, flare);
        rim2.intensity = 60 + 90 * Math.min(1, flare);
        // ropes
        let n = 41;
        ropes.forEach((r) => {
          const P = onBody(r.px, r.py, r.dz);
          let far = r.A.clone();
          if (r.isNew) {
            if (t < r.shootAt) {
              r.mesh.visible = false;
              if (r.tag) r.tag.visible = false;
              return;
            }
            n++;
            // the rope whips in from its anchor and bites onto the body
            const s = eo(seg(t, r.shootAt, r.shootAt + 0.12));
            far = r.A.clone();
            const near = r.A.clone().lerp(P, s);
            r.mesh.visible = true;
            buildRope(r, near, far, s < 1 ? 0.2 : r.sagBase * (0.25 + 2.8 * Math.max(0, spring(t - r.tightAt))) + 0.25 * spring(t - r.tightAt));
            return;
          }
          const sl = r.tightAt < 0 ? 0 : spring(t - r.tightAt);
          buildRope(r, P, far, r.sagBase * (0.25 + 2.8 * Math.max(0, sl)) + 0.25 * sl);
        });
        $("cnt").textContent = String(n);
        // depth of field: rack from the near ropes onto the athlete
        bokeh.uniforms.focus.value = lerp(9.5, c.p.distanceTo(new V(0, -1.2, 0)), c3(seg(t, 0.05, 0.6)));
        // type: line 1 is there from frame 0 and settles; line 2 is yanked in on the last snap
        const u1 = eo(seg(t, 0, 0.55));
        $("l1").style.transform = `scale(${lerp(1.0, 1, u1).toFixed(4)}) translateY(${((1 - u1) * 14).toFixed(2)}px)`;
        $("l1").style.transformOrigin = "0 50%";
        $("l1").style.letterSpacing = `${lerp(0.015, 0, u1).toFixed(4)}em`;
        $("l1").style.filter = u1 < 0.98 ? `blur(${((1 - u1) * 6).toFixed(2)}px)` : "none";
        const t2 = t - 1.46;
        const u2 = eo(seg(t, 1.46, 1.62));
        const wob = t2 > 0.16 ? Math.exp(-(t2 - 0.16) * 9) * Math.sin((t2 - 0.16) * 40) * 18 : 0;
        $("l2").style.opacity = u2.toFixed(3);
        $("l2").style.transform = `translateX(${((1 - u2) * 220 + wob).toFixed(2)}px)`;
        $("l2").style.filter = u2 < 0.98 ? `blur(${((1 - u2) * 14).toFixed(2)}px)` : "none";
        $("kick").style.opacity = eo(seg(t, 0.1, 0.5)).toFixed(3);
        $("grT").setAttribute("seed", String((f % 24) + 1));
        composer.render();
      }
      function buildRope(r, P, A, sag) {
        const mid = new V().addVectors(P, A).multiplyScalar(0.5);
        mid.y -= sag * P.distanceTo(A) * 0.06;
        const curve = new THREE.QuadraticBezierCurve3(P, mid, A);
        r.mesh.geometry.dispose();
        r.mesh.geometry = new THREE.TubeGeometry(curve, 48, r.r, 8, false);
        r.mesh.material.map.repeat.set(1, 18);
        if (r.tag) {
          r.tag.visible = true;
          r.tag.position.copy(curve.getPoint(0.26));
          r.tag.lookAt(camera.position);
        }
      }

      const tl = gsap.timeline({ paused: true });
      const DR = { _t: 0 };
      Object.defineProperty(DR, "t", {
        get() {
          return this._t;
        },
        set(v) {
          this._t = v;
          render(v);
        },
      });
      tl.fromTo(DR, { t: 0 }, { t: DUR, duration: DUR, ease: "none", immediateRender: false }, 0);
      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
