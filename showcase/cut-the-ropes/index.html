<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/lib/three.module.js", "three/addons/": "./assets/lib/addons/" } }
    </script>
    <style>
      @font-face {
        font-family: "Big Shoulders";
        src: url("assets/fonts/big-shoulders.woff2") format("woff2");
        font-weight: 700 900;
      }
      @font-face {
        font-family: "Manrope";
        src: url("assets/fonts/manrope.woff2") format("woff2");
        font-weight: 500 800;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050405;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050405;
        color: #f3efe8;
      }
      canvas#gl {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      .blk {
        position: absolute;
        left: 120px;
        top: 300px;
        width: 720px;
        visibility: hidden;
      }
      .mid {
        display: block;
        font: 900 72px/0.96 "Big Shoulders", sans-serif;
        text-transform: uppercase;
        white-space: nowrap;
        margin-bottom: 8px;
        text-shadow: 0 10px 50px rgba(0, 0, 0, 0.7);
      }
      .en {
        display: block;
        margin-top: 34px;
        width: 520px;
      }
      .enl {
        display: block;
        font: 700 28px/1 "Manrope", sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(243, 239, 232, 0.6);
        margin-bottom: 14px;
      }
      .enl b {
        color: #ff3a2a;
        font-variant-numeric: tabular-nums;
      }
      .trk {
        display: block;
        position: relative;
        height: 10px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.1);
      }
      .trk i {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 10px;
        border-radius: 5px;
        background: #ff3a2a;
        box-shadow: 0 0 18px rgba(255, 58, 42, 0.8);
        transform-origin: 0 50%;
      }
      .sign {
        display: block;
        margin-top: 34px;
        font: 800 28px/1 "Manrope", sans-serif;
        letter-spacing: 0.5em;
        color: rgba(243, 239, 232, 0.7);
      }
      #slash {
        position: absolute;
        left: 0;
        top: 0;
        width: 2600px;
        height: 150px;
        background: linear-gradient(180deg, rgba(255, 58, 42, 0), rgba(255, 58, 42, 0.85) 38%, #fff 50%, rgba(255, 58, 42, 0.85) 62%, rgba(255, 58, 42, 0));
        filter: blur(6px);
        box-shadow: 0 0 120px 40px rgba(255, 58, 42, 0.5);
        transform-origin: 0 50%;
        visibility: hidden;
        mix-blend-mode: screen;
      }
      #flash {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
      .kick {
        display: block;
        font: 700 28px/1 "Manrope", sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(243, 239, 232, 0.6);
        margin-bottom: 22px;
        will-change: opacity, transform;
      }
      .kick b {
        color: #ff3a2a;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .big {
        display: block;
        font: 900 104px/0.92 "Big Shoulders", sans-serif;
        text-transform: uppercase;
        text-shadow: 0 10px 50px rgba(0, 0, 0, 0.7);
        will-change: transform, filter, opacity;
        white-space: nowrap;
      }
      .red {
        color: #ff3a2a;
        text-shadow:
          0 0 30px rgba(255, 58, 42, 0.55),
          0 10px 50px rgba(0, 0, 0, 0.7);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1080" data-height="1920" data-layout-allow-overlap>
      <canvas id="gl" width="1080" height="1920" data-layout-ignore></canvas>
      <div class="blk" id="t1">
        <span class="kick" id="kick"><b id="cnt">41</b> unfinished tasks</span>
        <span class="big" id="l1">You’re not tired.</span>
        <span class="big red" id="l2">You’re tied down.</span>
      </div>
      <div class="blk" id="t2">
        <span class="mid" id="t2a">Every unfinished task</span>
        <span class="big red" id="t2b">keeps pulling.</span>
      </div>
      <div class="blk" id="t3">
        <span class="mid" id="t3a">That’s why you’re tired</span>
        <span class="big red" id="t3b">after doing</span>
        <span class="big red" id="t3c">nothing.</span>
        <span class="en" id="t3e"><span class="enl">Energy <b id="e3v">100%</b></span><span class="trk"><i id="e3f"></i></span></span>
      </div>
      <div class="blk" id="t4">
        <span class="kick"><b id="cnt4">47</b> left</span>
        <span class="big" id="t4a">Finish one.</span>
        <span class="big red" id="t4b">Cut it loose.</span>
      </div>
      <div class="blk" id="t5">
        <span class="kick"><b>0</b> holding you back</span>
        <span class="big" id="t5a">Cut one rope</span>
        <span class="big red" id="t5b">at a time.</span>
        <span class="sign" id="t5c">GAINS DOM</span>
      </div>
      <div id="slash" data-layout-ignore></div>
      <div id="flash" data-layout-ignore></div>
      <svg width="1080" height="1920" data-layout-ignore style="position: absolute; left: 0; top: 0; opacity: 0.09; mix-blend-mode: overlay"><filter id="gr"><feTurbulence id="grT" type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="9" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /></filter><rect width="1080" height="1920" filter="url(#gr)" /></svg>
      <div data-layout-ignore style="position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; background: radial-gradient(115% 70% at 50% 58%, rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.75) 100%)"></div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
      import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

      await Promise.all([document.fonts.load('900 124px "Big Shoulders"'), document.fonts.load('700 28px "Manrope"'), document.fonts.load('800 64px "Manrope"')]);
      const loadImg = (src) => new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; });
      const [IMG_SET, IMG_BG, IMG_MATTE, IMG_SPRINT] = await Promise.all([loadImg("assets/img/athlete-set.png"), loadImg("assets/img/stands.jpg"), loadImg("assets/img/athlete-set-matte.png"), loadImg("assets/img/athlete-sprint.png")]);

      const W = 1080;
      const H = 1920;
      const FPS = 30;
      const DUR = 18;
      const V = THREE.Vector3;
      const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      const lerp = (a, b, k) => a + (b - a) * k;
      const eo = (x) => 1 - Math.pow(1 - x, 4);
      const sst = (x) => x * x * x * (x * (x * 6 - 15) + 10);
      const c3 = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      function mulberry(a) {
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      // a rope snapping taut: damped spring, 1 = slack, 0 = taut
      const spring = (u) => (u <= 0 ? 1 : Math.exp(-u * 7.5) * Math.cos(u * 26));

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050405);
      scene.fog = new THREE.FogExp2(0x050405, 0.035);
      const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 200);
      const tagScene = new THREE.Scene(); // task tags: drawn after depth of field so they stay readable
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.25;
      scene.add(new THREE.HemisphereLight(0x302a28, 0x050405, 0.5));
      const key = new THREE.DirectionalLight(0xffe7cf, 2.6);
      key.position.set(-6, 9, 8);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xff3a2a, 5.5);
      rim.position.set(4, 2, -9);
      scene.add(rim);
      const rim2 = new THREE.PointLight(0xff3a2a, 60, 18, 2);
      rim2.position.set(0, -1, -3);
      scene.add(rim2);

      // ---------- images ----------
      function graded(img, { contrast = 1.25, bright = 1.0, blur = 0 } = {}) {
        const c = document.createElement("canvas");
        c.width = img.width;
        c.height = img.height;
        const g = c.getContext("2d");
        g.filter = `grayscale(1) contrast(${contrast}) brightness(${bright})${blur ? ` blur(${blur}px)` : ""}`;
        g.drawImage(img, 0, 0);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }
      function silhouetteGlow(img, blur, color) {
        const c = document.createElement("canvas");
        const pad = blur * 3;
        c.width = img.width + pad * 2;
        c.height = img.height + pad * 2;
        const g = c.getContext("2d");
        g.filter = `blur(${blur}px)`;
        g.drawImage(img, pad, pad);
        g.globalCompositeOperation = "source-in";
        g.filter = "none";
        g.fillStyle = color;
        g.fillRect(0, 0, c.width, c.height);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }
      const bg = new THREE.Mesh(new THREE.PlaneGeometry(46, 46 * (IMG_BG.height / IMG_BG.width)), new THREE.MeshBasicMaterial({ map: graded(IMG_BG, { contrast: 1.1, bright: 0.45, blur: 6 }), color: new THREE.Color(0.55, 0.5, 0.5), fog: false }));
      bg.position.set(0, 2.5, -22);
      scene.add(bg);

      const AH = 6.3;
      const AW = AH * (IMG_SET.width / IMG_SET.height);
      const athlete = new THREE.Group();
      const body = new THREE.Mesh(new THREE.PlaneGeometry(AW, AH), new THREE.MeshBasicMaterial({ map: graded(IMG_SET), alphaTest: 0.12 }));
      const gt = silhouetteGlow(IMG_SET, 14, "#ff2a1a");
      const glowMat = new THREE.MeshBasicMaterial({ map: gt, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, color: new THREE.Color(1.6, 1.6, 1.6), opacity: 0.55 });
      const glow = new THREE.Mesh(new THREE.PlaneGeometry(AW * (gt.image.width / IMG_SET.width), AH * (gt.image.height / IMG_SET.height)), glowMat);
      glow.position.set(0.04, 0.02, -0.08);
      // closed silhouette matte: gaps inside her outline stay dark, the red rim only shows outside
      const mt = new THREE.CanvasTexture(IMG_MATTE);
      const matte = new THREE.Mesh(new THREE.PlaneGeometry(AW, AH), new THREE.MeshBasicMaterial({ map: mt, transparent: true, depthWrite: false, color: 0x060506 }));
      matte.position.z = -0.04;
      athlete.add(glow, matte, body);
      const A0 = new V(0, -2.2, 0);
      athlete.position.copy(A0);
      scene.add(athlete);
      const onBody = (px, py, dz) => new V((px / IMG_SET.width - 0.5) * AW, (0.5 - py / IMG_SET.height) * AH, dz).add(athlete.position);

      // ---------- ropes ----------
      const braid = (() => {
        const c = document.createElement("canvas");
        c.width = 64;
        c.height = 256;
        const g = c.getContext("2d");
        for (let y = -64; y < 320; y += 16) {
          const grd = g.createLinearGradient(0, y, 64, y + 32);
          grd.addColorStop(0, "#1a0606");
          grd.addColorStop(0.5, "#b0362a");
          grd.addColorStop(1, "#1a0606");
          g.fillStyle = grd;
          g.beginPath();
          g.moveTo(0, y);
          g.lineTo(64, y + 32);
          g.lineTo(64, y + 44);
          g.lineTo(0, y + 12);
          g.fill();
        }
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      })();
      const PTS = { head: [580, 470], shL: [400, 520], shR: [745, 530], back: [580, 640], hip: [560, 780], elL: [300, 860], elR: [860, 880], hdL: [190, 1190], hdR: [1010, 1210], knee: [660, 930], foot: [705, 1150] };
      const KEYS = Object.keys(PTS);
      const TASKS = ["the email", "diet starts monday", "call back", "that project", "taxes", "the course", "reply later", "fix the car", "the essay", "gym plan", "book dentist", "pay rent"];
      const rnd = mulberry(11);
      const ropes = [];
      // 41 already tied (ten of them still snapping tight in the first second), six more shoot in: 41 -> 47
      const NEW = [0.35, 0.58, 0.8, 1.0, 1.18, 1.34];
      for (let i = 0; i < 47; i++) {
        const k = KEYS[i % KEYS.length];
        const px = PTS[k][0] + (rnd() - 0.5) * 40;
        const py = PTS[k][1] + (rnd() - 0.5) * 40;
        const dz = 0.1 + rnd() * 0.15;
        const a = rnd() * Math.PI * 2;
        const toward = i % 6 === 0;
        const A = toward ? new V(Math.cos(a) * (2.2 + rnd() * 1.5), Math.sin(a) * 3 - 0.5, 9 + rnd() * 3) : new V(Math.cos(a) * (8 + rnd() * 7), Math.sin(a) * (7 + rnd() * 6) - 1, -4 - rnd() * 14);
        const isNew = i >= 41;
        const tightAt = isNew ? NEW[i - 41] + 0.12 : i % 4 === 1 ? 0.05 + (i / 41) * 0.9 : -9;
        const sagBase = 0.4 + rnd();
        const mat = new THREE.MeshStandardMaterial({ map: braid, color: 0x9a2a20, roughness: 0.75, metalness: 0.05, bumpMap: braid, bumpScale: 0.6 });
        const mesh = new THREE.Mesh(new THREE.BufferGeometry(), mat);
        scene.add(mesh);
        ropes.push({ px, py, dz, A, r: 0.035 + rnd() * 0.025, sagBase, isNew, shootAt: isNew ? NEW[i - 41] : -9, tightAt, mesh, toward });
      }
      // tags ride their ropes; never in the headline's zone (they're placed low on the frame)
      function makeTag(text) {
        const c = document.createElement("canvas");
        c.width = 700;
        c.height = 150;
        const g = c.getContext("2d");
        g.font = '800 64px "Manrope"';
        const tw = Math.min(640, g.measureText(text).width + 70);
        g.fillStyle = "rgba(12,10,10,0.92)";
        g.strokeStyle = "#ff3a2a";
        g.lineWidth = 5;
        g.beginPath();
        g.roundRect((700 - tw) / 2, 22, tw, 106, 18);
        g.fill();
        g.stroke();
        g.fillStyle = "#f3efe8";
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillText(text, 350, 77);
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        const m = new THREE.Mesh(new THREE.PlaneGeometry(0.34 * 4.67, 0.34), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthTest: false, toneMapped: false }));
        m.renderOrder = 10;
        tagScene.add(m);
        return m;
      }
      let ti = 0;
      ropes.forEach((r, i) => {
        if (!r.toward && i % 3 === 0 && ti < TASKS.length && r.A.y < 4) r.tag = makeTag(TASKS[ti++]);
      });

      // ================= the rest of the world (sprint, sparks, streaks) =================
      const ATH2 = new THREE.Group();
      {
        const h = 6.6;
        const w = h * (IMG_SPRINT.width / IMG_SPRINT.height);
        const b2 = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: graded(IMG_SPRINT), alphaTest: 0.12 }));
        const g2 = silhouetteGlow(IMG_SPRINT, 14, "#ff2a1a");
        const gl2 = new THREE.Mesh(new THREE.PlaneGeometry(w * (g2.image.width / IMG_SPRINT.width), h * (g2.image.height / IMG_SPRINT.height)), new THREE.MeshBasicMaterial({ map: g2, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, color: new THREE.Color(1.6, 1.6, 1.6), opacity: 0.6 }));
        gl2.position.set(0.04, 0.02, -0.08);
        ATH2.add(gl2, b2);
        ATH2.userData = { w, h };
      }
      ATH2.position.set(0.05, -2.35, 1.2);
      ATH2.rotation.z = -0.04;
      ATH2.visible = false;
      scene.add(ATH2);
      // speed streaks in three depth layers (they stream past during the sprint)
      const STREAKS = [];
      {
        const r = mulberry(77);
        for (let i = 0; i < 70; i++) {
          const layer = i % 3;
          const z = [-8, -3, 4.5][layer] + (r() - 0.5) * 2;
          const len = [6, 4, 2.5][layer] * (0.6 + r());
          const hot = i % 5 === 0;
          const m = new THREE.Mesh(new THREE.PlaneGeometry(len, (0.012 + r() * 0.03) * (layer === 2 ? 1.4 : 1)), new THREE.MeshBasicMaterial({ color: hot ? new THREE.Color(2.4, 0.35, 0.25) : new THREE.Color(0.75, 0.7, 0.7), transparent: true, opacity: (0.2 + r() * 0.4) * (layer === 2 ? 0.55 : 1), blending: THREE.AdditiveBlending, depthWrite: false }));
          m.visible = false;
          scene.add(m);
          STREAKS.push({ m, x0: r() * 40 - 20, y: -6 + r() * 10, z, speed: [0.55, 1, 1.9][layer], len });
        }
      }
      // torn rope ends trailing the sprinter
      const TRAIL = [0, 1, 2].map((i) => {
        const mesh = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshStandardMaterial({ map: braid, color: 0x9a2a20, roughness: 0.75, bumpMap: braid, bumpScale: 0.6 }));
        mesh.visible = false;
        scene.add(mesh);
        return { mesh, P: new V(-2.2 - i * 0.55, -0.2 - i * 1.1, 1.3), len: 3.2 + i * 0.8, ph: i * 1.7 };
      });
      // sparks: one buffer for every live spark, rebuilt each frame from its age
      const SPK_MAX = 47 * 34 + 200;
      const spkPos = new Float32Array(SPK_MAX * 6);
      const spkCol = new Float32Array(SPK_MAX * 6);
      const spkGeo = new THREE.BufferGeometry();
      spkGeo.setAttribute("position", new THREE.BufferAttribute(spkPos, 3));
      spkGeo.setAttribute("color", new THREE.BufferAttribute(spkCol, 3));
      const spkLines = new THREE.LineSegments(spkGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
      spkLines.frustumCulled = false;
      scene.add(spkLines);
      const flareMat = () => new THREE.ShaderMaterial({ uniforms: { uI: { value: 0 } }, vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `, fragmentShader: `uniform float uI; varying vec2 vUv; void main(){ float r=length(vUv-0.5)*2.0; float g=exp(-r*r*7.0); gl_FragColor=vec4(vec3(3.0,1.1,0.4)*g*uI,1.0);} `, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });

      // ---------- the cut schedule: three deliberate cuts, then an accelerating cascade to zero ----------
      {
        const order = ropes.map((r, i) => i).filter((i) => !ropes[i].toward);
        const nearOnes = ropes.map((r, i) => i).filter((i) => ropes[i].toward);
        const lead = [order[2], order[5], order[9]];
        const rest = nearOnes.concat(order.filter((i) => !lead.includes(i)));
        const times = [9.22, 10.05, 10.62];
        rest.forEach((_, k) => times.push(11.05 + 1.85 * Math.pow(k / (rest.length - 1), 0.62)));
        [...lead, ...rest].forEach((ri, k) => {
          const r = ropes[ri];
          r.cutAt = times[k];
          r.cutF = 0.16 + rnd() * 0.1;
          r.far = new THREE.Mesh(new THREE.BufferGeometry(), r.mesh.material);
          r.far.visible = false;
          scene.add(r.far);
          r.flare = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.4), flareMat());
          r.flare.visible = false;
          scene.add(r.flare);
          const sr = mulberry(100 + ri);
          r.spk = Array.from({ length: 34 }, () => ({ d: new V(sr() * 2 - 1, sr() * 2 - 0.6, sr() * 2 - 1).normalize(), v: 2 + sr() * 5, k: 2 + sr() * 4 }));
        });
      }

      // ---------- camera: Hermite stations after the approved hook ----------
      const hookCam = (t) => {
        const u = c3(seg(t, 0, 3.6));
        return { p: new V(lerp(-2.0, 0.9, u), lerp(0.9, -0.1, u), lerp(16.8, 12.4, u)), q: new V(lerp(-0.35, 0.1, u), lerp(-0.45, -0.8, u), 0) };
      };
      const C = new V(0, -1.2, 0);
      const orbit = (deg, R, y) => new V(C.x + Math.sin((deg * Math.PI) / 180) * R, y, C.z + Math.cos((deg * Math.PI) / 180) * R);
      function camAt(t) {
        if (t < 3) return hookCam(t);
        if (t < 9.0) {
          // the orbit, then a dead stop at 6.2
          const u = c3(seg(t, 3, 6.2));
          const h = hookCam(3);
          const a0 = (Math.atan2(h.p.x - C.x, h.p.z - C.z) * 180) / Math.PI;
          const R0 = Math.hypot(h.p.x - C.x, h.p.z - C.z);
          const p = orbit(lerp(a0, 32, u), lerp(R0, 10.6, u), lerp(h.p.y, 0.6, u));
          return { p, q: new V(lerp(h.q.x, 0.4, u), lerp(h.q.y, -0.9, u), 0) };
        }
        if (t < 13.05) {
          // after the blade: swing back toward her front and close in as the ropes go
          const u = c3(seg(t, 9.0, 13.2));
          return { p: orbit(lerp(32, 6, u), lerp(10.6, 9.9, u), lerp(0.6, 0.0, u)), q: new V(lerp(0.4, 0.05, u), lerp(-0.9, -0.7, u), 0) };
        }
        // the sprint: a tracking camera running with him, decelerating into a hero hold
        const u = c3(seg(t, 13.05, 18));
        return { p: new V(lerp(0.35, 0.15, u), lerp(0.25, 0.15, u), lerp(14.8, 13.9, u)), q: new V(lerp(0.1, 0.0, u), lerp(-0.6, -0.65, u), 0) };
      }
      const kick = (t, at) => (t > at && t < at + 0.25 ? Math.exp(-(t - at) * 18) * Math.sin((t - at) * 90) : 0);

      // ---------- post: depth of field, tags, bloom, zoom-blur whip ----------
      const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType }));
      composer.setPixelRatio(1);
      composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      const bokeh = new BokehPass(scene, camera, { focus: 13.8, aperture: 0.0026, maxblur: 0.012 });
      composer.addPass(bokeh);
      const tagPass = new RenderPass(tagScene, camera);
      tagPass.clear = false;
      composer.addPass(tagPass);
      composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), 0.7, 0.5, 0.8));
      const zoomBlur = new ShaderPass({
        uniforms: { tDiffuse: { value: null }, uS: { value: 0 }, uC: { value: new THREE.Vector2(0.5, 0.45) } },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `uniform sampler2D tDiffuse; uniform float uS; uniform vec2 uC; varying vec2 vUv;
          void main(){ vec2 d = vUv - uC; vec4 acc = vec4(0.0); float tot = 0.0;
            for (int i = 0; i < 16; i++) { float k = float(i) / 15.0; float w = 1.0 - k * 0.6; acc += texture2D(tDiffuse, vUv - d * uS * k) * w; tot += w; }
            gl_FragColor = acc / tot; }`,
      });
      composer.addPass(zoomBlur);
      composer.addPass(new OutputPass());

      // ---------- copy ----------
      const $ = (id) => document.getElementById(id);
      const BLOCKS = [
        { id: "t1", in: 0, out: 3.05, lines: ["l1", "l2"], ins: [0, 1.46] },
        { id: "t2", in: 3.3, out: 5.95, lines: ["t2a", "t2b"], ins: [3.3, 3.5] },
        { id: "t3", in: 6.3, out: 8.95, lines: ["t3a", "t3b", "t3c", "t3e"], ins: [6.3, 6.5, 6.65, 6.85] },
        { id: "t4", in: 9.55, out: 12.85, lines: ["t4a", "t4b"], ins: [9.55, 9.75] },
        { id: "t5", in: 13.75, out: 99, lines: ["t5a", "t5b", "t5c"], ins: [13.75, 13.95, 16.6] },
      ];
      function copy(t) {
        BLOCKS.forEach((b, bi) => {
          const el = $(b.id);
          const on = t >= b.in - 0.01 && t < b.out + 0.3;
          el.style.visibility = on ? "visible" : "hidden";
          if (!on) return;
          const o = eo(seg(t, b.out, b.out + 0.25));
          el.style.opacity = (1 - o).toFixed(3);
          el.style.transform = `translateY(${(-o * 40).toFixed(1)}px)`;
          el.style.filter = o > 0.01 ? `blur(${(o * 14).toFixed(1)}px)` : "none";
          if (bi === 0) return; // the hook keeps its approved animation
          b.lines.forEach((lid, j) => {
            const u = eo(seg(t, b.ins[j], b.ins[j] + 0.4));
            const ln = $(lid);
            ln.style.opacity = u.toFixed(3);
            ln.style.transform = `translateY(${((1 - u) * 46).toFixed(1)}px)`;
            ln.style.filter = u < 0.98 ? `blur(${((1 - u) * 12).toFixed(1)}px)` : "none";
          });
        });
      }

      // ---------- render ----------
      function render(t) {
        const f = Math.round(t * FPS);
        const c = camAt(t);
        const kk = kick(t, 9.2) * 0.12 + kick(t, 13.0) * 0.2;
        camera.position.copy(c.p).add(new V(kk, kk * 0.6, 0));
        camera.lookAt(c.q);
        const sprint = t >= 13.05;
        athlete.visible = !sprint;
        ATH2.visible = sprint;

        // how free is she: 0 tied down, 1 every rope gone
        let cuts = 0;
        ropes.forEach((r) => {
          if (t >= r.cutAt) cuts++;
        });
        const free = sst(cuts / 47);
        let jx = 0;
        let jy = 0;
        let flare = 0;
        ropes.forEach((r) => {
          const u = t - r.tightAt;
          if (u > 0 && u < 0.6) {
            const e = Math.exp(-u * 10) * Math.sin(u * 46);
            jx += e * 0.018 * Math.sign(r.A.x);
            jy += e * 0.012;
            flare += Math.exp(-u * 8) * (r.isNew ? 1 : 0.4);
          }
          const uc = t - r.cutAt;
          if (uc > 0 && uc < 0.5) {
            jx -= Math.exp(-uc * 9) * Math.sin(uc * 40) * 0.03 * Math.sign(r.A.x);
            flare += Math.exp(-uc * 7) * 0.7;
          }
        });
        // strain: a shudder that grows while she is held, gone when she's free
        const strain = t > 3 && t < 9 ? 0.006 * Math.sin(t * 61) * Math.sin(t * 13.7) : 0;
        athlete.position.set(A0.x + jx + strain, A0.y + jy + 0.45 * free, A0.z);
        athlete.rotation.z = -0.07 * free;
        // the drain: the rim dims while nothing happens, and comes back with every cut
        const drain = t < 6.3 ? 1 : t < 9.0 ? lerp(1, 0.35, sst(seg(t, 6.4, 8.8))) : lerp(0.35, 1.25, free);
        glowMat.opacity = (0.5 + 0.3 * Math.min(1, flare)) * drain;
        rim2.intensity = (60 + 90 * Math.min(1, flare)) * drain;
        athlete.updateMatrixWorld(true);

        // ropes
        let n = 41;
        let sp = 0;
        ropes.forEach((r) => {
          if (sprint) {
            r.mesh.visible = false;
            r.far.visible = false;
            r.flare.visible = false;
            if (r.tag) r.tag.visible = false;
            return;
          }
          const P = onBody(r.px, r.py, r.dz);
          if (r.isNew && t < r.shootAt) {
            r.mesh.visible = false;
            if (r.tag) r.tag.visible = false;
            return;
          }
          if (r.isNew) n++;
          const creak = t > 6.3 && t < 9.0 ? 0.05 * Math.sin(t * 9 + r.sagBase * 7) : 0;
          let sag = r.sagBase * (0.25 + 2.8 * Math.max(0, r.tightAt < 0 ? 0 : spring(t - r.tightAt))) + 0.25 * (r.tightAt < 0 ? 0 : spring(t - r.tightAt)) + creak;
          let near = P;
          if (r.isNew) near = r.A.clone().lerp(P, eo(seg(t, r.shootAt, r.shootAt + 0.12)));
          const uc = t - r.cutAt;
          if (uc < 0) {
            r.mesh.visible = true;
            r.far.visible = false;
            r.flare.visible = false;
            const curve = ropeCurve(near, r.A, sag);
            setTube(r.mesh, curve, r.r);
            if (r.tag) {
              r.tag.visible = true;
              r.tag.position.copy(curve.getPoint(0.26));
              r.tag.lookAt(camera.position);
              r.tag.material.opacity = 1;
            }
            return;
          }
          // cut: the near stub drops off her, the far end whips back to its anchor
          const full = ropeCurve(P, r.A, sag);
          const X = full.getPoint(r.cutF);
          const stubEnd = X.clone().add(new V(0, -1.8 * Math.pow(seg(uc, 0, 0.6), 2), 0.4 * seg(uc, 0, 0.6)));
          r.mesh.visible = uc < 0.55;
          if (r.mesh.visible) setTube(r.mesh, ropeCurve(P, stubEnd, 2.5 * seg(uc, 0, 0.3)), r.r);
          const back = 1 - Math.exp(-uc * 5);
          const S = X.clone().lerp(r.A, 0.92 * back);
          r.far.visible = back < 0.9;
          if (r.far.visible) setTube(r.far, ropeCurve(S, r.A, r.sagBase * 0.4 + 3.5 * Math.exp(-uc * 5) * Math.sin(uc * 30)), r.r);
          if (r.tag) {
            r.tag.visible = uc < 0.5;
            r.tag.position.copy(full.getPoint(0.26)).add(new V(0, -2.2 * uc * uc, 0));
            r.tag.material.opacity = 1 - seg(uc, 0.15, 0.5);
          }
          r.flare.visible = uc < 0.4;
          r.flare.position.copy(X);
          r.flare.lookAt(camera.position);
          r.flare.material.uniforms.uI.value = Math.exp(-uc * 9) * 1.2;
          if (uc < 0.8) {
            for (const s of r.spk) {
              if (sp >= SPK_MAX) break;
              const a = uc;
              const p0 = X.clone().addScaledVector(s.d, s.v * a);
              p0.y -= 3.5 * a * a;
              const p1 = p0.clone().addScaledVector(s.d, -0.05 - s.v * 0.025);
              const k = s.k * Math.exp(-a * 5);
              spkPos.set([p0.x, p0.y, p0.z, p1.x, p1.y, p1.z], sp * 6);
              spkCol.set([k, k * 0.75, k * 0.4, k, k * 0.22, k * 0.08], sp * 6);
              sp++;
            }
          }
        });
        // trailing torn ropes + sparks behind the sprinter
        TRAIL.forEach((tr, i) => {
          tr.mesh.visible = sprint;
          if (!sprint) return;
          const tt = t - 13.05;
          const E = tr.P.clone().add(new V(-tr.len, Math.sin(tt * 7 + tr.ph) * 0.35 - 0.2, -1.2 - i));
          setTube(tr.mesh, ropeCurve(tr.P, E, 1.2 + Math.sin(tt * 9 + tr.ph) * 1.5), 0.045);
          const sr = mulberry(500 + i + Math.floor(tt * 20));
          for (let q = 0; q < 14 && sp < SPK_MAX; q++) {
            const p0 = E.clone().add(new V(sr() * 0.6, (sr() - 0.5) * 0.4, (sr() - 0.5) * 0.4));
            const p1 = p0.clone().add(new V(-0.25 - sr() * 0.4, -sr() * 0.1, 0));
            const k = (1.5 + sr() * 2.5) * (1 - sst(seg(t, 16.6, 18)) * 0.7);
            spkPos.set([p0.x, p0.y, p0.z, p1.x, p1.y, p1.z], sp * 6);
            spkCol.set([k, k * 0.6, k * 0.3, k, k * 0.2, k * 0.08], sp * 6);
            sp++;
          }
        });
        spkGeo.setDrawRange(0, sp * 2);
        spkGeo.attributes.position.needsUpdate = true;
        spkGeo.attributes.color.needsUpdate = true;
        // the sprint: streaks rush past, decelerating into the hold
        const ts = Math.max(0, t - 13.05);
        const travel = 11 * ts - 9 * Math.max(0, ts - 3.4) * Math.max(0, ts - 3.4) / (2 * 1.55) * 0; // constant pace, then ease below
        const pace = ts < 3.4 ? 11 * ts : 11 * 3.4 + 11 * (1.55 - (1.55 - Math.min(1.55, ts - 3.4)) ** 2 / 1.55) * 0.55;
        STREAKS.forEach((s) => {
          s.m.visible = sprint;
          if (!sprint) return;
          let x = ((s.x0 - pace * s.speed) % 40) + 20;
          if (x < -20) x += 40;
          s.m.position.set(x, s.y, s.z);
        });
        bg.position.x = sprint ? -pace * 0.08 : 0;
        bg.material.map = bg.material.map;

        // counters
        const left = 47 - cuts;
        const cnt = t < 9.2 ? n : left;
        $("cnt").textContent = String(cnt);
        $("cnt4").textContent = String(left);
        const e = Math.round(lerp(100, 6, sst(seg(t, 6.5, 8.8))));
        $("e3v").textContent = e + "%";
        $("e3f").style.transform = `scaleX(${(e / 100).toFixed(3)})`;

        // depth of field: hook rack, a pull to the near ropes in the orbit, back to her; on him in the sprint
        const dHer = c.p.distanceTo(sprint ? ATH2.position : new V(0, -1.2, 0));
        let fd = lerp(9.5, dHer, c3(seg(t, 0.05, 0.6)));
        fd = lerp(fd, 6.5, sst(seg(t, 3.9, 4.6)) * (1 - sst(seg(t, 5.0, 5.7))));
        bokeh.uniforms.focus.value = fd;

        // transitions: the blade (9.05) and the release (13.0)
        const sl = seg(t, 9.03, 9.27);
        $("slash").style.visibility = sl > 0 && sl < 1 ? "visible" : "hidden";
        $("slash").style.transform = `translate(${lerp(-1900, 1500, eo(sl)).toFixed(1)}px, 760px) rotate(-24deg)`;
        const fl = (t >= 9.17 && t < 9.17 + 2 / FPS ? 0.85 : 0) + (t >= 13.0 && t < 13.0 + 3 / FPS ? 1 : 0) + (t >= 13.1 ? 0.6 * Math.exp(-(t - 13.1) * 9) * (t < 13.6 ? 1 : 0) : 0);
        $("flash").style.opacity = Math.min(1, fl).toFixed(3);
        zoomBlur.uniforms.uS.value = (t >= 13.0 ? 0.5 * Math.exp(-(t - 13.0) * 5.5) : 0) + (t >= 9.17 ? 0.08 * Math.exp(-(t - 9.17) * 12) : 0);

        // hook copy (approved animation)
        const u1 = eo(seg(t, 0, 0.55));
        $("l1").style.transform = `translateY(${((1 - u1) * 14).toFixed(2)}px)`;
        $("l1").style.letterSpacing = `${lerp(0.015, 0, u1).toFixed(4)}em`;
        $("l1").style.filter = u1 < 0.98 ? `blur(${((1 - u1) * 6).toFixed(2)}px)` : "none";
        const t2 = t - 1.46;
        const u2 = eo(seg(t, 1.46, 1.62));
        const wob = t2 > 0.16 ? Math.exp(-(t2 - 0.16) * 9) * Math.sin((t2 - 0.16) * 40) * 18 : 0;
        $("l2").style.opacity = u2.toFixed(3);
        $("l2").style.transform = `translateX(${((1 - u2) * 220 + wob).toFixed(2)}px)`;
        $("l2").style.filter = u2 < 0.98 ? `blur(${((1 - u2) * 14).toFixed(2)}px)` : "none";
        $("kick").style.opacity = eo(seg(t, 0.1, 0.5)).toFixed(3);
        copy(t);
        $("grT").setAttribute("seed", String((f % 24) + 1));
        composer.render();
      }
      function ropeCurve(P, A, sag) {
        const mid = new V().addVectors(P, A).multiplyScalar(0.5);
        mid.y -= sag * P.distanceTo(A) * 0.06;
        return new THREE.QuadraticBezierCurve3(P, mid, A);
      }
      function setTube(mesh, curve, r) {
        mesh.geometry.dispose();
        mesh.geometry = new THREE.TubeGeometry(curve, 40, r, 8, false);
      }
      braid.repeat.set(1, 18);

      const tl = gsap.timeline({ paused: true });
      const DR = { _t: 0 };
      Object.defineProperty(DR, "t", {
        get() {
          return this._t;
        },
        set(v) {
          this._t = v;
          render(v);
        },
      });
      tl.fromTo(DR, { t: 0 }, { t: DUR, duration: DUR, ease: "none", immediateRender: false }, 0);
      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
