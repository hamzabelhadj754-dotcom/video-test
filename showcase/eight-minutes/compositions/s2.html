<template>
  <style>
    #root { position: absolute; inset: 0; }
    #s2-wrap { position: absolute; left: 0; right: 0; top: 330px; display: flex; flex-direction: column; align-items: center; text-align: center; color: #f4f1ea; }
    #s2-label { font-family: "JetBrains Mono", monospace; font-size: 32px; letter-spacing: 0.45em; margin-right: -0.45em; opacity: 0.8; }
    #s2-label span { display: inline-block; }
    #s2-num { font-family: "Inter", sans-serif; font-weight: 900; font-size: 200px; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; margin-top: 26px; }
    #s2-unit { font-family: "JetBrains Mono", monospace; font-size: 44px; letter-spacing: 0.3em; color: #ffb547; margin-top: 8px; }
    #s2-every { font-family: "Inter", sans-serif; font-weight: 700; font-size: 64px; margin-top: 26px; }
    #s2-every span { display: inline-block; }
  </style>
  <div id="root" data-composition-id="s2" data-width="1080" data-height="1920">
    <div id="s2-wrap" class="clip" data-start="0" data-duration="3.6" data-layout-allow-overlap>
      <div id="s2-label"><span>S</span><span>P</span><span>E</span><span>E</span><span>D</span><span>&nbsp;</span><span>O</span><span>F</span><span>&nbsp;</span><span>L</span><span>I</span><span>G</span><span>H</span><span>T</span></div>
      <div id="s2-num">0</div>
      <div id="s2-unit">KM</div>
      <div id="s2-every"><span>every</span> <span>single</span> <span>second.</span></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // label: per letter, a frame apart
    tl.fromTo("#s2-label span", { opacity: 0.0, filter: "blur(4px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, stagger: 0.033, ease: "power2.out" }, 0.05);
    // the counter rolls while the photon launches; written by a setter so every seek updates it
    const num = document.getElementById("s2-num");
    const counter = { _v: 0 };
    Object.defineProperty(counter, "v", {
      get() { return this._v; },
      set(x) { this._v = x; num.textContent = Math.round(x).toLocaleString("en-US"); },
    });
    tl.fromTo(num, { opacity: 0, scale: 0.94, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 0.2);
    tl.fromTo(counter, { v: 0 }, { v: 299792, duration: 1.3, ease: "expo.out" }, 0.2);
    tl.fromTo("#s2-unit", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.9);
    // per word from grey to ink, no movement
    tl.fromTo("#s2-every span", { opacity: 0.18 }, { opacity: 1, duration: 0.18, stagger: 0.09, ease: "power2.out" }, 1.25);
    // exit: whole block blurs out with the camera's move
    tl.fromTo("#s2-wrap > *", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.22, stagger: 0.04, ease: "power3.in" }, 3.2);
    counter.v = 0;
    window.__timelines["s2"] = tl;
  </script>
</template>
